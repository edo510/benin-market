<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700;800&family=Bricolage+Grotesque:wght@600;700;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#f5f7f3;--surface:#fff;--text:#17251c;--muted:#6c796f;--green:#087443;--deep:#075b35;--soft:#e6f3ea;--yellow:#f4c542;--orange:#ff7900;--border:#e0e7e0} :root[data-theme=dark]{--bg:#101713;--surface:#19231c;--text:#edf5ee;--muted:#a3b1a6;--green:#55c58a;--deep:#2d9e64;--soft:#20392a;--border:#2c3b30}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:15px/1.45 "DM Sans",sans-serif;padding-bottom:82px}button,input,select,textarea{font:inherit}button{cursor:pointer}header{position:sticky;top:0;z-index:5;background:var(--surface);border-bottom:1px solid var(--border);padding:12px 15px;display:flex;align-items:center;justify-content:space-between}.brand{display:flex;align-items:center;gap:9px;border:0;background:none;color:var(--text);font-weight:800;font-size:21px}.logo{width:38px;height:38px;display:grid;place-items:center;background:linear-gradient(140deg,#087443 0 58%,#f4c542 58% 80%,#c93832 80%);color:white;border-radius:12px}.brand b{color:var(--green)}.iconbtn{width:39px;height:39px;border:1px solid var(--border);background:var(--surface);color:var(--text);border-radius:13px;font-size:19px}main{max-width:900px;margin:auto;padding:15px}.hero{background:linear-gradient(130deg,#064f30,#0c8750);border-radius:23px;color:white;padding:22px;position:relative;overflow:hidden}.eyebrow{font-size:11px;letter-spacing:1px;color:#ffe18a;font-weight:800}.hero h1{font:800 clamp(29px,7vw,40px)/1.08 "Bricolage Grotesque";margin:12px 0}.hero p{color:#e0f3e6}.search{position:relative}.search input{width:100%;border:0;background:white;color:#17251c;padding:14px 14px 14px 42px;border-radius:14px}.search span{position:absolute;left:14px;top:8px;font-size:23px;color:#607568}.trust{display:flex;gap:12px;flex-wrap:wrap;font-size:11px;margin-top:13px;color:#e4f4e8;font-weight:700}h2{font:800 23px/1.15 "Bricolage Grotesque";margin:0}h3{font:800 17px "Bricolage Grotesque";margin:0}.section-head{display:flex;justify-content:space-between;align-items:center;gap:10px;margin:23px 0 11px}.sub,.muted{color:var(--muted);font-size:12px}.textbtn{border:0;background:none;color:var(--green);font-weight:800;padding:6px}.catgrid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px;margin:12px 0 23px}.cat{border:0;background:none;color:var(--text);display:flex;flex-direction:column;align-items:center;gap:6px;font-size:10px;font-weight:700}.ci{width:49px;height:49px;border-radius:50%;background:var(--surface);border:1px solid var(--border);display:grid;place-items:center;font-size:22px}.cat.active .ci{background:var(--green);color:white}.chips{display:flex;gap:8px;overflow:auto;padding:4px 0 12px}.chip{flex:none;border:1px solid var(--border);background:var(--surface);color:var(--text);border-radius:13px;padding:9px 13px;font-size:12px;font-weight:800}.chip.on{background:var(--green);color:white}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.card{position:relative;text-align:left;padding:0;overflow:hidden;border:1px solid var(--border);border-radius:17px;background:var(--surface);color:var(--text);min-width:0}.photo,.placeholder{width:100%;aspect-ratio:1/1;object-fit:cover;display:grid;place-items:center;background:var(--soft)}.placeholder{font-size:44px;color:var(--green)}.cardbody{padding:10px}.price{font:800 17px "Bricolage Grotesque";color:var(--green)}.title{font-weight:700;font-size:13px;margin:5px 0;min-height:34px}.meta{font-size:11px;color:var(--muted)}.heart{position:absolute;right:8px;top:8px;border:0;background:#ffffffed;color:#24382c;border-radius:50%;width:34px;height:34px;font-size:18px}.panel{background:var(--surface);border:1px solid var(--border);border-radius:21px;padding:18px;margin-bottom:14px}label{display:block;font-size:13px;font-weight:800;margin-top:13px}input,select,textarea{display:block;width:100%;padding:13px;margin-top:6px;border:1px solid var(--border);border-radius:12px;background:var(--surface);color:var(--text)}textarea{resize:vertical}.btn{width:100%;padding:13px 16px;border:1px solid var(--green);border-radius:14px;background:var(--green);color:white;font-weight:800;margin-top:12px}.btn.orange{background:var(--orange);border-color:var(--orange)}.btn.ghost{background:transparent;color:var(--green);border-color:var(--border)}.btn.danger{background:transparent;color:#c93832;border-color:#c93832}.row{display:flex;gap:9px;align-items:center}.avatar{width:52px;height:52px;border-radius:50%;background:var(--soft);color:var(--green);display:grid;place-items:center;font-weight:900;font-size:20px;flex:none}.badge{display:inline-block;background:var(--soft);color:var(--green);padding:5px 9px;border-radius:20px;font-size:11px;font-weight:800}.menuitem{width:100%;display:flex;align-items:center;gap:12px;text-align:left;padding:15px 3px;border:0;border-bottom:1px solid var(--border);background:none;color:var(--text);font-weight:700}.menuitem span:first-child{width:27px;font-size:20px}.menuitem .arrow{margin-left:auto;color:var(--muted)}nav{position:fixed;z-index:10;bottom:0;left:0;right:0;background:var(--surface);border-top:1px solid var(--border);display:flex;justify-content:space-around;padding:7px 7px calc(7px + env(safe-area-inset-bottom))}nav button{border:0;background:none;color:var(--muted);flex:1;font-size:10px;font-weight:700;display:flex;flex-direction:column;align-items:center;gap:3px;padding:5px 0}nav .ni{font-size:21px}nav button.active{color:var(--green)}nav .plus{background:var(--green);color:white;width:47px;height:47px;flex:none;border-radius:50%;font-size:25px;margin-top:-18px}.empty{padding:27px;text-align:center;color:var(--muted);border:1px dashed var(--border);border-radius:15px;grid-column:1/-1}.notice{display:flex;gap:12px;padding:14px 0;border-bottom:1px solid var(--border)}.noticeicon{width:42px;height:42px;border-radius:50%;background:var(--soft);display:grid;place-items:center;color:var(--green);flex:none}.conversation{display:flex;gap:10px;align-items:center;padding:13px 0;border-bottom:1px solid var(--border)}.overlay{position:fixed;inset:0;z-index:20;background:#07160dcc;display:flex;align-items:flex-end;justify-content:center}.sheet{background:var(--bg);width:100%;max-width:700px;max-height:94%;overflow:auto;border-radius:24px 24px 0 0;padding:18px 18px calc(25px + env(safe-area-inset-bottom))}.close{float:right;border:0;border-radius:50%;width:38px;height:38px;background:var(--surface);color:var(--text);font-size:20px}.detailimg{width:calc(100% + 36px);margin:-18px -18px 15px;max-height:360px;aspect-ratio:4/3;object-fit:cover}.toast{position:fixed;bottom:95px;left:50%;transform:translateX(-50%);background:var(--text);color:var(--bg);padding:12px 16px;border-radius:12px;z-index:50;max-width:90%;font-size:13px}@media(min-width:620px){body{padding-bottom:0}main{padding:24px}.grid{grid-template-columns:repeat(3,minmax(0,1fr))}nav{position:static}nav button{flex-direction:row;justify-content:center;font-size:13px}nav .plus{margin:0}.overlay{align-items:center;padding:20px}.sheet{border-radius:24px}.catgrid{grid-template-columns:repeat(8,minmax(0,1fr))}}@media(min-width:900px){.grid{grid-template-columns:repeat(4,minmax(0,1fr))}}

.featuregrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;margin:16px 0}
.featuretile{border:1px solid var(--border);background:var(--surface);color:var(--text);border-radius:16px;padding:15px;text-align:left}
.featuretile b{display:block;margin:7px 0 3px}.filters{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin:10px 0 14px}

@media(max-width:380px){.filters,.featuregrid{grid-template-columns:1fr}}
</style></head>
<body>
<header><button class="brand" onclick="go('home')"><span class="logo">B</span><span>Bénin <b>Market</b></span></button><div><button class="iconbtn" onclick="go('notifications')">♧</button> <button class="iconbtn" onclick="go('profile')">♙</button></div></header>

<nav><button data-page="home" onclick="go('home')"><span class="ni">⌂</span>Accueil</button><button data-page="ads" onclick="go('ads')"><span class="ni">♢</span>Annonces</button><button data-page="publish" onclick="go('publish')" class="plus">＋</button><button data-page="messages" onclick="go('messages')"><span class="ni">☏</span>Messages</button><button data-page="profile" onclick="go('profile')"><span class="ni">♙</span>Profil</button></nav>

<script>
"use strict";
const SB_URL="https://gsbrfzrifnzmyvcnerrv.supabase.co",SB_KEY="sb_publishable_hMg7buwzeVqOvN8-ozE43g_rPzQ9dEc",sb=window.supabase.createClient(SB_URL,SB_KEY);
const CATS=[["Téléphones & Accessoires","📱"],["Électronique","💻"],["Maison & Déco","🏠"],["Mode & Beauté","👗"],["Véhicules","🚗"],["Immobilier","🏡"],["Services","🧰"],["Autres","✦"]];
const $=s=>document.querySelector(s),esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c])),money=n=>Number(n||0).toLocaleString("fr-FR")+" FCFA";
let page="home",user=null,ads=[],query="",category="Toutes",currentAd=null,authMode="in",busy=false,activeChat=null,messageChannel=null,presenceChannel=null,onlineUsers=new Set(),messageRefreshTimer=null;
const COMMUNES=["Toutes les communes","Abomey-Calavi","Abomey","Adjarra","Adjohoun","Aguégués","Aplahoué","Athiémé","Avrankou","Banikoara","Bassila","Bembéréké","Bohicon","Bopa","Boukoumbé","Cobly","Comè","Copargo","Cotonou","Covè","Dangbo","Dassa-Zoumè","Djakotomey","Djidja","Djougou","Dogbo","Glazoué","Gogounou","Grand-Popo","Houéyogbé","Ifangni","Kalalé","Kandi","Karimama","Kérou","Kétou","Klouékanmè","Kobli","Kouandé","Kpomassè","Lalo","Lokossa","Malanville","Matéri","N'Dali","Nikki","Ouidah","Ouaké","Péhunco","Pèrèrè","Pobè","Porto-Novo","Sakété","Savalou","Savè","Ségbana","Sinendé","So-Ava","Tanguiéta","Tchaourou","Toffo","Tori-Bossito","Toucountouna","Zagnanado","Za-Kpota","Zè","Zogbodomey","Zoukougbeu","Bantè","Kérou","Péhunco","Tanguieta","Natitingou","Toucountouna","Boukoumbé","Cobly","Matéri","Kouandé","Pèrèrè","Kalalé","Nikki","Sinendé","Ségbana","Karimama","Malanville","Banikoara","Gogounou","Kandi","Bembéréké","N'Dali","Tchaourou","Bassila","Copargo","Ouaké","Djougou"];
const CITIES=[...new Set(COMMUNES.filter(c=>c!=="Toutes les communes"))];
let selectedCommune="Toutes les communes";
let fav=new Set(JSON.parse(localStorage.getItem("bm-favorites")||"[]")),notes=JSON.parse(localStorage.getItem("bm-notifications")||"[]"),theme=localStorage.getItem("bm-theme")||"light";document.documentElement.dataset.theme=theme;
function toast(t){$("#toastbox").innerHTML=`<div class="toast">${esc(t)}</div>`;setTimeout(()=>$("#toastbox").innerHTML="",3000)}
function go(p){page=p;currentAd=null;$("#modal").innerHTML="";render();scrollTo({top:0,behavior:"smooth"})}
function nav(){document.querySelectorAll("nav [data-page]").forEach(b=>b.classList.toggle("active",b.dataset.page===page))}
function render(){nav();let a=$("#app");if(page==="home")home(a);else if(page==="ads")adsPage(a);else if(page==="publish")user?publishPage(a):authPage(a,"Connectez-vous pour publier");else if(page==="profile")user?profilePage(a):authPage(a,"Connexion ou inscription");else if(page==="favorites")favoritesPage(a);else if(page==="messages")messagesPage(a);else if(page==="notifications")notificationsPage(a);else if(page==="settings")settingsPage(a);else if(page==="help")helpPage(a);else if(page==="myads")myAdsPage(a);else if(page==="purchases")purchasesPage(a);else if(page==="payment")paymentPage(a);else if(page==="delivery")deliveryPage(a);else if(page==="wallet")walletPage(a);else if(page==="dating")datingPage(a);else if(page==="virtualcard")virtualCardPage(a);else if(page==="jobs")jobsPage(a);else if(page==="boost")boostPage(a);else if(page==="privacy")simple(a,"Confidentialité","Pour toute demande concernant vos données, contactez notre support.");else if(page==="terms")simple(a,"Conditions d’utilisation","Publiez des annonces exactes et légales. Vérifiez le produit et le vendeur avant tout paiement.")}
function filtered(){let q=query.toLowerCase().trim();return ads.filter(a=>(category==="Toutes"||a.category===category)&&(!q||[a.title,a.description,a.city,a.category].join(" ").toLowerCase().includes(q))&&(selectedCommune==="Toutes les communes"||a.city===selectedCommune)).sort((a,b)=>new Date(b.created_at||0)-new Date(a.created_at||0))}
function communeOptions(){return COMMUNES.map(c=>`<option ${selectedCommune===c?'selected':''}>${c}</option>`).join("")}
function communeFilter(){return `<label>Rechercher dans une commune<select onchange="selectedCommune=this.value;render()">${communeOptions()}</select></label>`}
function card(a){let img=a.image_url||(a.images&&a.images[0]);return `<article class="card" onclick="openAd('${esc(a.id)}')">${img?`<img class="photo" src="${esc(img)}" alt="${esc(a.title)}" loading="lazy">`:`<div class="placeholder">${(CATS.find(c=>c[0]===a.category)||["","🛍️"])[1]}</div>`}<button class="heart" onclick="event.stopPropagation();favorite('${esc(a.id)}')">${fav.has(String(a.id))?"♥":"♡"}</button><div class="cardbody"><div class="price">${money(a.price)}</div><div class="title">${esc(a.title)}</div><div class="meta">⌖ ${esc(a.city||"Bénin")}</div></div></article>`}
function home(a){a.innerHTML=`<section class="hero"><div class="eyebrow">🇧🇯 LE MARCHÉ BÉNINOIS</div><h1>Trouvez votre bonheur.</h1><p>Achetez, vendez et échangez près de chez vous.</p><div class="search"><span>⌕</span><input placeholder="Produit, marque, modèle, mot-clé…" value="${esc(query)}" oninput="query=this.value;drawHome()">${communeFilter()}</div><div class="trust"><span>✓ Transactions prudentes</span><span>✓ Contact direct</span><span>✓ Prix en FCFA</span></div></section><div class="section-head"><h2>Catégories</h2><button class="textbtn" onclick="go('ads')">Tout voir →</button></div><div class="catgrid">${CATS.map(([n,i])=>`<button class="cat" onclick="category='${n}';go('ads')"><span class="ci">${i}</span>${n}</button>`).join("")}</div><div class="section-head"><h2>Annonces récentes</h2><button class="textbtn" onclick="go('ads')">Voir tout →</button></div><div class="grid" id="homegrid"></div>`;drawHome()}
function drawHome(){let g=$("#homegrid");if(g)g.innerHTML=filtered().slice(0,8).map(card).join("")||'<div class="empty">Aucune annonce pour le moment. Publiez la première !</div>'}
function adsPage(a){a.innerHTML=`<div class="section-head"><h2>Annonces</h2></div><div class="search"><span>⌕</span><input placeholder="Produit, marque, modèle, mot-clé…" value="${esc(query)}" oninput="query=this.value;drawAds()"></div>${communeFilter()}<div class="chips">${["Toutes",...CATS.map(c=>c[0])].map(c=>`<button class="chip ${category===c?'on':''}" onclick="category='${c}';render()">${c}</button>`).join("")}</div><div class="grid" id="adgrid"></div><div class="featuregrid"><button class="featuretile" onclick="go('payment')">🔒<b>Paiement sécurisé</b><span class="muted">Préparer une commande</span></button><button class="featuretile" onclick="go('delivery')">🚚<b>Coursier & livraison</b><span class="muted">Demande et suivi</span></button></div>`;drawAds()}
function drawAds(){let g=$("#adgrid");if(g)g.innerHTML=filtered().map(card).join("")||'<div class="empty">Aucune annonce trouvée.</div>'}
function openAd(id){let a=ads.find(x=>String(x.id)===String(id));if(!a)return;currentAd=a;trackAdView(a);let img=a.image_url||(a.images&&a.images[0]);$("#modal").innerHTML=`<div class="overlay" onclick="closeModal()"><section class="sheet" onclick="event.stopPropagation()"><button class="close" onclick="closeModal()">×</button>${img?`<img class="detailimg" src="${esc(img)}">`:`<div class="placeholder">🛍️</div>`}<h2>${esc(a.title)}</h2><div class="price" style="font-size:26px">${money(a.price)}</div><p class="muted">⌖ ${esc(a.city||"Bénin")} · ${esc(a.category||"Autres")} · 👁 ${esc(getAdViews(a))} vues</p><button class="btn ghost" onclick="showSeller('${esc(a.seller_id||"")}')">Voir le profil du vendeur</button><span class="badge">✓ Annonce disponible</span><h3 style="margin-top:20px">Description</h3><p>${esc(a.description||"Aucune description.")}</p><button class="btn ghost" onclick="favorite('${esc(a.id)}')">${fav.has(String(a.id))?"♥ Retirer des favoris":"♡ Ajouter aux favoris"}</button><button class="btn" onclick="contactSeller('${esc(a.id)}')">Contacter le vendeur</button><button class="btn orange" onclick="startPayment('${esc(a.id)}')">Acheter avec paiement sécurisé</button><button class="btn ghost" onclick="startDelivery('${esc(a.id)}')">🚚 Trouver un coursier / livrer</button><button class="textbtn" onclick="reportAd('${esc(a.id)}')">Signaler cette annonce</button></section></div>`}
function closeModal(){$("#modal").innerHTML=""}
function favorite(id){id=String(id);fav.has(id)?fav.delete(id):fav.add(id);localStorage.setItem("bm-favorites",JSON.stringify([...fav]));toast(fav.has(id)?"Ajouté aux favoris":"Retiré des favoris");if(currentAd)openAd(id);else render()}
function favoritesPage(a){let rows=ads.filter(x=>fav.has(String(x.id)));a.innerHTML=`<div class="section-head"><h2>Mes favoris</h2></div><div class="grid">${rows.map(card).join("")||'<div class="empty">Touchez ♡ sur une annonce pour la sauvegarder ici.</div>'}</div>`}
function authPage(a,msg){a.innerHTML=`<div class="panel"><h2>${msg}</h2><p class="muted">Créez votre compte pour publier et gérer vos annonces.</p><div class="chips"><button class="chip ${authMode==='in'?'on':''}" onclick="authMode='in';render()">Connexion</button><button class="chip ${authMode==='up'?'on':''}" onclick="authMode='up';render()">Inscription</button></div><form id="authform">${authMode==='up'?'<label>Type de compte<select id="accounttype" required><option value="personal">Compte personnel</option><option value="professional">Compte professionnel</option></select></label><label>Sexe<select id="sex" required><option value="">Sélectionnez</option><option value="Femme">Femme</option><option value="Homme">Homme</option><option value="Préfère ne pas préciser">Préfère ne pas préciser</option></select></label><label>Nom de famille<input id="lastname" required autocomplete="family-name"></label><label>Prénom(s)<input id="firstname" required autocomplete="given-name"></label><label>Numéro de téléphone<input id="phone" required type="tel" autocomplete="tel" placeholder="+229…"></label>':''}<label>Email<input id="email" required type="email" autocomplete="email"></label><label>Mot de passe<input id="password" required type="password" minlength="6"></label><button class="btn">${authMode==='up'?'Créer mon compte':'Se connecter'}</button></form>${authMode==='in'?'<button class="textbtn" onclick="forgot()">Mot de passe oublié ?</button>':''}</div>`;$("#authform").onsubmit=authSubmit}
async function authSubmit(e){e.preventDefault();let email=$("#email").value.trim(),password=$("#password").value;try{let r=authMode==="up"?await sb.auth.signUp({email,password,options:{data:{name:($("#firstname").value.trim()+" "+$("#lastname").value.trim()).trim(),first_name:$("#firstname").value.trim(),last_name:$("#lastname").value.trim(),phone:$("#phone").value.trim(),sex:$("#sex").value,account_type:$("#accounttype").value}}}):await sb.auth.signInWithPassword({email,password});if(r.error)throw r.error;if(authMode==="up"&&!r.data.session)return toast("Vérifiez votre email pour confirmer l’inscription.");user=r.data.user;toast("Connexion réussie");go("profile")}catch(e){toast(e.message)}}
async function forgot(){let email=prompt("Votre adresse email");if(email){let {error}=await sb.auth.resetPasswordForEmail(email,{redirectTo:location.href});toast(error?error.message:"Si le compte existe, un lien a été envoyé.")}}
function publishPage(a){a.innerHTML=`<div class="panel"><h2>Publier une annonce</h2><p class="muted">Ajoutez des photos et les informations du produit.</p><form id="pubform"><label>Photos (5 maximum)<input id="photos" type="file" accept="image/*" multiple></label><div id="preview" class="row" style="flex-wrap:wrap"></div><label>Titre<input id="title" required maxlength="90" placeholder="Ex. iPhone 13 en très bon état"></label><label>Catégorie<select id="category">${CATS.map(c=>`<option>${c[0]}</option>`).join("")}</select></label><label>Prix (FCFA)<input id="price" type="number" min="1" required placeholder="250000"></label><label>Ville<select id="city">${CITIES.map(c=>`<option>${c}</option>`).join("")}</select></label><label>Description<textarea id="description" rows="4"></textarea></label><button class="btn" id="pubbtn">Publier l’annonce</button></form></div>`;$("#photos").onchange=()=>$("#preview").innerHTML=[...$("#photos").files].slice(0,5).map(f=>`<img style="width:65px;height:65px;object-fit:cover;border-radius:10px" src="${URL.createObjectURL(f)}">`).join("");$("#pubform").onsubmit=publish}
async function publish(e){e.preventDefault();let b=$("#pubbtn");b.disabled=true;try{let images=[];for(let f of [...$("#photos").files].slice(0,5)){let path=user.id+"/"+Date.now()+"-"+Math.random().toString(36).slice(2,7)+".jpg";let up=await sb.storage.from("photos").upload(path,f,{upsert:false,contentType:f.type});if(up.error)throw up.error;images.push(sb.storage.from("photos").getPublicUrl(path).data.publicUrl)}let city=$("#city").value,{error}=await sb.from("ads").insert({seller_id:user.id,title:$("#title").value.trim(),category:$("#category").value,price:Number($("#price").value),city,description:$("#description").value.trim(),image_url:images[0]||null,images});if(error)throw error;await loadAds();notes.unshift({icon:"＋",title:"Annonce publiée",body:"Votre annonce a été publiée.",date:new Date().toLocaleString("fr-FR")});localStorage.setItem("bm-notifications",JSON.stringify(notes));toast("Annonce publiée");go("ads")}catch(e){toast("Publication impossible : "+e.message)}finally{b.disabled=false}}
function profilePage(a){let name=user.user_metadata?.name||user.email?.split("@")[0]||"Mon profil",mine=ads.filter(x=>x.seller_id===user.id);a.innerHTML=`<div class="panel" style="padding:0;overflow:hidden"><div style="background:linear-gradient(130deg,#075b35,#0b8750);color:white;padding:22px"><div class="row"><div class="avatar">${esc(name[0].toUpperCase())}</div><div><h2>${esc(name)}</h2><p>Membre de Bénin Market</p><span class="badge">${user.user_metadata?.account_type==="professional"?"✓ Compte professionnel":"✓ Compte personnel"}</span>${user.user_metadata?.account_type==="professional"?'<div style="margin-top:8px"><span class="badge" style="background:#f4c542;color:#17251c">★ VENDEUR PROFESSIONNEL</span></div>':""}</div></div><button class="btn ghost" style="color:white" onclick="editProfile()">Modifier le profil</button></div><div class="row" style="text-align:center;padding:16px"><div><h2>${mine.length}</h2><small>Annonces</small></div><div><h2>${mine.filter(x=>x.sold).length}</h2><small>Vendues</small></div><div><h2>${fav.size}</h2><small>Favoris</small></div></div></div><div class="panel"><button class="menuitem" onclick="go('myads')"><span>▤</span>Mes annonces <span class="arrow">›</span></button><button class="menuitem" onclick="go('purchases')"><span>🛍</span>Mes achats <span class="arrow">›</span></button>

async function editProfile(){let name=prompt("Nom à afficher",user.user_metadata?.name||"");if(name===null)return;let {error}=await sb.auth.updateUser({data:{name:name.trim()}});toast(error?error.message:"Profil modifié.");if(!error){user.user_metadata.name=name.trim();render()}}
function myAdsPage(a){let mine=ads.filter(x=>x.seller_id===user.id);a.innerHTML=`<div class="section-head"><h2>Mes annonces</h2><button class="textbtn" onclick="go('publish')">＋ Publier</button></div><div class="grid">${mine.map(x=>`${card(x)}<div class="panel"><span class="badge">${x.sold?"Vendu":"En ligne"}</span><button class="btn ghost" onclick="markSold('${esc(x.id)}')">${x.sold?"Remettre en vente":"Marquer vendu"}</button><button class="btn danger" onclick="deleteAd('${esc(x.id)}')">Supprimer</button></div>`).join("")||'<div class="empty">Vous n’avez pas encore publié d’annonce.</div>'}</div>`}
async function markSold(id){let a=ads.find(x=>String(x.id)===String(id));let {error}=await sb.from("ads").update({sold:!a.sold}).eq("id",id);if(error)return toast(error.message);await loadAds();render()}
async function deleteAd(id){if(!confirm("Supprimer cette annonce ?"))return;let {error}=await sb.from("ads").delete().eq("id",id);if(error)return toast(error.message);await loadAds();render()}
async function messagesPage(a){
 if(!user){authPage(a,"Connectez-vous pour accéder aux messages");return}
 a.innerHTML=`<div class="section-head"><h2>Messages</h2><button class="textbtn" onclick="loadConversations()">Actualiser</button></div><div class="panel" id="conversationlist">Chargement des conversations…</div><div class="panel" id="chatpanel"><div class="empty">Choisissez une conversation pour afficher les messages.</div></div>`;
 await loadConversations();
}
function shortUser(id){return String(id||"").slice(0,8)}
function isOnline(id){return onlineUsers.has(String(id))}
async function loadConversations(){
 const list=$("#conversationlist");if(!list||!user)return;
 try{
  const {data,error}=await sb.from("messages").select("id,sender_id,recipient_id,content,read_at,created_at").or(`sender_id.eq.${user.id},recipient_id.eq.${user.id}`).order("created_at",{ascending:false}).limit(300);
  if(error)throw error;
  const map=new Map();(data||[]).forEach(m=>{const other=m.sender_id===user.id?m.recipient_id:m.sender_id;if(other&&!map.has(other))map.set(other,m)});
  const entries=[...map.entries()];
  list.innerHTML=entries.map(([id,m])=>`<button class="menuitem" onclick="openConversation('${esc(id)}')"><span>👤</span><span style="flex:1"><b>${esc(m.sender_id===user.id?'Conversation avec '+shortUser(id):'Conversation avec '+shortUser(id))}</b><br><small class="muted">${esc((m.content||'').slice(0,55))}</small></span><span class="badge" style="background:${isOnline(id)?'var(--soft)':'var(--bg)'};color:${isOnline(id)?'var(--green)':'var(--muted)'}">${isOnline(id)?'En ligne':'Hors ligne'}</span></button>`).join("")||'<div class="empty">Aucune conversation. Ouvrez une annonce et appuyez sur « Contacter le vendeur ».</div>';
  if(activeChat)await openConversation(activeChat,false);
 }catch(e){list.innerHTML='<div class="empty">La messagerie nécessite la table Supabase « messages » et ses règles de sécurité. Exécutez le SQL de configuration fourni avec le code.</div>';console.error(e)}
}
async function openConversation(id,refreshList=true){
 if(!user)return;activeChat=String(id);const panel=$("#chatpanel");if(!panel)return;
 panel.innerHTML=`<div class="row" style="justify-content:space-between"><div><h3>Conversation</h3><div class="muted">Utilisateur ${esc(shortUser(id))} · ${isOnline(id)?'🟢 En ligne':'Hors ligne'}</div></div><button class="textbtn" onclick="activeChat=null;messagesPage($('#app'))">Retour</button></div><div id="chatmessages" style="max-height:42vh;overflow:auto;padding:12px 0">Chargement…</div><form id="sendmessageform"><label>Votre message<textarea id="messagecontent" rows="2" maxlength="4000" required placeholder="Écrivez votre message…"></textarea></label><button class="btn" id="sendmessagebtn">Envoyer</button></form>`;
 await refreshChat();
 const form=$("#sendmessageform");if(form)form.onsubmit=sendMessage;
 if(messageChannel){sb.removeChannel(messageChannel);messageChannel=null}
 messageChannel=sb.channel('bm-messages-'+user.id+'-'+id).on('postgres_changes',{event:'*',schema:'public',table:'messages'},payload=>{const m=payload.new||payload.old;if(m&&(m.sender_id===user.id&&m.recipient_id===id||m.sender_id===id&&m.recipient_id===user.id))refreshChat()}).subscribe();
}
async function refreshChat(){
 const box=$("#chatmessages");if(!box||!user||!activeChat)return;
 try{const {data,error}=await sb.from('messages').select('id,sender_id,recipient_id,content,read_at,created_at').or(`and(sender_id.eq.${user.id},recipient_id.eq.${activeChat}),and(sender_id.eq.${activeChat},recipient_id.eq.${user.id})`).order('created_at',{ascending:true}).limit(200);if(error)throw error;
  const rows=data||[];box.innerHTML=rows.map(m=>`<div style="display:flex;justify-content:${m.sender_id===user.id?'flex-end':'flex-start'};margin:8px 0"><div style="max-width:85%;background:${m.sender_id===user.id?'var(--soft)':'var(--surface)'};border:1px solid var(--border);border-radius:14px;padding:10px 12px"><div style="white-space:pre-wrap;overflow-wrap:anywhere">${esc(m.content)}</div><small class="muted">${esc(new Date(m.created_at).toLocaleString('fr-FR'))}${m.sender_id===user.id?' · '+(m.read_at?'Lu':'Envoyé'):''}</small></div></div>`).join('')||'<div class="empty">Commencez la conversation en envoyant un message.</div>';
  box.scrollTop=box.scrollHeight;
  const unread=rows.filter(m=>m.sender_id===activeChat&&m.recipient_id===user.id&&!m.read_at).map(m=>m.id);if(unread.length){const {error:readError}=await sb.from('messages').update({read_at:new Date().toISOString()}).in('id',unread);if(readError)console.warn(readError)}
 }catch(e){box.innerHTML='<div class="empty">Impossible de charger les messages. Vérifiez les tables et les autorisations Supabase.</div>';console.error(e)}
}
async function sendMessage(e){e.preventDefault();if(!user||!activeChat)return;const input=$("#messagecontent"),btn=$("#sendmessagebtn"),content=input.value.trim();if(!content)return;btn.disabled=true;try{const {error}=await sb.from('messages').insert({sender_id:user.id,recipient_id:activeChat,content});if(error)throw error;input.value='';await refreshChat();await loadConversations()}catch(err){toast('Envoi impossible : vérifiez la table messages et ses règles RLS.');console.error(err)}finally{btn.disabled=false}}
function setupPresence(){
 if(!user)return;if(presenceChannel){sb.removeChannel(presenceChannel);presenceChannel=null}
 presenceChannel=sb.channel('bm-online-users',{config:{presence:{key:user.id}}}).on('presence',{event:'sync'},()=>{onlineUsers=new Set(Object.keys(presenceChannel.presenceState()||{}));if(page==='messages')loadConversations()}).subscribe(async status=>{if(status==='SUBSCRIBED'){await presenceChannel.track({user_id:user.id,last_seen:new Date().toISOString()})}});
}

function paymentPage(a){let ad=currentAd;a.innerHTML=`<div class="section-head"><h2>🔒 Paiement sécurisé</h2></div><div class="panel"><div class="statusline">Le paiement réel nécessite un prestataire agréé et une vérification côté serveur.</div><p>Cette rubrique enregistre une demande de commande, mais ne débite pas le compte et ne bloque pas encore les fonds.</p>${ad?`<b>${esc(ad.title)}</b><div class="price">${money(ad.price)}</div>`:""}<form id="orderform"><label>ID de l’annonce<input id="orderad" value="${esc(ad?.id||"")}" required></label><label>Adresse ou point de remise<input id="orderaddress" required placeholder="Quartier, ville, point de rencontre"></label><label>Méthode souhaitée<select id="paymethod"><option>À définir avec le prestataire</option><option>Mobile Money</option><option>Carte bancaire</option><option>Paiement à la remise</option></select></label><button class="btn" id="orderbtn">Créer la demande de commande</button></form><p class="muted">Ne placez jamais de clé secrète de paiement dans ce fichier HTML. Configurez le prestataire et les règles RLS Supabase avant utilisation réelle.</p></div>`;
$("#orderform").onsubmit=async e=>{e.preventDefault();let btn=$("#orderbtn");btn.disabled=true;try{let adid=$("#orderad").value.trim(),adrow=ads.find(x=>String(x.id)===adid);let {error}=await sb.from("orders").insert({buyer_id:user.id,seller_id:adrow?.seller_id||null,ad_id:adid,amount:adrow?.price||0,status:"pending",payment_method:$("#paymethod").value,delivery_address:$("#orderaddress").value.trim()});if(error)throw error;toast("Demande enregistrée");go("purchases")}catch(err){toast("Vérifiez la table Supabase « orders » et ses règles RLS.")}finally{btn.disabled=false}}}

function deliveryPage(a){a.innerHTML=`<div class="section-head"><h2>🚚 Coursier & suivi</h2></div><div class="panel"><p class="muted">Demandez une livraison locale. La mise en relation automatique exige une base de coursiers inscrits.</p><form id="deliveryform"><label>Annonce (facultatif)<input id="delad" value="${esc(currentAd?.id||"")}" placeholder="ID de l’annonce"></label><label>Ville de collecte<select id="pickup">${CITIES.map(c=>`<option>${c}</option>`).join("")}</select></label><label>Ville de livraison<select id="dropcity">${CITIES.map(c=>`<option>${c}</option>`).join("")}</select></label><label>Adresse de collecte<input id="pickupaddress" required placeholder="Quartier ou repère"></label><label>Adresse de livraison<input id="dropaddress" required placeholder="Quartier ou repère"></label><label>Type de colis<select id="package"><option>Petit colis</option><option>Document</option><option>Colis moyen</option><option>Colis volumineux</option></select></label><label>Précisions<textarea id="deldetails" rows="3" placeholder="Instructions ou contact"></textarea></label><button class="btn" id="delbtn">Rechercher un coursier / demander une livraison</button></form></div><div class="panel"><h3>Suivi de livraison</h3><form id="trackform"><label>Numéro de suivi<input id="trackid" required placeholder="Identifiant de livraison"></label><button class="btn ghost">Suivre ma livraison</button></form><div id="trackingresult"></div></div>`;
$("#deliveryform").onsubmit=async e=>{e.preventDefault();let btn=$("#delbtn");btn.disabled=true;try{let {data,error}=await sb.from("delivery_requests").insert({customer_id:user.id,ad_id:$("#delad").value.trim()||null,pickup_city:$("#pickup").value,delivery_city:$("#dropcity").value,pickup_address:$("#pickupaddress").value.trim(),delivery_address:$("#dropaddress").value.trim(),package_type:$("#package").value,details:$("#deldetails").value.trim(),status:"searching"}).select().single();if(error)throw error;$("#trackingresult").innerHTML=`<div class="statusline">Demande créée. Suivi : ${esc(data.id)} · Statut : ${esc(data.status||"searching")}</div>`;toast("Demande de livraison enregistrée")}catch(err){toast("Créez la table Supabase « delivery_requests » et ses règles RLS.")}finally{btn.disabled=false}};
$("#trackform").onsubmit=async e=>{e.preventDefault();try{let {data,error}=await sb.from("delivery_requests").select("id,status,pickup_city,delivery_city,courier_id").eq("id",$("#trackid").value.trim()).maybeSingle();if(error)throw error;if(!data){$("#trackingresult").innerHTML='<p class="muted">Aucune livraison trouvée.</p>';return}$("#trackingresult").innerHTML=`<div class="statusline">Statut : ${esc(data.status||"En attente")}</div><p>${esc(data.pickup_city||"")} → ${esc(data.delivery_city||"")}</p><p class="muted">Coursier : ${data.courier_id?esc(data.courier_id):"En recherche"}</p>`}catch(err){$("#trackingresult").innerHTML='<p>Le suivi nécessite la table « delivery_requests » et ses règles RLS.</p>'}}}


function getAdViews(a){return Number(a.view_count||0)+Number(JSON.parse(localStorage.getItem("bm-views")||"{}")[String(a.id)]||0)}
function trackAdView(a){let seen=JSON.parse(sessionStorage.getItem("bm-viewed")||"[]");if(seen.includes(String(a.id)))return;seen.push(String(a.id));sessionStorage.setItem("bm-viewed",JSON.stringify(seen));let counts=JSON.parse(localStorage.getItem("bm-views")||"{}");counts[String(a.id)]=(counts[String(a.id)]||0)+1;localStorage.setItem("bm-views",JSON.stringify(counts));}

function datingPage(a){profileExtraPage(a,"💞 Espace rencontres","Créez une fiche et découvrez les profils des personnes inscrites. Respectez la confidentialité et le consentement.",'<label>Nom affiché<input required></label><label>Âge (18 ans minimum)<input type="number" min="18" required></label><label>Commune<select>'+CITIES.map(c=>`<option>${c}</option>`).join("")+'</select></label><label>Présentation<textarea required rows="3" placeholder="Parlez un peu de vous"></textarea></label>',"Créer ma fiche")}
function virtualCardPage(a){profileExtraPage(a,"💳 Carte virtuelle","Cette interface prépare une demande. La création et l’émission d’une vraie carte nécessitent un établissement émetteur agréé.",'<label>Type de carte<select><option>Carte virtuelle prépayée</option><option>Carte virtuelle de paiement</option></select></label><label>Devise souhaitée<select><option>FCFA</option><option>EUR</option><option>USD</option></select></label><label>Nom à afficher<input required></label>',"Préparer ma demande")}
function jobsPage(a){profileExtraPage(a,"💼 Offres d’emploi","Consultez ou proposez des opportunités. Les annonces publiées seront publiques une fois la base de données configurée.",'<label>Type de demande<select><option>Rechercher un emploi</option><option>Publier une offre d’emploi</option></select></label><label>Intitulé du poste<input required placeholder="Ex. vendeur, chauffeur, comptable"></label><label>Commune<select>'+CITIES.map(c=>`<option>${c}</option>`).join("")+'</select></label><label>Description<textarea required rows="4"></textarea></label><label>Contact<input required placeholder="Téléphone ou email"></label>',"Enregistrer")}
function boostPage(a){profileExtraPage(a,"🚀 Booster une annonce","Interface de préparation d’une promotion payante. Aucun paiement n’est prélevé avant l’intégration d’un prestataire.",'<label>Annonce à booster<select required>'+ads.filter(x=>user&&x.seller_id===user.id).map(x=>`<option value="${esc(x.id)}">${esc(x.title)}</option>`).join("")+'</select></label><label>Durée<select><option>3 jours</option><option>7 jours</option><option>14 jours</option></select></label><label>Budget (FCFA)<input type="number" min="500" required placeholder="1000"></label>',"Préparer le boost")}

function simple(a,t,d){a.innerHTML=`<div class="panel"><h2>${t}</h2><p>${d}</p><button class="btn ghost" onclick="go('profile')">Retour au profil</button></div>`}
function contactSeller(id){let a=ads.find(x=>String(x.id)===String(id));if(!user){toast("Connectez-vous pour contacter le vendeur.");go("profile");return}if(!a?.seller_id){toast("Profil vendeur indisponible.");return}if(a.seller_id===user.id){toast("Vous ne pouvez pas vous envoyer un message.");return}activeChat=String(a.seller_id);go("messages");setTimeout(()=>openConversation(activeChat),100)}
async function reportAd(id){if(!user)return toast("Connectez-vous pour signaler une annonce.");let reason=prompt("Motif du signalement");if(!reason)return;let {error}=await sb.from("reports").insert({ad_id:id,reason});toast(error?"Signalement impossible : "+error.message:"Signalement envoyé.")}
async function logout(){await sb.auth.signOut();user=null;go("home");toast("Déconnexion réussie.")}
async function loadAds(){let {data,error}=await sb.from("ads").select("*, profiles(name,email,phone)").order("created_at",{ascending:false}).limit(200);if(error){console.error(error);ads=[]}else ads=data||[];render()}
sb.auth.onAuthStateChange((event,session)=>{user=session?.user||null;if(user)setupPresence();else{if(presenceChannel){sb.removeChannel(presenceChannel);presenceChannel=null}if(messageChannel){sb.removeChannel(messageChannel);messageChannel=null}onlineUsers=new Set();activeChat=null}if(["SIGNED_IN","SIGNED_OUT","USER_UPDATED"].includes(event))setTimeout(render,0)});
(async()=>{let {data}=await sb.auth.getSession();user=data.session?.user||null;if(user)setupPresence();await loadAds()})();
</script></body></html>
