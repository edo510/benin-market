/* Bénin Market — interface 2026, calquée sur la maquette fournie */
:root{--bg:#fff;--surface:#fff;--text:#092e25;--green:#007b43;--deep:#00693b;--soft:#e9f8f1;--border:#e8f0ed;--muted:#607b89}
body{font-family:"DM Sans",sans-serif;background:#fff;color:var(--text)}
header{padding:14px 17px 12px;min-height:82px;position:sticky;top:0;background:#fff;z-index:8}
.brand{font-size:23px;letter-spacing:-.8px;font-weight:800}.brand b{color:#00783d}.logo{width:52px;height:55px;display:flex;align-items:center;justify-content:center}.logo svg{width:100%;height:100%}
.iconbtn{color:#0b4639;font-size:24px}.header-avatar{border:2px solid #dbe9e0}.header-profile .avatar{width:43px;height:43px}
main{padding:8px 14px 112px}.top-search{border-radius:17px;background:#f4f8f8;margin:8px 0 15px;height:52px}.top-search input{font-size:13px}.top-search button{background:linear-gradient(145deg,#00914d,#006b3d);border-radius:0 15px 15px 0}
.hero{border-radius:17px;background:linear-gradient(105deg,#fff8dc 0%,#fff0bd 100%);padding:20px 14px;min-height:154px}.hero h1{font-size:clamp(18px,4.5vw,26px);line-height:1.15;max-width:290px}.hero p{font-size:12px;max-width:230px}.hero .hero-cta{font-size:12px;padding:9px 16px;background:linear-gradient(125deg,#00914c,#006a39)}.hero-figure{font-size:70px;filter:drop-shadow(0 4px 3px #dba34830)}
.catgrid{margin:19px 0 30px;gap:16px 5px}.ci{width:53px;height:53px;border:1px solid #d8f0e6;background:#eaf8f2;box-shadow:0 2px 4px #036e3a0b;font-size:24px}.cat{font-size:10px;font-weight:700;min-width:0}
.section-head h2{font-size:21px}.section-head{margin:21px 0 12px}.grid{grid-template-columns:repeat(3,minmax(0,1fr));gap:9px}.card{border-radius:12px;overflow:visible}.photo,.placeholder{aspect-ratio:1.05/1;border-radius:12px}.cardbody{padding:7px 1px}.title{font-size:11px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.price{font-size:12px;font-weight:800;color:#ed6a11}.meta{font-size:10px}.heart{width:24px;height:24px;right:4px;top:4px}
nav{max-width:900px;border-radius:20px 20px 0 0;box-shadow:0 -3px 17px #163d2410;padding:9px 5px calc(10px + env(safe-area-inset-bottom))}nav button{font-size:10px}nav .ni{font-size:23px}nav .plus{height:55px;width:55px;box-shadow:0 2px 6px #006e3b25}
.panel{border-color:#e8f0ed;border-radius:17px}.avatar,.avatar-photo{border-radius:50%;overflow:hidden}.badge{background:#e5f8ed;color:#008344}.unread-dot{background:#1688ff}
.seller-hero{text-align:center;padding:22px 12px 12px}.seller-hero .avatar{width:98px;height:98px;margin:auto;font-size:40px}.seller-hero .avatar-photo{width:98px;height:98px;object-fit:cover}.seller-hero h2{margin:12px 0 7px}.seller-stats{display:flex;justify-content:space-around;text-align:center;margin:22px 0}.seller-stats>div{flex:1;border-right:1px solid var(--border)}.seller-stats>div:last-child{border:0}.seller-stats b{font-size:19px}.seller-actions{display:flex;gap:8px;margin:12px 0}.seller-actions .btn{flex:1;font-size:12px;padding:11px 5px}.seller-line{display:flex;align-items:center;gap:12px;padding:12px 0;border-bottom:1px solid var(--border)}.seller-line .ci{width:37px;height:37px;flex:none;font-size:18px}.seller-line small{display:block;color:var(--muted)}
@media(min-width:620px){.grid{grid-template-columns:repeat(4,minmax(0,1fr))}.catgrid{grid-template-columns:repeat(4,minmax(0,1fr))}}@media(min-width:900px){.grid{grid-template-columns:repeat(5,minmax(0,1fr))}.catgrid{grid-template-columns:repeat(8,minmax(0,1fr))}}

/* Finitions visuelles mobile : 6 écrans de la référence */
@media(max-width:619px){main{padding-left:13px;padding-right:13px}.grid{gap:9px}.card{border:0;box-shadow:none}.card .photo{height:clamp(90px,25vw,145px);aspect-ratio:auto}.card .placeholder{height:clamp(90px,25vw,145px);aspect-ratio:auto}.cardbody{padding-top:7px}.card .title{min-height:0;margin:3px 0;font-size:11px}.card .price{font-size:12px}.card .meta{font-size:9px}.catgrid{grid-template-columns:repeat(4,minmax(0,1fr))}.cat{line-height:1.2}.hero{min-height:157px}.hero h1{max-width:70%}.hero p{max-width:66%}.hero-figure{position:absolute;right:8px;bottom:9px;font-size:78px}.chat-tabs .chip{flex:1;text-align:center}.chat-search{margin-bottom:12px}.chat-tabs{margin-bottom:6px}.chat-avatar{height:43px;width:43px;border-radius:50%;background:#e9f8f1;display:grid;place-items:center;flex:none}.seller-line{border-bottom:1px solid #e9f1ed;padding:12px 0}.seller-line .ci{width:38px;height:38px}.seller-hero{padding-top:14px}.seller-hero .avatar{box-shadow:0 0 0 4px #e9f8f1}.sheet{background:#fff}.sheet h3{margin-top:15px}}
.bm-filters{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:9px;margin:9px 0}.bm-filters label{margin-top:0;font-size:12px}.bm-filters .btn{margin-top:0;align-self:end}.bm-filters select{padding:9px}.bm-filters input{padding:9px}@media(max-width:360px){.bm-filters{grid-template-columns:1fr}}
.bm-composer{display:flex;align-items:end;gap:8px;border:1px solid var(--border);border-radius:22px;padding:8px;background:var(--surface)}.bm-composer textarea{flex:1;min-width:0;resize:none;border:0!important;background:transparent!important;outline:none;max-height:110px}.bm-composer .bm-attach{font-size:25px;cursor:pointer;position:relative;padding:6px}.bm-attach input{position:absolute;inset:0;opacity:0;width:100%;cursor:pointer}.bm-composer button{min-width:48px;min-height:42px;border-radius:50%}#chatmessages img,#chatmessages video{max-width:100%;border-radius:14px}#bmcallbox video{object-fit:contain;border-radius:12px}#bmcallbox{position:sticky;top:0;z-index:5} 
/* V13.1 — recherche compacte et catégories juste en dessous */
.bm13-search-clean{grid-template-columns:minmax(0,1fr) 112px!important;align-items:center!important;margin:8px 0 5px!important;padding:6px 9px!important;background:#fff!important;border:1px solid var(--border)!important;border-radius:28px!important;box-shadow:0 2px 10px rgba(0,0,0,.035)!important}
.bm13-search-clean .bm13-search-main{gap:7px!important}
.bm13-search-clean .bm13-search-main input{font-size:14px!important;min-height:40px!important}
.bm13-search-clean select{width:112px!important;max-width:112px!important;min-height:38px!important;padding:6px 7px!important;border:0!important;border-left:1px solid var(--border)!important;border-radius:0!important;background:#fff!important;color:var(--text)!important;font-size:10px!important}
.bm13-location-trigger{border:0;background:transparent;color:var(--green);font-size:22px;padding:3px}
.bm13-category-wrap{position:relative;display:flex;align-items:flex-start;gap:3px;margin:0 0 12px;padding:4px 0 0}
.bm13-category-wrap .bm13-cats{flex:1;min-width:0;display:flex!important;flex-wrap:nowrap!important;overflow-x:auto!important;overflow-y:hidden!important;gap:10px!important;padding:5px 2px 10px!important;scroll-snap-type:x mandatory;scrollbar-width:none}
.bm13-category-wrap .bm13-cats::-webkit-scrollbar{display:none}
.bm13-category-wrap .bm13-cat{flex:0 0 72px!important;min-width:72px!important;scroll-snap-align:start;padding:0!important;font-size:10px!important;line-height:1.2!important}
.bm13-category-wrap .bm13-cat span{width:54px!important;height:54px!important;border-radius:15px!important;font-size:24px!important}
.bm13-cat-expand{flex:0 0 28px;width:28px;height:54px;margin-top:5px;border:0;background:transparent;color:var(--text);font-size:23px;line-height:1}
.bm13-category-wrap.expanded{align-items:flex-start}
.bm13-category-wrap.expanded .bm13-cats{display:grid!important;grid-template-columns:repeat(4,minmax(0,1fr))!important;gap:12px 5px!important;overflow:visible!important;flex-wrap:initial!important}

@media(max-width:380px){.bm13-search-clean{grid-template-columns:minmax(0,1fr) 100px!important}.bm13-search-clean select{width:100px!important;max-width:100px!important;font-size:9px!important}.bm13-category-wrap.expanded .bm13-cats{grid-template-columns:repeat(3,minmax(0,1fr))!important}}

function openAd(id){let a=ads.find(x=>String(x.id)===String(id));if(!a)return;currentAd=a;trackAdView(a);let img=a.image_url||(a.images&&a.images[0]);$("#modal").innerHTML=`<div class="overlay" onclick="closeModal()"><section class="sheet" onclick="event.stopPropagation()"><button class="close" onclick="closeModal()">×</button>${img?`<img class="detailimg" src="${esc(img)}">`:`<div class="placeholder">🛍️</div>`}<h2>${esc(a.title)}</h2><div class="price" style="font-size:26px">${money(a.price)}</div><p class="muted">⌖ ${esc(a.city||"Bénin")} · ${esc(a.category||"Autres")} · 👁 ${esc(getAdViews(a))} vues</p><button class="btn ghost" onclick="showSeller('${esc(a.seller_id||"")}')">Voir le profil du vendeur</button><span class="badge">✓ Annonce disponible</span><h3 style="margin-top:20px">Description</h3><p>${esc(a.description||"Aucune description.")}</p><button class="btn ghost" onclick="favorite('${esc(a.id)}')">${fav.has(String(a.id))?"♥ Retirer des favoris":"♡ Ajouter aux favoris"}</button><button class="btn" onclick="contactSeller('${esc(a.id)}')">Contacter le vendeur</button><button class="btn orange" onclick="startPayment('${esc(a.id)}')">Acheter avec paiement sécurisé</button><button class="btn ghost" onclick="startDelivery('${esc(a.id)}')">🚚 Trouver un coursier / livrer</button><button class="textbtn" onclick="reportAd('${esc(a.id)}')">Signaler cette annonce</button></section></div>`}

function authPage(a,msg){a.innerHTML=`<div class="panel"><h2>${msg}</h2><p class="muted">Créez votre compte pour publier et gérer vos annonces.</p><div class="chips"><button class="chip ${authMode==='in'?'on':''}" onclick="authMode='in';render()">Connexion</button><button class="chip ${authMode==='up'?'on':''}" onclick="authMode='up';render()">Inscription</button></div><form id="authform">${authMode==='up'?'<label>Type de compte<select id="accounttype" required><option value="personal">Compte personnel</option><option value="professional">Compte professionnel</option></select></label><label>Sexe<select id="sex" required><option value="">Sélectionnez</option><option value="Femme">Femme</option><option value="Homme">Homme</option><option value="Préfère ne pas préciser">Préfère ne pas préciser</option></select></label><label>Nom de famille<input id="lastname" required autocomplete="family-name"></label><label>Prénom(s)<input id="firstname" required autocomplete="given-name"></label><label>Numéro de téléphone<input id="phone" required type="tel" autocomplete="tel" placeholder="+229…"></label>':''}<label>Email<input id="email" required type="email" autocomplete="email"></label><label>Mot de passe<input id="password" required type="password" minlength="6"></label><button class="btn">${authMode==='up'?'Créer mon compte':'Se connecter'}</button></form>${authMode==='in'?'<button class="textbtn" onclick="forgot()">Mot de passe oublié ?</button>':''}</div>`;$("#authform").onsubmit=authSubmit}
async function authSubmit(e){e.preventDefault();let email=$("#email").value.trim(),password=$("#password").value;try{let r=authMode==="up"?await sb.auth.signUp({email,password,options:{data:{name:($("#firstname").value.trim()+" "+$("#lastname").value.trim()).trim(),first_name:$("#firstname").value.trim(),last_name:$("#lastname").value.trim(),phone:$("#phone").value.trim(),sex:$("#sex").value,account_type:$("#accounttype").value}}}):await sb.auth.signInWithPassword({email,password});if(r.error)throw r.error;if(authMode==="up"&&!r.data.session)return toast("Vérifiez votre email pour confirmer l’inscription.");user=r.data.user;toast("Connexion réussie");go("profile")}catch(e){toast(e.message)}}

function publishPage(a){a.innerHTML=`<div class="panel"><h2>Publier une annonce</h2><p class="muted">Ajoutez des photos et les informations du produit.</p><form id="pubform"><label>Photos (5 maximum)<input id="photos" type="file" accept="image/*" multiple></label><div id="preview" class="row" style="flex-wrap:wrap"></div><label>Titre<input id="title" required maxlength="90" placeholder="Ex. iPhone 13 en très bon état"></label><label>Catégorie<select id="category">${CATS.map(c=>`<option>${c[0]}</option>`).join("")}</select></label><label>Prix (FCFA)<input id="price" type="number" min="1" required placeholder="250000"></label><label>Ville<select id="city">${CITIES.map(c=>`<option>${c}</option>`).join("")}</select></label><label>Description<textarea id="description" rows="4"></textarea></label><button class="btn" id="pubbtn">Publier l’annonce</button></form></div>`;$("#photos").onchange=()=>$("#preview").innerHTML=[...$("#photos").files].slice(0,5).map(f=>`<img style="width:65px;height:65px;object-fit:cover;border-radius:10px" src="${URL.createObjectURL(f)}">`).join("");$("#pubform").onsubmit=publish}
async function publish(e){e.preventDefault();let b=$("#pubbtn");b.disabled=true;try{let images=[];for(let f of [...$("#photos").files].slice(0,5)){let path=user.id+"/"+Date.now()+"-"+Math.random().toString(36).slice(2,7)+".jpg";let up=await sb.storage.from("photos").upload(path,f,{upsert:false,contentType:f.type});if(up.error)throw up.error;images.push(sb.storage.from("photos").getPublicUrl(path).data.publicUrl)}let city=$("#city").value,{error}=await sb.from("ads").insert({seller_id:user.id,title:$("#title").value.trim(),category:$("#category").value,price:Number($("#price").value),city,description:$("#description").value.trim(),image_url:images[0]||null,images});if(error)throw error;await loadAds();notes.unshift({icon:"＋",title:"Annonce publiée",body:"Votre annonce a été publiée.",date:new Date().toLocaleString("fr-FR")});localStorage.setItem("bm-notifications",JSON.stringify(notes));toast("Annonce publiée");go("ads")}catch(e){toast("Publication impossible : "+e.message)}finally{b.disabled=false}}
function profilePage(a){let name=user.user_metadata?.name||user.email?.split("@")[0]||"Mon profil",mine=ads.filter(x=>x.seller_id===user.id);a.innerHTML=`<div class="panel" style="padding:0;overflow:hidden"><div style="background:linear-gradient(130deg,#075b35,#0b8750);color:white;padding:22px"><div class="row"><div class="avatar">${user.user_metadata?.avatar_url?`<img class="avatar-photo" src="${esc(user.user_metadata.avatar_url)}" alt="Photo de profil">`:esc(name[0].toUpperCase())}</div><div><h2>${esc(name)}</h2><p>Membre de Bénin Market</p><span class="badge">${user.user_metadata?.account_type==="professional"?"Compte professionnel (vérification requise)":"Compte personnel"}</span>${user.user_metadata?.account_type==="professional"?'<div style="margin-top:8px"><span class="badge" style="background:#f4c542;color:#17251c">Dossier professionnel à vérifier</span></div>':""}</div></div><button class="btn ghost" style="color:white" onclick="editProfile()">Modifier le profil</button></div><div class="row" style="text-align:center;padding:16px"><div><h2>${mine.length}</h2><small>Annonces</small></div><div><h2>${mine.filter(x=>x.sold).length}</h2><small>Vendues</small></div><div><h2>${fav.size}</h2><small>Favoris</small></div></div></div><div class="panel"><button class="menuitem" onclick="go('myads')"><span>▤</span>Mes annonces <span class="arrow">›</span></button><button class="menuitem" onclick="go('purchases')"><span>🛍</span>Mes achats <span class="arrow">›</span></button>
<button class="menuitem" onclick="go('wallet')"><span>💰</span>Portefeuille <span class="arrow">›</span></button>

async function uploadAvatar(input){const file=input.files?.[0];if(!file||!user)return;if(!file.type.startsWith('image/')||file.size>5*1024*1024)return toast('Choisissez une image de moins de 5 Mo');try{const path=`${user.id}/avatar-${Date.now()}.${(file.name.split('.').pop()||'jpg').replace(/[^a-z0-9]/gi,'')}`;const {error}=await sb.storage.from('photos').upload(path,file,{contentType:file.type});if(error)throw error;const url=sb.storage.from('photos').getPublicUrl(path).data.publicUrl;const result=await sb.auth.updateUser({data:{avatar_url:url}});if(result.error)throw result.error;user=result.data.user;await savePublicProfile();toast('Photo de profil mise à jour');render()}catch(e){toast('Photo non enregistrée : '+e.message)}}

function shortUser(id){return String(id||"").slice(0,8)}
function isOnline(id){return onlineUsers.has(String(id))}
async function loadConversations(){
 const list=$("#conversationlist");if(!list||!user)return;
 try{
  const {data,error}=await sb.from("messages").select("id,sender_id,recipient_id,content,read_at,created_at").or(`sender_id.eq.${user.id},recipient_id.eq.${user.id}`).order("created_at",{ascending:false}).limit(300);
  if(error)throw error;
  const map=new Map();(data||[]).forEach(m=>{const other=m.sender_id===user.id?m.recipient_id:m.sender_id;if(other&&!map.has(other))map.set(other,m)});
  const unreadBySender=new Set((data||[]).filter(m=>m.recipient_id===user.id&&!m.read_at).map(m=>String(m.sender_id)));const entries=[...map.entries()].filter(([id,m])=>(chatFilter!=="unread"||unreadBySender.has(String(id)))&&(!chatSearch||[m.content,id].join(" ").toLowerCase().includes(chatSearch.toLowerCase())));
  list.innerHTML=entries.map(([id,m])=>`<button class="menuitem" onclick="openConversation('${esc(id)}')"><span class="chat-avatar">👤</span><span style="flex:1"><b>${esc(m.sender_id===user.id?'Conversation avec '+shortUser(id):'Conversation avec '+shortUser(id))}</b><br><small class="muted">${esc((m.content||'').slice(0,55))}</small></span>${unreadBySender.has(String(id))?'<span class="unread-dot" aria-label="Messages non lus"></span>':''}<span class="badge" style="background:${isOnline(id)?'var(--soft)':'var(--bg)'};color:${isOnline(id)?'var(--green)':'var(--muted)'}">${isOnline(id)?'En ligne':'Hors ligne'}</span></button>`).join("")||'<div class="empty">Aucune conversation. Ouvrez une annonce et appuyez sur « Contacter le vendeur ».</div>';
  if(activeChat)await openConversation(activeChat,false);
 }catch(e){list.innerHTML='<div class="empty">La messagerie nécessite la table Supabase « messages » et ses règles de sécurité. Exécutez le SQL de configuration fourni avec le code.</div>';console.error(e)}
}
async function openConversation(id,refreshList=true){
 if(!user)return;activeChat=String(id);const panel=$("#chatpanel");if(!panel)return;
 panel.innerHTML=`<div class="row" style="justify-content:space-between"><div><button class="textbtn" onclick="showSeller('${esc(id)}')">👤 Voir le profil</button><div class="muted">Utilisateur ${esc(shortUser(id))}</div></div><button class="textbtn" onclick="activeChat=null;messagesPage($('#app'))">Retour</button></div><div class="row"><button class="btn ghost" onclick="bmStartCall('audio')">📞 Appel audio</button><button class="btn ghost" onclick="bmStartCall('video')">📹 Appel vidéo</button></div><div id="bmcallbox"></div><div id="chatmessages" role="log" aria-live="polite" style="height:48vh;overflow-y:auto;overscroll-behavior:contain;padding:12px 0">Chargement…</div><form id="sendmessageform"><div class="bm-composer"><label class="bm-attach" title="Joindre une photo ou vidéo">📎<input id="bmchatfile" type="file" accept="image/jpeg,image/png,image/webp,video/mp4,video/webm" onchange="bmShowFileName(this)" aria-label="Ajouter une photo ou vidéo"></label><textarea id="messagecontent" rows="1" maxlength="4000" placeholder="Écrivez un message…" aria-label="Votre message" onkeydown="if(event.key==='Enter'&&!event.shiftKey){event.preventDefault();this.form.requestSubmit()}"></textarea><button class="btn" id="sendmessagebtn" type="submit">➤</button></div><small id="bmfilelabel" class="muted"></small><small class="muted">Photo max 8 Mo, vidéo max 30 Mo. Fichiers privés.</small></form>`;
 await refreshChat();const form=$("#sendmessageform");if(form)form.onsubmit=sendMessage;
 bmChatInitialised=false;if(messageChannel){sb.removeChannel(messageChannel);messageChannel=null}
 messageChannel=sb.channel('bm-messages-'+user.id+'-'+id).on('postgres_changes',{event:'*',schema:'public',table:'messages'},payload=>{const m=payload.new||payload.old;if(m&&(m.sender_id===user.id&&m.recipient_id===id||m.sender_id===id&&m.recipient_id===user.id))refreshChat()}).on('postgres_changes',{event:'*',schema:'public',table:'bm_chat_attachments'},()=>refreshChat()).on('postgres_changes',{event:'*',schema:'public',table:'bm_calls'},()=>bmCheckIncomingCall()).subscribe();
 await bmCheckIncomingCall();
}
let bmChatInitialised=false,bmChatNearBottom=true,bmChatRefreshing=false,bmChatQueued=false;
function bmShowFileName(el){const f=el.files?.[0];const n=$('#bmfilelabel');if(n)n.textContent=f?'📎 '+f.name+' ('+Math.ceil(f.size/1024)+' Ko)':'';}
async function refreshChat(){
 if(bmChatRefreshing){bmChatQueued=true;return}bmChatRefreshing=true;
 const box=$("#chatmessages");if(!box||!user||!activeChat){bmChatRefreshing=false;return;}bmChatNearBottom=box.scrollHeight-box.scrollTop-box.clientHeight<100;const previousScroll=box.scrollTop;
 try{const {data,error}=await sb.from('messages').select('id,sender_id,recipient_id,content,read_at,created_at').or(`and(sender_id.eq.${user.id},recipient_id.eq.${activeChat}),and(sender_id.eq.${activeChat},recipient_id.eq.${user.id})`).order('created_at',{ascending:true}).limit(200);if(error)throw error;
 const rows=data||[];const ids=rows.map(m=>m.id);let attachments=[];
 if(ids.length){const r=await sb.from('bm_chat_attachments').select('id,message_id,storage_path,mime_type').in('message_id',ids);if(!r.error)attachments=r.data||[]}
 const byId=new Map();for(const a of attachments){let arr=byId.get(String(a.message_id))||[];arr.push(a);byId.set(String(a.message_id),arr)}
 box.innerHTML=rows.map(m=>`<div style="display:flex;justify-content:${m.sender_id===user.id?'flex-end':'flex-start'};margin:8px 0"><div style="max-width:85%;background:${m.sender_id===user.id?'var(--soft)':'var(--surface)'};border:1px solid var(--border);border-radius:14px;padding:10px 12px"><div style="white-space:pre-wrap;overflow-wrap:anywhere">${esc(m.content)}</div>${(byId.get(String(m.id))||[]).map(a=>`<div class="bm-media" data-path="${esc(a.storage_path)}" data-mime="${esc(a.mime_type)}">Chargement du fichier privé…</div>`).join('')}<small class="muted">${esc(new Date(m.created_at).toLocaleString('fr-FR'))}${m.sender_id===user.id?' · '+(m.read_at?'Lu':'Envoyé'):''}</small></div></div>`).join('')||'<div class="empty">Commencez la conversation en envoyant un message.</div>';
 if(!bmChatInitialised || bmChatNearBottom)box.scrollTop=box.scrollHeight;bmChatInitialised=true;
 for(const el of box.querySelectorAll('.bm-media')){const {data:signed,error:signError}=await sb.storage.from('bm-chat-private').createSignedUrl(el.dataset.path,300);if(signError||!signed){el.textContent='Fichier indisponible';continue}const media=document.createElement(el.dataset.mime.startsWith('video/')?'video':'img');media.src=signed.signedUrl;media.style.cssText='max-width:100%;max-height:240px;border-radius:10px;margin:8px 0';if(media.tagName==='VIDEO')media.controls=true;else media.alt='Photo envoyée';el.replaceChildren(media)}
 const unread=rows.filter(m=>m.sender_id===activeChat&&m.recipient_id===user.id&&!m.read_at).map(m=>m.id);if(unread.length)await sb.from('messages').update({read_at:new Date().toISOString()}).in('id',unread);
 }catch(e){console.error('Messagerie',e);if(!box.querySelector('[data-message-id]'))box.textContent='Erreur de messagerie : '+e.message}finally{bmChatRefreshing=false;if(bmChatQueued){bmChatQueued=false;refreshChat()}}
}
async function loadConversationsUnreadOnly(){const list=$('#conversationlist');if(list&&page==='messages')await loadConversations()}
async function sendMessage(e){e.preventDefault();if(!user||!activeChat)return;const input=$('#messagecontent'),file=$('#bmchatfile')?.files?.[0],btn=$('#sendmessagebtn'),content=input.value.trim();if(!content&&!file)return toast('Écrivez un message ou choisissez un fichier');btn.disabled=true;btn.textContent='…';
 try{if(file){const allowed=['image/jpeg','image/png','image/webp','video/mp4','video/webm'];if(!allowed.includes(file.type))throw Error('Format non accepté');if(file.size>(file.type.startsWith('video/')?30:8)*1024*1024)throw Error('Fichier trop volumineux')}
 const {data:msg,error}=await sb.from('messages').insert({sender_id:user.id,recipient_id:activeChat,content:content||'📎 Pièce jointe'}).select('id').single();if(error)throw error;
 if(file){const path=`${user.id}/${msg.id}/${crypto.randomUUID()}-${file.type.startsWith('video/')?'video':'image'}`;const up=await sb.storage.from('bm-chat-private').upload(path,file,{contentType:file.type,upsert:false});if(up.error)throw up.error;const ins=await sb.from('bm_chat_attachments').insert({message_id:String(msg.id),sender_id:user.id,recipient_id:activeChat,storage_path:path,mime_type:file.type,size_bytes:file.size});if(ins.error)throw ins.error}
 input.value='';if($('#bmchatfile'))$('#bmchatfile').value='';if($('#bmfilelabel'))$('#bmfilelabel').textContent='';bmChatNearBottom=true;await refreshChat();await loadConversations();
 }catch(err){toast('Envoi impossible : '+err.message);console.error(err)}finally{btn.disabled=false;btn.textContent='➤'}}
// WebRTC expérimental : nécessite HTTPS, permissions caméra/micro et connectivité ICE.
let bmPeer=null,bmLocalStream=null,bmCallId=null,bmCallTimer=null,bmRemoteIceCount=0;
async function bmStartCall(kind){if(!user||!activeChat)return;try{await bmEndCall(false);bmLocalStream=await navigator.mediaDevices.getUserMedia({audio:true,video:kind==='video'});const {data,error}=await sb.from('bm_calls').insert({caller_id:user.id,callee_id:activeChat,kind,status:'ringing'}).select('id').single();if(error)throw error;bmCallId=data.id;bmRenderCall('Appel en cours…');await bmCreatePeer(true);const offer=await bmPeer.createOffer();await bmPeer.setLocalDescription(offer);const r=await sb.from('bm_calls').update({offer:JSON.stringify(offer)}).eq('id',bmCallId);if(r.error)throw r.error;bmCallTimer=setInterval(bmPollCall,1500)}catch(e){toast('Appel impossible : '+e.message);await bmEndCall()}}
function bmRenderCall(t){const box=$('#bmcallbox');if(!box)return;box.innerHTML=`<div class="panel"><b>${esc(t)}</b><p id="bmcallstatus" class="muted">Connexion en cours…</p><button id="bmplayremote" hidden class="btn ghost" onclick="document.getElementById('bmremote').play()">🔊 Activer le son / la vidéo</button><div class="row"><video id="bmlocal" autoplay muted playsinline style="width:40%;max-height:170px;background:#142b20"></video><video id="bmremote" autoplay playsinline style="width:60%;max-height:170px;background:#142b20"></video></div><button class="btn danger" onclick="bmEndCall()">Raccrocher</button></div>`;if(bmLocalStream){$('#bmlocal').srcObject=bmLocalStream;$('#bmlocal').play().catch(()=>{})}}
async function bmCreatePeer(initiator){bmPeer=new RTCPeerConnection({iceServers:[{urls:'stun:stun.l.google.com:19302'}]});bmLocalStream.getTracks().forEach(t=>bmPeer.addTrack(t,bmLocalStream));bmPeer.ontrack=e=>{const v=$('#bmremote');if(v){v.srcObject=e.streams[0]||new MediaStream([e.track]);v.play().catch(()=>{const b=$('#bmplayremote');if(b)b.hidden=false})}};bmPeer.onconnectionstatechange=()=>{const el=$('#bmcallstatus');if(el)el.textContent='Connexion : '+bmPeer.connectionState};bmPeer.onicecandidate=async e=>{if(e.candidate&&bmCallId)await sb.from('bm_call_ice').insert({call_id:bmCallId,user_id:user.id,candidate:JSON.stringify(e.candidate)})}}
async function bmCheckIncomingCall(){if(!user||!activeChat||bmCallId)return;const {data}=await sb.from('bm_calls').select('id,kind').eq('callee_id',user.id).eq('caller_id',activeChat).eq('status','ringing').order('created_at',{ascending:false}).limit(1);if(data?.length){const c=data[0];const box=$('#bmcallbox');if(box)box.innerHTML=`<div class="panel">📞 Appel ${c.kind==='video'?'vidéo':'audio'} entrant <button class="btn" onclick="bmAcceptCall('${esc(c.id)}','${esc(c.kind)}')">Répondre</button><button class="btn danger" onclick="bmRejectCall('${esc(c.id)}')">Refuser</button></div>`}}
async function bmAcceptCall(id,kind){try{bmCallId=id;bmRemoteIceCount=0;bmLocalStream=await navigator.mediaDevices.getUserMedia({audio:true,video:kind==='video'});bmRenderCall('Appel connecté…');await bmCreatePeer(false);const {data,error}=await sb.from('bm_calls').select('offer').eq('id',id).single();if(error||!data.offer)throw Error('Offre non disponible');await bmPeer.setRemoteDescription(JSON.parse(data.offer));const answer=await bmPeer.createAnswer();await bmPeer.setLocalDescription(answer);const r=await sb.from('bm_calls').update({answer:JSON.stringify(answer),status:'accepted'}).eq('id',id);if(r.error)throw r.error;bmCallTimer=setInterval(bmPollCall,1500)}catch(e){toast(e.message);await bmEndCall()}}
async function bmPollCall(){if(!bmCallId||!bmPeer)return;const {data}=await sb.from('bm_calls').select('status,answer').eq('id',bmCallId).single();if(!data||['ended','rejected'].includes(data.status)){await bmEndCall(false);return}if(data.answer&&!bmPeer.currentRemoteDescription){try{await bmPeer.setRemoteDescription(JSON.parse(data.answer))}catch(e){console.warn(e)}}const {data:ice}=await sb.from('bm_call_ice').select('id,user_id,candidate').eq('call_id',bmCallId).neq('user_id',user.id).order('created_at',{ascending:true});for(const row of (ice||[]).slice(bmRemoteIceCount)){try{await bmPeer.addIceCandidate(JSON.parse(row.candidate))}catch(e){console.warn(e)}}bmRemoteIceCount=(ice||[]).length}
async function bmRejectCall(id){await sb.from('bm_calls').update({status:'rejected'}).eq('id',id);if($('#bmcallbox'))$('#bmcallbox').innerHTML=''}
async function bmEndCall(update=true){if(bmCallTimer)clearInterval(bmCallTimer);bmCallTimer=null;const id=bmCallId;bmCallId=null;bmRemoteIceCount=0;if(bmPeer){bmPeer.close();bmPeer=null}if(bmLocalStream){bmLocalStream.getTracks().forEach(t=>t.stop());bmLocalStream=null}if(update&&id)await sb.from('bm_calls').update({status:'ended'}).eq('id',id);if($('#bmcallbox'))$('#bmcallbox').innerHTML=''}

function getAdViews(a){return Number(a.view_count||0)+Number(JSON.parse(localStorage.getItem("bm-views")||"{}")[String(a.id)]||0)}
function trackAdView(a){let seen=JSON.parse(sessionStorage.getItem("bm-viewed")||"[]");if(seen.includes(String(a.id)))return;seen.push(String(a.id));sessionStorage.setItem("bm-viewed",JSON.stringify(seen));let counts=JSON.parse(localStorage.getItem("bm-views")||"{}");counts[String(a.id)]=(counts[String(a.id)]||0)+1;localStorage.setItem("bm-views",JSON.stringify(counts));}

async function loadAds(){
 // Ne dépend PAS des colonnes facultatives de profiles : toutes les annonces existantes restent accessibles.
 const {data,error}=await sb.from('ads').select('*').order('created_at',{ascending:false}).limit(1000);
 if(error){console.error('Chargement des annonces :',error);if(!ads.length)$('#app').innerHTML='<div class="panel"><h2>Impossible de charger les annonces</h2><p>Vérifiez la connexion Supabase et les règles de lecture de la table ads. Aucune annonce n’a été supprimée par cette page.</p><button class="btn" onclick="loadAds()">Réessayer</button></div>';return}
 ads=data||[];
 // Enrichissement optionnel sans bloquer les annonces si profiles ou ses colonnes n’existent pas.
 try{const ids=[...new Set(ads.map(a=>a.seller_id).filter(Boolean))];if(ids.length){const {data:profiles,error:pe}=await sb.from('profiles').select('id,name,account_type,avatar_url').in('id',ids.slice(0,500));if(!pe){const byId=new Map((profiles||[]).map(x=>[x.id,x]));ads.forEach(a=>a.profiles=byId.get(a.seller_id)||null)}}}catch(e){console.warn('Profils facultatifs',e)}
 render();
}
sb.auth.onAuthStateChange((event,session)=>{user=session?.user||null;if(user){setupPresence();savePublicProfile()}else{if(presenceChannel){sb.removeChannel(presenceChannel);presenceChannel=null}bmChatInitialised=false;if(messageChannel){sb.removeChannel(messageChannel);messageChannel=null}onlineUsers=new Set();activeChat=null}if(["SIGNED_IN","SIGNED_OUT","USER_UPDATED"].includes(event))setTimeout(render,0)});
(async()=>{let {data}=await sb.auth.getSession();user=data.session?.user||null;if(user){setupPresence();savePublicProfile()}await loadAds()})();

const fmtTime=v=>v?new Date(v).toLocaleString('fr-FR',{day:'2-digit',month:'2-digit',year:'numeric',hour:'2-digit',minute:'2-digit',second:'2-digit'}):'Non disponible';
const fmtYear=v=>v?new Date(v).getFullYear():'—';
function filterControls(){return `<div class="bm-filters"><label>📍 Commune<select onchange="selectedCommune=this.value;render()">${communeOptions()}</select></label><button class="btn ghost" onclick="toggleFilters()">⚙ Filtres</button></div><div id="bmadvanced" class="panel" style="display:none"><div class="bm-filters"><label>Prix minimum<input type="number" min="0" value="${esc(advanced.min)}" oninput="advanced.min=this.value;drawFiltered()"></label><label>Prix maximum<input type="number" min="0" value="${esc(advanced.max)}" oninput="advanced.max=this.value;drawFiltered()"></label><label>État<select onchange="advanced.condition=this.value;drawFiltered()"><option value="all">Tous</option><option value="new" ${advanced.condition==='new'?'selected':''}>Neuf</option><option value="used" ${advanced.condition==='used'?'selected':''}>Occasion</option></select></label><label>Vendeur<select onchange="advanced.seller=this.value;drawFiltered()"><option value="all">Tous</option><option value="professional" ${advanced.seller==='professional'?'selected':''}>Professionnel</option><option value="personal" ${advanced.seller==='personal'?'selected':''}>Personnel</option></select></label></div><label><input type="checkbox" style="display:inline;width:auto" ${advanced.near?'checked':''} onchange="advanced.near=this.checked;drawFiltered()"> Privilégier ma commune sélectionnée</label><button class="btn ghost" onclick="saveSearchAlert()">🔔 M'alerter des nouvelles annonces</button><small class="muted">La proximité utilise la commune choisie, sans géolocalisation GPS.</small></div>`}
function toggleFilters(){let el=$('#bmadvanced');if(el)el.style.display=el.style.display==='none'?'block':'none'}

async function saveSearchAlert(){if(!user)return toast('Connectez-vous pour enregistrer une alerte.');const {error}=await sb.from('search_alerts').insert({user_id:user.id,query,commune:selectedCommune,min_price:advanced.min?Number(advanced.min):null,max_price:advanced.max?Number(advanced.max):null,condition:advanced.condition,seller_type:advanced.seller});toast(error?'Configuration SQL des alertes nécessaire.':'Alerte enregistrée. Les nouvelles correspondances seront affichées dans vos notifications.');}
async function checkSearchAlerts(){if(!user)return;const {data,error}=await sb.from('search_alerts').select('*').eq('user_id',user.id);if(error)return;for(const f of data||[]){const matches=ads.filter(a=>new Date(a.created_at)>new Date(f.created_at)&&(!f.query||[a.title,a.description].join(' ').toLowerCase().includes(f.query.toLowerCase()))&&(f.commune==='Toutes les communes'||a.city===f.commune)&&(!f.min_price||a.price>=f.min_price)&&(!f.max_price||a.price<=f.max_price));for(const a of matches.slice(0,5)){const key='alert-'+f.id+'-'+a.id;if(!notes.some(n=>n.key===key))notes.unshift({key,icon:'🔔',title:'Nouvelle annonce correspondante',body:a.title,date:fmtTime(a.created_at)})}}localStorage.setItem('bm-notifications',JSON.stringify(notes));}
const previousLoadAds=loadAds;loadAds=async function(){await previousLoadAds();await checkSearchAlerts();};
const originalAuthPage=authPage;authPage=function(a,msg){originalAuthPage(a,msg);if(authMode!=='up')return;const type=$('#accounttype');if(!type)return;type.addEventListener('change',professionalFields);professionalFields()};
function professionalFields(){const type=$('#accounttype'),form=$('#authform');if(!type||!form)return;let block=$('#profields');if(block)block.remove();if(type.value!=='professional')return;type.insertAdjacentHTML('parentElement' in type?'afterend':'afterend',`<div id="profields" class="panel"><h3>Vérification professionnelle obligatoire</h3><p class="muted">Votre compte restera en attente jusqu'à la validation par un administrateur. Documents privés, non affichés au public.</p><label>Numéro IFU<input id="ifu" required minlength="6" maxlength="40"></label><label>Justificatif IFU (PDF ou image)<input id="ifufile" type="file" accept="image/*,application/pdf" required></label><label>Pièce d'identité (PDF ou image)<input id="identityfile" type="file" accept="image/*,application/pdf" required></label></div>`)}
const originalAuthSubmit=authSubmit;authSubmit=async function(e){if(authMode!=='up'||$('#accounttype')?.value!=='professional')return originalAuthSubmit(e);e.preventDefault();const ifu=$('#ifu')?.value.trim(),files=[$('#ifufile')?.files[0],$('#identityfile')?.files[0]];if(!ifu||files.some(f=>!f||f.size>5e6||!['application/pdf','image/jpeg','image/png','image/webp'].includes(f.type)))return toast('IFU et documents PDF/images (5 Mo maximum chacun) obligatoires.');const email=$('#email').value.trim(),password=$('#password').value;const metadata={name:($('#firstname').value.trim()+' '+$('#lastname').value.trim()).trim(),first_name:$('#firstname').value.trim(),last_name:$('#lastname').value.trim(),phone:$('#phone').value.trim(),sex:$('#sex').value,account_type:'professional'};try{const {data,error}=await sb.auth.signUp({email,password,options:{data:metadata}});if(error)throw error;if(!data.session){toast('Confirmez votre email, puis connectez-vous pour déposer vos documents. Compte non validé.');return}user=data.user;await submitProfessionalDocuments(ifu,files);go('profile')}catch(err){toast('Inscription : '+err.message)}};
async function submitProfessionalDocuments(ifu,files){if(!user)return;try{const paths=[];for(let i=0;i<files.length;i++){const f=files[i],path=`${user.id}/${i===0?'ifu':'identity'}-${Date.now()}.${f.type==='application/pdf'?'pdf':f.type.split('/')[1]}`;const {error}=await sb.storage.from('verification-docs').upload(path,f,{upsert:false,contentType:f.type});if(error)throw error;paths.push(path)}const {error}=await sb.from('professional_verifications').upsert({user_id:user.id,ifu,ifu_path:paths[0],identity_path:paths[1],status:'pending'},{onConflict:'user_id'});if(error)throw error;toast('Dossier envoyé. Validation administrateur requise.')}catch(err){toast('Dépôt impossible : '+err.message+' — ne transmettez pas vos documents dans la messagerie.')}}
async function uploadProfessionalLater(){if(!user)return toast('Connectez-vous.');$('#modal').innerHTML=`<div class="overlay" onclick="closeModal()"><div class="sheet" onclick="event.stopPropagation()"><button class="close" onclick="closeModal()">×</button><h2>Vérifier mon compte professionnel</h2><form id="verifyform"><label>IFU<input id="vifu" required></label><label>Justificatif IFU<input id="vifufile" type="file" accept="image/*,application/pdf" required></label><label>Pièce d'identité<input id="vidfile" type="file" accept="image/*,application/pdf" required></label><button class="btn">Soumettre pour validation</button></form></div></div>`;$('#verifyform').onsubmit=async e=>{e.preventDefault();await submitProfessionalDocuments($('#vifu').value.trim(),[$('#vifufile').files[0],$('#vidfile').files[0]]);closeModal()}}
const previousProfile=profilePage;profilePage=function(a){previousProfile(a);a.insertAdjacentHTML('afterbegin',`<div class="panel"><b>Membre depuis ${fmtYear(user.created_at)}</b><p class="muted">Dernière déconnexion : ${fmtTime(user.user_metadata?.last_logout_at)}</p>${user.user_metadata?.account_type==='professional'?'<button class="btn ghost" onclick="uploadProfessionalLater()">📄 Déposer / suivre mon dossier IFU</button>':''}</div>`)};
const oldShowSeller=showSeller;showSeller=async function(id){await oldShowSeller(id);const sheet=$('#modal .sheet');if(!sheet)return;const {data}=await sb.from('profiles').select('created_at,last_seen_at,account_type').eq('id',id).maybeSingle();sheet.insertAdjacentHTML('afterbegin',`<div class="statusline">Membre depuis ${fmtYear(data?.created_at)} · Dernière activité connue : ${fmtTime(data?.last_seen_at)}</div><button class="btn ghost" onclick="showReviews('${esc(id)}')">⭐ Voir les avis publics</button>`)};
async function showReviews(id){const {data,error}=await sb.from('seller_reviews').select('rating,comment,created_at').eq('seller_id',id).order('created_at',{ascending:false}).limit(30);if(error)return toast('Activez la table des avis dans Supabase.');const sheet=$('#modal .sheet');if(sheet)sheet.innerHTML=`<button class="close" onclick="closeModal()">×</button><h2>Avis publics</h2>${(data||[]).map(r=>`<div class="notice"><b>${'★'.repeat(r.rating)}</b> ${esc(r.comment||'')} <small>${fmtTime(r.created_at)}</small></div>`).join('')||'<p>Aucun avis pour le moment.</p>'}<button class="btn" onclick="leaveReview('${esc(id)}')">Laisser un avis</button>`}
async function leaveReview(id){if(!user)return toast('Connectez-vous.');const rating=Number(prompt('Note du vendeur de 1 à 5'));if(!Number.isInteger(rating)||rating<1||rating>5)return;const comment=prompt('Votre avis (facultatif)')||'';const {error}=await sb.from('seller_reviews').insert({seller_id:id,reviewer_id:user.id,rating,comment});toast(error?'Avis réservé aux acheteurs ayant une transaction confirmée.':'Avis publié.');if(!error)showReviews(id)}
const oldOpenAd=openAd;openAd=function(id){oldOpenAd(id);const sheet=$('#modal .sheet');if(!sheet)return;sheet.insertAdjacentHTML('beforeend',`<button class="btn ghost" onclick="startSaleAgreement('${esc(id)}')">🤝 Proposer de confirmer la vente</button><button class="btn ghost" onclick="saleSecurity('${esc(id)}')">🔒 Suivre les confirmations de vente</button>`)};

  const email=$('#bmemail').value.trim();if(email&&email!==user.email){const r=await sb.auth.updateUser({email});if(r.error)throw r.error}
  const file=$('#bmavatar').files?.[0];if(file){if(!file.type.startsWith('image/')||file.size>5*1024*1024)throw Error('Photo invalide (5 Mo maximum)');await uploadAvatar($('#bmavatar'))}
  await savePublicProfile();closeModal();render();toast('Profil enregistré. Confirmez le nouvel e-mail si demandé.');
 }catch(err){toast('Erreur : '+err.message)}finally{btn.disabled=false;btn.textContent='➤'}};
};

<script>
// V5 DEMONSTRATION : crédits virtuels uniquement, jamais de fonds réels.
function bmV5Error(e){toast('Erreur : '+(e?.message||e));console.error(e)}
async function bmV5Rpc(name,args={}){const {data,error}=await sb.rpc(name,args);if(error)throw error;return data}
function bmV5Money(n){return Number(n||0).toLocaleString('fr-FR')+' FCFA (démo)'}
function bmV5Form(title,fields,handler){const a=$('#app');a.innerHTML=`<div class="panel"><button class="textbtn" onclick="go('wallet')">← Retour</button><h2>${title}</h2><p class="muted">Mode démonstration : aucun argent réel n'est encaissé ni transféré.</p><form id="v5form">${fields}<button class="btn" type="submit">Confirmer</button></form></div>`;$('#v5form').onsubmit=async e=>{e.preventDefault();const btn=e.submitter;btn.disabled=true;try{await handler(new FormData(e.target));toast('Opération enregistrée (démo)');go('wallet')}catch(err){bmV5Error(err)}finally{btn.disabled=false}}}
walletPage=async function(a){if(!user){authPage(a,'Connectez-vous');return}a.innerHTML='<div class="panel"><h2>💰 Mon portefeuille (démo)</h2><div id="v5balance">Chargement…</div><div class="bm-v5-grid"><button class="btn ghost" onclick="bmV5WalletAction(\'topup\')">➕ Ajouter</button><button class="btn ghost" onclick="bmV5WalletAction(\'withdraw\')">↗ Retirer</button><button class="btn ghost" onclick="bmV5WalletAction(\'send\')">↗ Envoyer</button><button class="btn ghost" onclick="bmV5WalletAction(\'save\')">🔒 Épargner</button><button class="btn ghost" onclick="bmV5WalletAction(\'unsave\')">↩ Désépargner</button><button class="btn ghost" onclick="go(\'virtualcard\')">💳 Mes cartes</button></div><h3>Dernières opérations</h3><div id="v5ledger">Chargement…</div></div>';try{const r=await bmV5Rpc('bm_v5_my_wallet');$('#v5balance').innerHTML=`<h2>${bmV5Money(r.available_xof)}</h2><p>Épargne : ${bmV5Money(r.savings_xof)}</p>`;$('#v5ledger').innerHTML=(r.entries||[]).map(x=>`<div class="bm-v5-card">${esc(x.kind)} · ${bmV5Money(x.amount_xof)}<br><small>${esc(x.created_at||'')}</small></div>`).join('Aucune opération')}catch(e){$('#v5balance').textContent='Base V5 non activée : '+e.message}}
function bmV5WalletAction(kind){if(kind==='topup'){bmV6Topup();return;}if(kind==='withdraw'){bmV6Withdraw();return;}const labels={topup:'Demander une recharge',withdraw:'Retirer (démo)',send:'Envoyer (démo)',save:'Épargner (démo)',unsave:'Récupérer mon épargne'};bmV5Form(labels[kind],`<label>Montant FCFA<input name="amount" type="number" min="100" max="1000000" required></label>${kind==='send'?'<label>ID utilisateur destinataire (UUID)<input name="recipient" required></label>':''}`,async f=>{await bmV5Rpc('bm_v5_wallet_action',{p_kind:kind,p_amount:Number(f.get('amount')),p_recipient:f.get('recipient')||null})})}
virtualCardPage=async function(a){if(!user){authPage(a,'Connectez-vous');return}a.innerHTML='<div class="panel"><h2>💳 Mes cartes Bénin Market</h2><p class="muted">Cartes entièrement fictives : aucun réseau bancaire, achat réel ou paiement externe.</p><label>Style de carte<select id="bmCardTheme"><option value="black">Noire</option><option value="orange">Orange</option><option value="yellow">Jaune</option></select></label><button class="btn" onclick="bmV9RequestCard()">＋ Demander une carte</button><p class="muted">Maximum 5 cartes par utilisateur. Le transfert vers une carte se fait uniquement depuis le solde Bénin Market.</p><div id="v5cards">Chargement…</div></div>';try{const cards=(await bmV5Rpc('bm_v9_my_cards')).filter(c=>c.status!=='rejected'&&!c.is_hidden);$('#v5cards').innerHTML=(cards||[]).map((c,i)=>bmV9CardMarkup(c,i)).join('')||'<p>Aucune carte. Demandez votre première carte.</p>'}catch(e){$('#v5cards').textContent='Erreur : '+e.message}}
function bmV9CardMarkup(c,i){const theme=['black','orange','yellow'].includes(c.card_theme)?c.card_theme:'black';const num=c.demo_number||('5399  BM  '+String(c.display_code||c.id||'0000').replace(/[^0-9]/g,'').slice(-4).padStart(4,'0')+'  0000');return `<article class="bm9-card-wrap"><div class="bm9-card ${theme}"><div class="bm9-brand"><b>BENIN MARKET</b><span>DEMO CARD</span></div><div class="bm9-chip"></div><div class="bm9-number" id="bm9num${i}">•••• •••• •••• ${esc(String(num).replace(/\s/g,'').slice(-4))}</div><div class="bm9-bottom"><div><small>TITULAIRE</small><b>${esc(user?.email||'MEMBRE BENIN MARKET')}</b></div><div><small>EXPIRE</small><b>${esc(c.demo_expiry||'12/29')}</b></div><div><small>CVV</small><b id="bm9cvv${i}">•••</b></div></div><div class="bm9-watermark">BM</div></div><div class="bm9-card-meta"><b>${esc(c.display_code||'Carte virtuelle')} · ${esc(theme.toUpperCase())}</b><span class="bm-v5-pill">${esc(c.status)}</span><h3>${bmV5Money(c.balance_xof)}</h3><div class="bm9-actions"><button class="btn ghost" onclick="bmV9ToggleCard('${c.id}',${i},'${esc(String(num).replace(/'/g,''))}','${esc(c.demo_cvv||'123')}')">👁 Voir / cacher</button>${c.status==='approved'?`<button class="btn ghost" onclick="bmV5FundCard('${c.id}')">＋ Depuis mon solde</button>`:''}</div></div></article>`}
function bmV9ToggleCard(id,i,num,cvv){const n=document.getElementById('bm9num'+i),v=document.getElementById('bm9cvv'+i);if(!n||!v)return;const hidden=n.textContent.includes('••••');n.textContent=hidden?(num.match(/.{1,4}/g)||[num]).join(' '):'•••• •••• •••• '+num.slice(-4);v.textContent=hidden?cvv:'•••'}
async function bmV9RequestCard(){const theme=document.getElementById('bmCardTheme')?.value||'black';try{await bmV5Rpc('bm_v9_request_card',{p_theme:theme});toast('Demande de carte enregistrée (démo)');go('virtualcard')}catch(e){bmV5Error(e)}}

function bmV5FundCard(id){const amount=Number(prompt('Montant à transférer de mon solde vers ma carte (FCFA démo)'));if(!Number.isInteger(amount)||amount<100)return;bmV5Rpc('bm_v5_fund_card',{p_card:id,p_amount:amount}).then(()=>{toast('Carte créditée (démo)');go('virtualcard')}).catch(bmV5Error)}
function bmV5CardTopup(id){const amount=Number(prompt('Montant de la demande de recharge directe (FCFA démo)'));if(!Number.isInteger(amount)||amount<100)return;bmV5Rpc('bm_v5_card_topup_request',{p_card:id,p_amount:amount}).then(()=>toast('Demande transmise à l’administration (démo)')).catch(bmV5Error)}
datingPage=function(a){if(!user){authPage(a,'Connectez-vous');return}a.innerHTML=`<div class="panel"><h2>💞 Rencontres</h2><p class="muted">Réservé aux adultes de 18 ans et plus. Les profils sont privés jusqu'à vérification.</p><form id="v5dating"><label>Nom<input name="last_name" required maxlength="70"></label><label>Prénom<input name="first_name" required maxlength="70"></label><label>Âge<input name="age" type="number" min="18" max="100" required></label><label>Sexe<select name="gender"><option value="woman">Femme</option><option value="man">Homme</option><option value="other">Autre</option></select></label><label>Je recherche<select name="looking_for"><option value="woman">Une femme</option><option value="man">Un homme</option><option value="any">Sans préférence</option></select></label><label>Présentation<textarea name="bio" maxlength="1000"></textarea></label><button class="btn">Demander la vérification du profil</button></form><p class="muted">La discussion entre membres vérifiés nécessite un module de mise en relation et de consentement supplémentaire.</p></div>`;$('#v5dating').onsubmit=async e=>{e.preventDefault();const f=new FormData(e.target);try{await sb.from('bm_v5_dating_profiles').upsert({user_id:user.id,last_name:f.get('last_name'),first_name:f.get('first_name'),age:Number(f.get('age')),gender:f.get('gender'),looking_for:f.get('looking_for'),bio:f.get('bio'),status:'pending'},{onConflict:'user_id'}).then(({error})=>{if(error)throw error});toast('Profil envoyé pour vérification')}catch(err){bmV5Error(err)}}}
jobsPage=async function(a){a.innerHTML=`<div class="panel"><h2>💼 Offres d'emploi</h2><div id="v5jobs">Chargement…</div>${user?`<h3>Publier une offre</h3><form id="v5jobform"><label>Poste<input name="title" required maxlength="140"></label><label>Commune<input name="city" required maxlength="100"></label><label>Description<textarea name="description" required maxlength="5000"></textarea></label><button class="btn">Soumettre à la modération</button></form>`:'<p>Connectez-vous pour postuler ou publier.</p>'}</div>`;if(user){$('#v5jobform').onsubmit=async e=>{e.preventDefault();const f=new FormData(e.target);const {error}=await sb.from('bm_v5_jobs').insert({employer_id:user.id,title:f.get('title'),city:f.get('city'),description:f.get('description')});if(error)return bmV5Error(error);toast('Offre soumise à validation');go('jobs')}}const {data,error}=await sb.from('bm_v5_jobs').select('id,title,city,description,created_at').eq('status','approved').order('created_at',{ascending:false}).limit(60);$('#v5jobs').innerHTML=error?'Offres indisponibles : '+esc(error.message):(data||[]).map(j=>`<div class="bm-v5-card"><h3>${esc(j.title)}</h3><p>${esc(j.city)} · ${esc(j.description)}</p>${user?`<button class="btn ghost" onclick="bmV5ApplyJob('${j.id}')">Postuler</button>`:''}</div>`).join('Aucune offre validée pour le moment')}
async function bmV5ApplyJob(id){const note=prompt('Votre présentation pour cette candidature :');if(!note)return;const {error}=await sb.from('bm_v5_job_applications').insert({job_id:id,applicant_id:user.id,note});toast(error?'Erreur : '+error.message:'Candidature envoyée')}

openAd=function(id){bmV5OldOpenAd(id);const a=ads.find(x=>String(x.id)===String(id));if(!a||!user||String(a.seller_id)!==String(user.id))return;const sheet=$('#modal .sheet');if(sheet){const b=document.createElement('button');b.className='textbtn';b.textContent='🚀 Booster';b.style.fontSize='12px';b.onclick=()=>{closeModal();go('boost')};sheet.appendChild(b)}};

ntent='Module V5 indisponible : '+e.message}}
async function bmV5AdminAction(kind,id,status){try{await bmV5Rpc('bm_v5_admin_decide',{p_kind:kind,p_id:id,p_status:status});toast('Décision enregistrée');bmV5Admin()}catch(e){bmV5Error(e)}}
async function bmV5AdminCredit(){const uid=prompt('UUID du compte utilisateur à créditer :');if(!uid)return;const card=prompt('UUID de carte (laisser vide pour le solde principal) :')||null;const amount=Number(prompt('Montant fictif FCFA :'));if(!Number.isInteger(amount)||amount<100||amount>1000000)return toast('Montant invalide');const reason=prompt('Motif administratif obligatoire :');if(!reason||reason.trim().length<5)return;try{await bmV5Rpc('bm_v5_admin_credit',{p_user:uid,p_card:card,p_amount:amount,p_reason:reason});toast('Crédit fictif enregistré')}catch(e){bmV5Error(e)}}
// Insérer l'espace V5 dans le tableau admin existant, après son rendu.
const bmV5AdminObserver=new MutationObserver(()=>{if(page==='admin'&&$('#app')&&$('#app').textContent.includes('Gestion de la plateforme')&&!$('#v5admin')){bmV5Admin()}});
bmV5AdminObserver.observe(document.getElementById('app'),{childList:true,subtree:false});
</script>

<script>
/* Bénin Market V6 : fonctions supplémentaires, fonds fictifs uniquement. */
CATS.push(['Emploi','💼']);
const bmV6OldHome=home;
home=function(a){bmV6OldHome(a);const cats=a.querySelector('.catgrid');if(cats){const e=cats.querySelector('button:last-child');if(e)e.onclick=()=>go('delivery');const j=[...cats.querySelectorAll('button')].find(x=>x.textContent.includes('Emploi'));if(j)j.onclick=()=>go('jobs')}};
const bmV6OldOpenConversation=openConversation;
openConversation=async function(id,refreshList=true){await bmV6OldOpenConversation(id,refreshList);bmV6Composer()};
function bmV6Composer(){const f=$('#sendmessageform'),bar=f?.querySelector('.bm-composer');if(!bar||bar.dataset.v6)return;bar.dataset.v6='1';const attach=bar.querySelector('.bm-attach');if(attach){attach.style.display='none';}const tools=document.createElement('div');tools.className='bm-v6-tools';tools.innerHTML='<button type="button" class="bm-v6-icon" title="Ajouter" onclick="document.getElementById(\'bmchatfile\').click()">＋</button><button type="button" class="bm-v6-icon" title="Photo / vidéo" onclick="document.getElementById(\'bmchatfile\').click()">▣</button><button type="button" class="bm-v6-icon" id="bmV6Voice" title="Enregistrer un message vocal" onclick="bmV6Record()">🎙</button><button type="button" class="bm-v6-icon" title="Stickers" onclick="bmV6Stickers()">☺</button>';bar.insertBefore(tools,bar.firstChild);const old=bar.querySelector('#sendmessagebtn');if(old)old.textContent='➤';const holder=document.createElement('div');holder.id='bmV6Stickers';holder.hidden=true;holder.className='bm-v6-stickers';holder.innerHTML=['❤️','👍','😂','😍','🎉','🙏','😎','👋','💚','🥰','👏','🔥'].map(x=>`<button type="button" onclick="bmV6SendSticker('${x}')">${x}</button>`).join('');f.after(holder)}
function bmV6Stickers(){const h=$('#bmV6Stickers');if(h)h.hidden=!h.hidden}
async function bmV6SendSticker(emoji){const input=$('#messagecontent'),form=$('#sendmessageform');if(!input||!form)return;input.value=emoji;$('#bmV6Stickers').hidden=true;form.requestSubmit()}
let bmV6Recorder=null,bmV6Chunks=[];
async function bmV6Record(){const btn=$('#bmV6Voice');if(bmV6Recorder?.state==='recording'){bmV6Recorder.stop();btn.textContent='🎙';return}try{if(!navigator.mediaDevices?.getUserMedia||!window.MediaRecorder)throw Error('Enregistrement indisponible sur cet appareil');const stream=await navigator.mediaDevices.getUserMedia({audio:true});const preferred=['audio/webm;codecs=opus','audio/mp4','audio/webm'].find(x=>MediaRecorder.isTypeSupported(x));bmV6Chunks=[];bmV6Recorder=new MediaRecorder(stream,preferred?{mimeType:preferred}:undefined);bmV6Recorder.ondataavailable=e=>{if(e.data.size)bmV6Chunks.push(e.data)};bmV6Recorder.onstop=async()=>{stream.getTracks().forEach(t=>t.stop());const type=bmV6Recorder.mimeType.split(';')[0];const blob=new Blob(bmV6Chunks,{type});if(blob.size>8*1024*1024)return toast('Message vocal trop long (8 Mo max)');try{const {data:msg,error}=await sb.from('messages').insert({sender_id:user.id,recipient_id:activeChat,content:'🎙 Message vocal'}).select('id').single();if(error)throw error;const path=`${user.id}/${msg.id}/${crypto.randomUUID()}-audio`;const up=await sb.storage.from('bm-chat-private').upload(path,blob,{contentType:type});if(up.error)throw up.error;const ins=await sb.from('bm_chat_attachments').insert({message_id:String(msg.id),sender_id:user.id,recipient_id:activeChat,storage_path:path,mime_type:type,size_bytes:blob.size});if(ins.error)throw ins.error;await refreshChat()}catch(e){toast('Audio non envoyé : '+e.message)}};bmV6Recorder.start();btn.textContent='⏹';toast('Enregistrement en cours. Appuie à nouveau pour envoyer.')}catch(e){toast(e.message)}}
const bmV6OldRefresh=refreshChat;
refreshChat=async function(){await bmV6OldRefresh();const log=$('#chatmessages');if(!log)return;const audios=log.querySelectorAll('a[href],video,source');/* Les pièces jointes audio sont rendues par le complément ci-dessous. */try{const {data,error}=await sb.from('messages').select('id,sender_id,recipient_id,created_at').or(`and(sender_id.eq.${user.id},recipient_id.eq.${activeChat}),and(sender_id.eq.${activeChat},recipient_id.eq.${user.id})`).order('created_at',{ascending:false}).limit(80);if(error||!data?.length)return;const ids=data.map(x=>String(x.id));const r=await sb.from('bm_chat_attachments').select('message_id,storage_path,mime_type').in('message_id',ids).in('mime_type',['audio/webm','audio/mp4']);if(r.error||!r.data?.length)return;let holder=log.querySelector('#bmV6AudioMessages');if(!holder){holder=document.createElement('div');holder.id='bmV6AudioMessages';log.appendChild(holder)}holder.innerHTML='';for(const x of r.data){const signed=await sb.storage.from('bm-chat-private').createSignedUrl(x.storage_path,600);if(signed.error)continue;const box=document.createElement('div');box.className='bm-v6-item';box.textContent='🎙 Message vocal ';const player=document.createElement('audio');player.controls=true;player.preload='none';player.src=signed.data.signedUrl;box.appendChild(player);holder.appendChild(box)}}catch(e){console.warn('audio',e)}};
const bmV6OldWallet=walletPage;
walletPage=async function(a){await bmV6OldWallet(a);const panel=a.querySelector('.panel');if(panel){const link=document.createElement('div');link.innerHTML='<h3>💳 Mes cartes</h3><button class="btn ghost" onclick="go(\'virtualcard\')">Afficher mes cartes et recharger depuis mon solde</button><h3>📲 Recharger par Mobile Money (simulation)</h3><p class="muted">Aucun prélèvement réel : demande soumise à l’administrateur pour un crédit fictif.</p><button class="btn ghost" onclick="bmV6Topup()">Demander une recharge démo</button>';panel.appendChild(link)}};
async function bmV6Topup(){const amount=Number(prompt('Montant demandé (FCFA fictifs, 100 à 1 000 000)'));if(!Number.isInteger(amount)||amount<100||amount>1000000)return;const phone=prompt('Numéro Mobile Money de référence (aucun débit effectué) :');if(!phone||phone.trim().length<8)return toast('Numéro invalide');try{const {error}=await sb.from('bm_v6_topup_requests').insert({user_id:user.id,amount_xof:amount,phone_reference:phone.trim().slice(0,30)});if(error)throw error;toast('Demande démo transmise à l’administration')}catch(e){toast('Erreur : '+e.message)}}
const bmV6OldAdmin=bmV5Admin;
bmV5Admin=async function(){await bmV6OldAdmin();const host=$('#v5admin');if(!host||host.querySelector('#bmV6Admin'))return;const panel=document.createElement('div');panel.id='bmV6Admin';panel.innerHTML='<h3>📲 Recharges Mobile Money simulées</h3><div id="bmV6Topups">Chargement…</div><h3>🔎 Demandes d’emploi</h3><div id="bmV6Seeking">Chargement…</div>';host.appendChild(panel);try{const [t,j]=await Promise.all([sb.rpc('bm_v6_admin_topups'),sb.from('bm_v6_job_seeking').select('id,title,city,status').order('created_at',{ascending:false}).limit(60)]);if(t.error)throw t.error;$('#bmV6Topups').innerHTML=(t.data||[]).map(x=>`<div class="bm-v6-item">${esc(x.user_id)} · ${bmV5Money(x.amount_xof)} · ${esc(x.status)} <button class="btn ghost" onclick="bmV6ReviewTopup('${x.id}','approved')">Approuver (démo)</button> <button class="textbtn" onclick="bmV6ReviewTopup('${x.id}','rejected')">Refuser</button></div>`).join('Aucune demande');$('#bmV6Seeking').innerHTML=j.error?esc(j.error.message):(j.data||[]).map(x=>`<div class="bm-v6-item">${esc(x.title)} · ${esc(x.city)} · ${esc(x.status)} <button class="btn ghost" onclick="bmV6ReviewSeeking('${x.id}','approved')">Valider</button> <button class="textbtn" onclick="bmV6ReviewSeeking('${x.id}','rejected')">Refuser</button></div>`).join('Aucune demande')}catch(e){$('#bmV6Topups').textContent='Erreur : '+e.message}};
async function bmV6ReviewTopup(id,status){try{const {error}=await sb.rpc('bm_v6_admin_review_topup',{p_id:id,p_status:status});if(error)throw error;toast('Décision enregistrée (démo)');bmV5Admin()}catch(e){toast(e.message)}}
async function bmV6ReviewSeeking(id,status){try{const {error}=await sb.rpc('bm_v6_admin_review_job_seeking',{p_id:id,p_status:status});if(error)throw error;toast('Décision enregistrée');bmV5Admin()}catch(e){toast(e.message)}}
const bmV6OldJobs=jobsPage;
jobsPage=async function(a){a.innerHTML='<div class="panel"><h2>💼 Emploi</h2><div class="row"><button class="btn ghost" onclick="bmV6JobsTab(\'offers\')">Offres d’emploi</button><button class="btn ghost" onclick="bmV6JobsTab(\'seeking\')">Demandes d’emploi</button></div><div id="bmV6JobsBody"></div></div>';await bmV6JobsTab('offers')};
async function bmV6JobsTab(tab){const host=$('#bmV6JobsBody');if(!host)return;if(tab==='offers'){const temp=document.createElement('div');host.innerHTML='';host.appendChild(temp);await bmV6OldJobs(temp);return}host.innerHTML=`<h3>Personnes qui recherchent un emploi</h3><div id="bmV6SeekList">Chargement…</div>${user?'<h3>Demander un emploi</h3><form id="bmV6SeekForm"><label>Poste recherché<input name="title" required maxlength="140"></label><label>Commune<input name="city" required maxlength="100"></label><label>Présentation<textarea name="description" maxlength="3000" required></textarea></label><button class="btn">Envoyer pour validation</button></form>':'<p>Connectez-vous pour publier.</p>'}`;if(user)$('#bmV6SeekForm').onsubmit=async e=>{e.preventDefault();const f=new FormData(e.target);const {error}=await sb.from('bm_v6_job_seeking').insert({user_id:user.id,title:f.get('title'),city:f.get('city'),description:f.get('description')});if(error)return toast(error.message);toast('Demande envoyée à la modération');bmV6JobsTab('seeking')};const {data,error}=await sb.from('bm_v6_job_seeking').select('id,user_id,title,city,description').eq('status','approved').order('created_at',{ascending:false}).limit(80);$('#bmV6SeekList').innerHTML=error?esc(error.message):(data||[]).map(x=>`<div class="bm-v6-item"><b>${esc(x.title)}</b> · ${esc(x.city)}<p>${esc(x.description)}</p>${user?`<button class="btn ghost" onclick="go('messages');setTimeout(()=>openConversation('${x.user_id}'),500)">Contacter</button>`:''}</div>`).join('Aucune demande approuvée')}
const bmV6OldDating=datingPage;
datingPage=async function(a){await bmV6OldDating(a);const wrap=document.createElement('section');wrap.className='panel';wrap.innerHTML='<h3>🔎 Profils de rencontre vérifiés</h3><p class="muted">Seuls les membres approuvés peuvent consulter et contacter les autres membres. Les informations restent réservées aux membres connectés.</p><div id="bmV6DatingList">Chargement…</div>';a.appendChild(wrap);if(!user){$('#bmV6DatingList').textContent='Connectez-vous';return}const {data,error}=await sb.rpc('bm_v6_dating_directory');$('#bmV6DatingList').innerHTML=error?'Annuaire indisponible : '+esc(error.message):(data||[]).map(x=>`<div class="bm-v6-item"><b>${esc(x.first_name)}</b> · ${Number(x.age)} ans <p>${esc(x.bio||'')}</p><button class="btn ghost" onclick="go('messages');setTimeout(()=>openConversation('${x.user_id}'),500)">Écrire</button></div>`).join('Aucun profil vérifié')};
const bmV6OldOther=typeof otherPage==='function'?otherPage:null;
if(bmV6OldOther)otherPage=function(a){bmV6OldOther(a);const btn=document.createElement('button');btn.className='menuitem';btn.innerHTML='<span>🚚</span> Coursier / Livraison <span class="arrow">›</span>';btn.onclick=()=>go('delivery');a.prepend(btn)};
</script>
<script>

async function bmV6Withdraw(){if(!user)return toast('Connexion requise');const amount=Number(prompt('Retrait fictif demandé (FCFA) :'));if(!Number.isInteger(amount)||amount<100||amount>1000000)return toast('Montant invalide');const phone=prompt('Numéro Mobile Money destinataire (aucun transfert réel) :');if(!phone||phone.trim().length<8)return toast('Numéro invalide');try{const {error}=await sb.from('bm_v6_withdraw_requests').insert({user_id:user.id,amount_xof:amount,phone_reference:phone.trim().slice(0,30)});if(error)throw error;toast('Demande de retrait fictif transmise à l’administrateur')}catch(e){toast('Erreur : '+e.message)}}
// Montre les demandes de retrait au même endroit que les autres demandes administratives.
const bmV61Admin=bmV5Admin;
bmV5Admin=async function(){await bmV61Admin();const host=document.getElementById('bmV6Admin');if(!host)return;let section=document.getElementById('bmV61Withdraw');if(!section){section=document.createElement('div');section.id='bmV61Withdraw';host.appendChild(section)}try{const {data,error}=await sb.rpc('bm_v6_admin_withdrawals');if(error)throw error;section.innerHTML='<h3>↗ Retraits Mobile Money (démo)</h3>'+(data||[]).map(x=>`<div class="bm-v6-item">${esc(x.user_id)} · ${bmV5Money(x.amount_xof)} · ${esc(x.status)} <button class="btn ghost" onclick="bmV61ReviewWithdrawal('${x.id}','approved')">Approuver (démo)</button> <button class="textbtn" onclick="bmV61ReviewWithdrawal('${x.id}','rejected')">Refuser</button></div>`).join('Aucune demande de retrait')}catch(e){section.textContent='Retraits : '+e.message}};
async function bmV61ReviewWithdrawal(id,status){try{await bmV5Rpc('bm_v6_admin_review_withdrawal',{p_id:id,p_status:status});toast('Décision de retrait fictif enregistrée');bmV5Admin()}catch(e){bmV5Error(e)}}

<script>
// V6.2: les demandes administratives V6 restent visibles si la vue V5 est indisponible.
(function(){
 const previous=window.bmV5Admin;
 window.bmV5Admin=async function(){
   try { await previous(); } catch(e) { console.error('Administration V5',e); }
   const app=document.getElementById('app');
   if(!app || typeof user==='undefined' || !user) return;
   let container=document.getElementById('bmV62Independent');
   if(!container){container=document.createElement('section');container.id='bmV62Independent';container.className='panel';app.prepend(container);}
   container.innerHTML='<h3>📥 Demandes financières (démo)</h3><div id="bmV62Requests">Chargement…</div>';
   const target=document.getElementById('bmV62Requests');
   const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
   for(const [title,fn,action] of [['Recharges Mobile Money','bm_v6_admin_topups','bmV6ReviewTopup'],['Retraits Mobile Money','bm_v6_admin_withdrawals','bmV6ReviewWithdrawal']]){
     const h=document.createElement('div');h.innerHTML='<h4>'+title+'</h4>';
     target.appendChild(h);
     try{
       const {data,error}=await sb.rpc(fn);if(error)throw error;
       const items=Array.isArray(data)?data:[];
       if(!items.length){h.insertAdjacentHTML('beforeend','<p class="muted">Aucune demande enregistrée.</p>');continue;}
       items.forEach(x=>{
         const card=document.createElement('div');card.className='bm-v5-card';
         card.innerHTML='<strong>'+esc(x.amount_xof)+' FCFA (démo)</strong><p>Compte : '+esc(x.user_id)+'</p><p>État : '+esc(x.status)+'</p>';
         if(x.status==='pending'){
           for(const [label,status] of [['Approuver','approved'],['Refuser','rejected']]){
             const b=document.createElement('button');b.className='btn ghost';b.textContent=label;
             b.onclick=async()=>{if(!confirm(label+' cette demande fictive ?'))return; b.disabled=true;try{const r=await sb.rpc(fn==='bm_v6_admin_topups'?'bm_v6_admin_review_topup':'bm_v6_admin_review_withdrawal',{p_id:x.id,p_status:status});if(r.error)throw r.error;await window.bmV5Admin();}catch(e){alert(e.message)}finally{b.disabled=false}};
             card.appendChild(b);
           }
         }
         h.appendChild(card);
       });
     }catch(e){const msg=document.createElement('p');msg.textContent='Module indisponible : '+e.message;h.appendChild(msg);}
   }
 };
})();
</script>

<script>
(function(){
 const cats=[['wallet','💰 Recharges portefeuille'],['card','💳 Cartes et recharges'],['jobs','💼 Demandes d’emploi'],['general','📋 Demandes générales'],['history','🗂️ Historique']];
 let tab='wallet', busy=false;
 const $=id=>document.getElementById(id);
 const esc=v=>String(v??'—').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
 const dt=v=>v?new Date(v).toLocaleString('fr-FR'):'—';
 function ensure(){let el=$('bmV8Admin');if(!el){el=document.createElement('section');el.id='bmV8Admin';const app=$('app');if(!app)return null;app.prepend(el)}return el}
 function shell(){const el=ensure();if(!el)return;el.innerHTML='<div style="display:flex;justify-content:space-between;gap:10px;align-items:center;flex-wrap:wrap"><div><h2 style="margin:0">🛡️ Administration — V9</h2><p class="v8-muted">Demandes récentes, décisions et historique. Les crédits restent des opérations fictives.</p></div><button class="btn ghost" id="v8refresh">↻ Actualiser</button></div><div class="v8-tabs" id="v8tabs"></div><div id="v8body">Chargement…</div>';el.querySelector('#v8refresh').onclick=load;drawTabs();}
 function drawTabs(){const t=$('v8tabs');if(!t)return;t.innerHTML=cats.map(([id,label])=>`<button data-tab="${id}" class="${id===tab?'active':''}">${label}</button>`).join('');t.querySelectorAll('button').forEach(b=>b.onclick=()=>{tab=b.dataset.tab;drawTabs();load()})}
 async function rpc(name,args){const r=await sb.rpc(name,args||{});if(r.error)throw r.error;return r.data}
 async function load(){if(busy)return;busy=true;const body=$('v8body');if(!body){busy=false;return}body.textContent='Chargement…';try{
  let rows=[];
  if(tab==='wallet'){
   const a=await rpc('bm_v6_admin_topups'); rows=(Array.isArray(a)?a:[]).map(x=>({...x,_type:'wallet',_label:'Recharge portefeuille'}));
   const b=await rpc('bm_admin_requests',{p_kind:'wallet'});rows=rows.concat((Array.isArray(b)?b:[]).map(x=>({...x,_type:'service_wallet',_label:'Demande financière générale'})));
  }else if(tab==='card'){
   const a=await rpc('bm_v5_admin_overview');rows=(a?.cards||[]).map(x=>({...x,_type:'card',_label:'Carte virtuelle'})).concat((a?.topups||[]).map(x=>({...x,_type:'card_topup',_label:'Recharge de carte'})));
   const b=await rpc('bm_admin_requests',{p_kind:'card'});rows=rows.concat((Array.isArray(b)?b:[]).map(x=>({...x,_type:'service',_label:'Demande de carte'})));
  }else if(tab==='jobs'){
   const r=await sb.from('bm_v6_job_seeking').select('id,user_id,title,city,description,status,created_at').order('created_at',{ascending:false}).limit(100);if(r.error)throw r.error;rows=(r.data||[]).map(x=>({...x,_type:'job_v6',_label:'Recherche d’emploi'}));
   const b=await rpc('bm_admin_requests',{p_kind:'job'});rows=rows.concat((Array.isArray(b)?b:[]).map(x=>({...x,_type:'service',_label:'Demande emploi générale'})));
  }else if(tab==='general'){
   for(const k of ['boost','dating']){const a=await rpc('bm_admin_requests',{p_kind:k});rows=rows.concat((Array.isArray(a)?a:[]).map(x=>({...x,_type:'service',_label:k==='boost'?'Boost':'Rencontre'})))}
   const m=await rpc('bm_admin_money_requests');rows=rows.concat((Array.isArray(m)?m:[]).map(x=>({...x,_type:'money',_label:'Demande financière'})));
  }else{
   const sources=[['wallet',async()=>await rpc('bm_v6_admin_topups')],['card',async()=>{const a=await rpc('bm_v5_admin_overview');return [...(a?.cards||[]),...(a?.topups||[])]}],['job',async()=>{const a=await sb.from('bm_v6_job_seeking').select('*').order('created_at',{ascending:false}).limit(100);if(a.error)throw a.error;return a.data||[]}]];
   for(const [kind,fn] of sources){const a=await fn();rows=rows.concat(a.map(x=>({...x,_type:kind==='wallet'?'wallet':kind==='job'?'job_v6':(x.card_id?'card_topup':'card'),_label:kind==='wallet'?'Recharge portefeuille':kind==='job'?'Recherche emploi':(x.card_id?'Recharge carte':'Carte virtuelle')})))}
   for(const k of ['job','dating','boost','card','wallet']){const a=await rpc('bm_admin_requests',{p_kind:k});rows=rows.concat((Array.isArray(a)?a:[]).map(x=>({...x,_type:'service',_label:'Demande '+k})))}
   const m=await rpc('bm_admin_money_requests');rows=rows.concat((Array.isArray(m)?m:[]).map(x=>({...x,_type:'money',_label:'Demande financière'})));
  }
  rows.sort((a,b)=>new Date(b.created_at||0)-new Date(a.created_at||0));
  if(tab!=='history')rows=rows.filter(x=>String(x.status||'').toLowerCase()==='pending');else rows=rows.filter(x=>String(x.status||'').toLowerCase()!=='pending');
  if(!rows.length){body.innerHTML='<p>Aucune demande dans cette rubrique pour ce filtre.</p><p class="v8-muted">Si tu sais qu’une demande existe, vérifie le message d’erreur ci-dessous après actualisation. Les demandes sont conservées dans Supabase.</p>';return}
  body.innerHTML=rows.map((x,i)=>`<article class="v8-card"><b>${esc(x._label)} — ${esc(x.title||x.kind||x.display_code||'Demande utilisateur')}</b><p>${esc(x.details||x.description||x.city||'')}</p><div class="v8-muted">Utilisateur : ${esc(x.user_id)}<br>Montant : ${x.amount_xof!=null?esc(x.amount_xof)+' FCFA':'—'}<br>Statut : ${esc(x.status)}<br>Créée le : ${esc(dt(x.created_at))}<br>Référence : ${esc(x.id)}</div><div class="v8-actions" data-row="${i}">${String(x.status).toLowerCase()==='pending'?'<button class="btn" data-action="approved">Approuver</button><button class="btn danger" data-action="rejected">Refuser</button>':''}</div></article>`).join('');
  body.querySelectorAll('[data-row]').forEach((box,i)=>box.querySelectorAll('button').forEach(btn=>btn.onclick=()=>decide(rows[i],btn.dataset.action,btn)));
 }catch(e){body.innerHTML='<div class="v8-card"><b>Erreur de chargement Supabase</b><p>'+esc(e.message||e)+'</p><p class="v8-muted">Le panneau n’affiche pas une liste vide en cas d’erreur : le message exact est visible ici.</p></div>'}finally{busy=false}}
 async function decide(x,status,btn){if(!confirm((status==='approved'?'Approuver':'Refuser')+' cette demande ?'))return;btn.disabled=true;try{
  if(x._type==='wallet')await rpc('bm_v6_admin_review_topup',{p_id:x.id,p_status:status});
  else if(x._type==='card_topup')await rpc('bm_admin_review_card_topup',{p_request_id:x.id,p_decision:status});
  else if(x._type==='card')await rpc('bm_admin_review_card',{p_card_id:x.id,p_decision:status});
  else if(x._type==='job_v6')await rpc('bm_v6_admin_review_job_seeking',{p_id:x.id,p_status:status});
  else if(x._type==='service')await rpc('bm_admin_decide_request',{p_id:x.id,p_status:status,p_reason:'Décision depuis administration V8'});
  else if(x._type==='money')await rpc('bm_admin_review_money_request',{p_id:x.id,p_decision:status});
  else if(x._type==='service_wallet')throw new Error('Cette demande générale est en lecture seule : elle ne doit pas déclencher un crédit financier.');
  if(typeof toast==='function')toast('Décision enregistrée');await load();
 }catch(e){alert('Décision non enregistrée : '+(e.message||e));btn.disabled=false}}
 async function show(){try{const {data,error}=await sb.rpc('bm_is_admin');if(error)throw error;if(data!==true)return;shell();await load()}catch(e){const el=ensure();if(el)el.innerHTML='<h3>Administration inaccessible</h3><p>'+esc(e.message||e)+'</p>'}}
 const app=$('app');if(app){new MutationObserver(()=>{if(typeof page!=='undefined'&&page==='admin'&&!$('bmV8Admin'))show()}).observe(app,{childList:true,subtree:true})}
 const prev=window.bmAdminPage;window.bmAdminPage=async function(){if(typeof prev==='function')await prev();await show()};
 window.bmV8RefreshRequests=load;
})();
</script>
