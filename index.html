<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#087443"><title>Bénin Market</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700;800&family=Bricolage+Grotesque:wght@600;700;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#f4f7f3;--surface:#fff;--text:#18271e;--muted:#65766a;--green:#087443;--green2:#55c58a;--soft:#e6f4ea;--yellow:#f4c542;--border:#dfe8e0;--red:#c93832;--shadow:0 8px 28px #143d2410}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:15px/1.5 'DM Sans',sans-serif;padding-bottom:90px}button,input,select,textarea{font:inherit}button{cursor:pointer}button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:3px solid var(--yellow);outline-offset:2px}.top{position:sticky;top:0;z-index:5;background:var(--surface);border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;padding:12px 16px}.brand{display:flex;align-items:center;gap:10px;font:800 22px 'Bricolage Grotesque';color:var(--text)}.logo{display:grid;place-items:center;width:40px;height:40px;border-radius:14px;background:linear-gradient(135deg,#087443 0 58%,#f4c542 58% 80%,#c93832 80%);color:#fff}.brand span:last-child span{color:var(--green)}.actions{display:flex;gap:8px}.icon{position:relative;width:42px;height:42px;border:1px solid var(--border);border-radius:14px;background:var(--surface);color:var(--text);font-size:20px}.dot{position:absolute;right:2px;top:2px;background:var(--red);color:#fff;border-radius:99px;font-size:10px;min-width:17px;padding:1px 4px}main{max-width:980px;margin:auto;padding:18px 15px}.hero{background:linear-gradient(135deg,#075d35,#0c8750);color:#fff;border-radius:24px;padding:24px 20px;box-shadow:var(--shadow)}.hero h1{font:800 clamp(29px,7vw,42px)/1.08 'Bricolage Grotesque';margin:8px 0}.hero p{color:#e1f3e7}.search{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:14px}.search input,.search select{margin:0;border:0;background:#fff;color:#17251c;border-radius:12px;padding:12px;min-width:0}.search input:first-child{grid-column:1/-1}.section{display:flex;justify-content:space-between;align-items:end;margin:24px 0 10px}.section h2,h2{font:800 25px/1.2 'Bricolage Grotesque';margin:0}.muted,small{color:var(--muted)}.chips{display:flex;gap:8px;overflow:auto;padding:10px 0 16px}.chip{white-space:nowrap;border:1px solid var(--border);background:var(--surface);color:var(--text);border-radius:13px;padding:9px 13px;font-weight:700}.chip.on{background:var(--green);color:#fff;border-color:var(--green)}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.card{padding:0;overflow:hidden;text-align:left;border:1px solid var(--border);border-radius:17px;background:var(--surface);color:var(--text);min-width:0}.photo,.placeholder{display:grid;width:100%;aspect-ratio:1/1;object-fit:cover;background:var(--soft);place-items:center;color:var(--green);font-size:42px}.cardbody{padding:10px}.price{font:800 17px 'Bricolage Grotesque';color:var(--green)}.title{font-weight:700;font-size:13px;min-height:35px}.meta{font-size:11px;color:var(--muted);margin-top:5px}.panel{background:var(--surface);border:1px solid var(--border);border-radius:20px;padding:18px;margin:10px 0;box-shadow:var(--shadow)}.panel p{overflow-wrap:anywhere}.field{display:block;font-size:13px;font-weight:700;margin-top:13px}.field input,.field select,.field textarea{display:block;width:100%;margin-top:6px;padding:12px;border:1px solid var(--border);border-radius:12px;background:var(--surface);color:var(--text)}.btn{display:inline-flex;justify-content:center;align-items:center;gap:7px;background:var(--green);color:white;border:1px solid var(--green);border-radius:13px;padding:12px 15px;font-weight:800;text-decoration:none;margin-top:12px}.btn.full{width:100%}.btn.light{background:transparent;color:var(--green);border-color:var(--border)}.btn.orange{background:#f47713;border-color:#f47713}.btn.danger{background:transparent;color:var(--red);border-color:var(--red)}.row{display:flex;gap:8px;flex-wrap:wrap}.row>*{flex:1}.tabs{position:fixed;bottom:0;left:0;right:0;z-index:8;background:var(--surface);border-top:1px solid var(--border);display:flex;justify-content:space-around;padding:7px 5px calc(7px + env(safe-area-inset-bottom))}.tabs button{position:relative;border:0;background:transparent;color:var(--muted);font-size:11px;font-weight:700;min-width:0;flex:1;padding:7px 2px}.tabs b{display:block;font-size:21px;line-height:1.2}.tabs .active{color:var(--green)}.tabs .plus{background:var(--green2);color:white;border-radius:50%;font-size:28px;width:54px;height:54px;margin-top:-24px;flex:0 0 54px;box-shadow:0 5px 14px #08744330}.empty{padding:28px 16px;border:1px dashed var(--border);border-radius:16px;text-align:center;color:var(--muted);grid-column:1/-1}.item{padding:13px 0;border-bottom:1px solid var(--border)}.item:last-child{border-bottom:0}.msg{max-width:85%;padding:10px 13px;border-radius:15px;background:var(--soft);margin:8px 0;overflow-wrap:anywhere}.msg.mine{margin-left:auto;background:var(--green);color:white}.badge{display:inline-block;padding:4px 8px;background:var(--soft);color:var(--green);border-radius:99px;font-size:12px;font-weight:800}.tiny{font-size:12px}.hidden{display:none!important}#toast{position:fixed;bottom:100px;left:50%;transform:translateX(-50%);z-index:30;background:#17251c;color:#fff;padding:12px 16px;border-radius:12px;max-width:90%;box-shadow:var(--shadow)}@media(min-width:650px){.grid{grid-template-columns:repeat(3,minmax(0,1fr))}main{padding:24px}.hero{padding:34px}.tabs{position:static;margin-top:25px}.tabs button{font-size:13px}.tabs b{display:inline;margin-right:5px}.tabs .plus{margin-top:0}}@media(min-width:900px){.grid{grid-template-columns:repeat(4,minmax(0,1fr))}}
</style>
</head>
<body>
<header class="top"><div class="brand" onclick="go('home')" role="button"><span class="logo">B</span><span>Bénin <span>Market</span></span></div><div class="actions"><button class="icon" aria-label="Notifications" onclick="go('notifications')">♧<span id="notifCount" class="dot hidden">0</span></button><button class="icon" aria-label="Profil" onclick="go('profile')">♙</button></div></header>
<main id="app" aria-live="polite"></main>
<nav class="tabs" aria-label="Navigation"><button data-view="home" onclick="go('home')"><b>⌂</b>Accueil</button><button data-view="ads" onclick="go('ads')"><b>◇</b>Annonces</button><button class="plus" onclick="go('publish')" aria-label="Publier">＋</button><button data-view="messages" onclick="go('messages')"><b>☏</b>Messages<span id="msgCount" class="dot hidden">0</span></button><button data-view="profile" onclick="go('profile')"><b>♙</b>Profil</button></nav><div id="toast-region"></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
'use strict';
// Le publishable key est prévu pour le navigateur. Ne jamais placer la clé service_role ici.
const SB_URL='https://gsbrfzrifnzmyvcnerrv.supabase.co';
const SB_KEY='sb_publishable_hMg7buwzeVqOvN8-ozE43g_rPzQ9dEc';
const db=window.supabase.createClient(SB_URL,SB_KEY);
const CATS=['Téléphones & Accessoires','Électronique','Maison & Déco','Mode & Beauté','Véhicules','Immobilier','Services','Autres'];
const CITIES=['Cotonou','Abomey-Calavi','Ouidah','Allada','Porto-Novo','Sèmè-Kpodji','Parakou','Bohicon','Abomey','Lokossa','Grand-Popo','Dogbo','Aplahoué','Dassa-Zoumè','Savalou','Djougou','Natitingou','Kandi','Pobè','Sakété','Autre ville du Bénin'];
const $=s=>document.querySelector(s);const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const money=n=>Number(n||0).toLocaleString('fr-FR')+' FCFA';const norm=s=>String(s||'').normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase();
let user=null,view='home',ads=[],category='Toutes',searchText='',cityFilter='',zoneFilter='',activeChat=null,chatChannel=null,notifs=[],conversations=[],courierRows=[],myOrders=[],currentAd=null,photoFiles=[],locConsent=false;
function toast(s){const old=$('#toast');if(old)old.remove();const n=document.createElement('div');n.id='toast';n.textContent=s;document.body.append(n);setTimeout(()=>n.remove(),3500)}
function go(v){view=v;render();window.scrollTo({top:0,behavior:'smooth'});if(v==='messages')loadConversations();if(v==='notifications')loadNotifications();if(v==='couriers')loadCouriers();if(v==='orders')loadOrders()}
function nav(){document.querySelectorAll('[data-view]').forEach(b=>b.classList.toggle('active',b.dataset.view===view))}
function render(){nav();const app=$('#app');const screens={home:home,ads:home,publish:publishPage,profile:profilePage,messages:messagesPage,notifications:notificationsPage,chat:chatPage,couriers:couriersPage,orders:ordersPage,detail:detailPage,auth:authPage,location:locationPage};(screens[view]||home)(app)}
function photo(a){const url=a.image_url||(a.images&&a.images[0]);return url?`<img class="photo" loading="lazy" src="${esc(url)}" alt="${esc(a.title)}">`:`<div class="placeholder">${esc((a.title||'B').slice(0,1).toUpperCase())}</div>`}
function adCard(a){return `<button class="card" onclick="showAd('${esc(a.id)}')">${photo(a)}<div class="cardbody"><div class="price">${money(a.price)}</div><div class="title">${esc(a.title)}</div><div class="meta">⌖ ${esc(a.city||'Bénin')}${a.zone?' · '+esc(a.zone):''}</div></div></button>`}
function home(app){const t=norm(searchText);const filtered=ads.filter(a=>(category==='Toutes'||a.category===category)&&(!t||norm([a.title,a.description].join(' ')).includes(t))&&(!cityFilter||a.city===cityFilter)&&(!zoneFilter||norm(a.zone).includes(norm(zoneFilter))));app.innerHTML=`<section class="hero"><span class="badge">🇧🇯 LE MARCHÉ BÉNINOIS</span><h1>Trouvez votre bonheur.</h1><p>Achetez et vendez près de chez vous, en toute confiance.</p><div class="search"><input placeholder="Rechercher un produit…" value="${esc(searchText)}" oninput="searchText=this.value;home($('#app'))" aria-label="Rechercher un produit"><select aria-label="Filtrer par ville" onchange="cityFilter=this.value;home($('#app'))"><option value="">Toutes les villes</option>${CITIES.map(c=>`<option ${cityFilter===c?'selected':''}>${esc(c)}</option>`).join('')}</select><input placeholder="Quartier ou zone" value="${esc(zoneFilter)}" oninput="zoneFilter=this.value;home($('#app'))" aria-label="Quartier ou zone"><button class="btn" style="margin:0" onclick="home($('#app'))">Rechercher</button></div></section><div class="section"><div><h2>${view==='ads'?'Toutes les annonces':'Annonces récentes'}</h2><small>${filtered.length} résultat(s)</small></div><button class="chip" onclick="go('couriers')">🚚 Coursiers</button></div><div class="chips">${['Toutes',...CATS].map(c=>`<button class="chip ${category===c?'on':''}" onclick="category='${c}';home($('#app'))">${esc(c)}</button>`).join('')}</div><div class="grid">${filtered.length?filtered.map(adCard).join(''):'<div class="empty">Aucune annonce ne correspond à ces filtres.</div>'}</div><div class="section"><h2>Livraisons et commandes</h2><button class="chip" onclick="go('orders')">Mes commandes</button></div>`}
function authPage(app){app.innerHTML=`<div class="panel"><h2>Connexion / inscription</h2><p class="muted">Pour discuter, publier, commander ou proposer des livraisons, connectez-vous avec votre email.</p><label class="field">Nom (pour inscription)<input id="authName" placeholder="Nom et prénom"></label><label class="field">Email<input id="authEmail" type="email" autocomplete="email" placeholder="vous@exemple.com"></label><label class="field">Mot de passe<input id="authPass" type="password" autocomplete="current-password" minlength="6"></label><div class="row"><button class="btn" onclick="auth('in')">Se connecter</button><button class="btn light" onclick="auth('up')">Créer un compte</button></div></div>`}
async function auth(mode){const email=$('#authEmail').value.trim(),password=$('#authPass').value,name=$('#authName').value.trim();if(!email||password.length<6)return toast('Entrez un email valide et un mot de passe de 6 caractères minimum.');const r=mode==='up'?await db.auth.signUp({email,password,options:{data:{name}}}):await db.auth.signInWithPassword({email,password});if(r.error)return toast(r.error.message);user=r.data.user;if(mode==='up'&&!r.data.session){toast('Compte créé. Confirmez votre email avant de vous connecter.');return}await ensureProfile();toast(mode==='up'?'Compte créé.':'Connexion réussie.');go('profile')}
async function ensureProfile(){if(!user)return;const {error}=await db.from('profiles').upsert({id:user.id,name:user.user_metadata?.name||user.email?.split('@')[0]||'Utilisateur',email:user.email},{onConflict:'id'});if(error)console.warn(error.message)}
function profilePage(app){if(!user){app.innerHTML=`<div class="panel"><h2>Bienvenue sur Bénin Market</h2><p>Connectez-vous pour accéder à la messagerie, aux notifications, aux commandes et aux livraisons.</p><button class="btn full" onclick="go('auth')">Connexion / inscription</button></div>`;return}app.innerHTML=`<div class="panel"><h2>${esc(user.user_metadata?.name||user.email||'Mon profil')}</h2><p class="muted">${esc(user.email||'')}</p><span class="badge">Compte connecté</span><button class="btn full" onclick="go('location')">📍 Gérer ma localisation</button><button class="btn full light" onclick="go('messages')">Messages</button><button class="btn full light" onclick="go('notifications')">Notifications</button><button class="btn full light" onclick="go('orders')">Mes commandes / livraisons</button><button class="btn full light" onclick="go('couriers')">Trouver un coursier</button><button class="btn full danger" onclick="logout()">Se déconnecter</button></div>`}
async function logout(){await db.auth.signOut();user=null;go('home')}
function publishPage(app){if(!user){app.innerHTML='<div class="panel"><h2>Publier une annonce</h2><p>Connectez-vous pour publier.</p><button class="btn" onclick="go(\'auth\')">Se connecter</button></div>';return}app.innerHTML=`<div class="panel"><h2>Publier une annonce</h2><label class="field">Titre<input id="adTitle" maxlength="90" placeholder="Ex. Téléphone en très bon état"></label><label class="field">Prix (FCFA)<input id="adPrice" type="number" min="1" step="1"></label><label class="field">Catégorie<select id="adCat">${CATS.map(c=>`<option>${esc(c)}</option>`).join('')}</select></label><label class="field">Ville<select id="adCity">${CITIES.map(c=>`<option>${esc(c)}</option>`).join('')}</select></label><label class="field">Quartier / zone<input id="adZone" maxlength="100" placeholder="Ex. Akpakpa, Fidjrossè"></label><label class="field">Description<textarea id="adDesc" rows="4" maxlength="3000"></textarea></label><label class="field">Photos (optionnel)<input id="adPhotos" type="file" accept="image/*" multiple></label><p class="tiny muted">Le compte doit être connecté. La politique de stockage Supabase doit être configurée avant l’envoi de photos.</p><button class="btn full" onclick="publishAd()">Publier l’annonce</button></div>`}
async function publishAd(){const title=$('#adTitle').value.trim(),price=Number($('#adPrice').value),city=$('#adCity').value,zone=$('#adZone').value.trim();if(!title||price<=0)return toast('Ajoutez un titre et un prix valide.');let images=[];const files=[...$('#adPhotos').files].slice(0,5);for(const f of files){if(!f.type.startsWith('image/'))continue;const path=`${user.id}/${crypto.randomUUID()}.jpg`;const up=await db.storage.from('photos').upload(path,f,{upsert:false,contentType:f.type});if(up.error)return toast('Erreur photo : '+up.error.message);images.push(db.storage.from('photos').getPublicUrl(path).data.publicUrl)}const {error}=await db.from('ads').insert({seller_id:user.id,title,price,category:$('#adCat').value,city,zone,description:$('#adDesc').value.trim(),images,image_url:images[0]||null});if(error)return toast('Erreur : '+error.message);await loadAds();toast('Annonce publiée.');go('home')}
function showAd(id){currentAd=ads.find(a=>a.id===id);if(!currentAd)return;view='detail';render()}
function detailPage(app){const a=currentAd;if(!a){home(app);return}app.innerHTML=`<button class="chip" onclick="go('home')">← Retour</button><div class="panel">${photo(a)}<h2 style="margin-top:14px">${esc(a.title)}</h2><p class="price" style="font-size:25px">${money(a.price)}</p><p class="muted">⌖ ${esc(a.city||'')} ${a.zone?'· '+esc(a.zone):''}</p><p>${esc(a.description||'Pas de description.')}</p><div class="row"><button class="btn" onclick="startChat('${esc(a.seller_id)}','${esc(a.id)}')">✉ Contacter le vendeur</button><button class="btn light" onclick="createOrder('${esc(a.id)}')">Acheter / commander</button></div><button class="btn full light" onclick="go('location')">📍 Localisation partagée (avec autorisation)</button></div>`}
async function startChat(other,adId){if(!user)return go('auth');if(other===user.id)return toast('C’est votre propre annonce.');const {data,error}=await db.rpc('get_or_create_conversation',{other_user:other,ad_uuid:adId});if(error)return toast('Messagerie non configurée : '+error.message);activeChat=data;go('chat');loadChat()}
function messagesPage(app){if(!user){app.innerHTML='<div class="panel"><h2>Messages</h2><p>Connectez-vous pour échanger avec les vendeurs et acheteurs.</p><button class="btn" onclick="go(\'auth\')">Se connecter</button></div>';return}app.innerHTML='<div class="panel"><h2>Messages</h2><p class="muted">Vos conversations réelles apparaîtront ici.</p><div id="conversations">Chargement…</div></div>';loadConversations()}
async function loadConversations(){if(!user)return;const el=$('#conversations');const {data,error}=await db.from('conversation_members').select('conversation_id,conversations(id,ad_id,updated_at,ads(title),messages(body,created_at,sender_id))').eq('user_id',user.id);if(error){if(el)el.textContent='Messagerie à configurer : '+error.message;return}conversations=(data||[]).map(x=>x.conversations).filter(Boolean);if(el)el.innerHTML=conversations.length?conversations.map(c=>`<div class="item"><b>${esc(c.ads?.title||'Conversation')}</b><p class="muted tiny">${esc(c.messages?.[0]?.body||'Ouvrir la conversation')}</p><button class="btn" onclick="activeChat='${esc(c.id)}';go('chat');loadChat()">Ouvrir</button></div>`).join(''):'<p class="muted">Aucune conversation. Ouvrez une annonce pour contacter son vendeur.</p>'}
function chatPage(app){if(!user){app.innerHTML='<div class="panel"><h2>Messages</h2><button class="btn" onclick="go(\'auth\')">Se connecter</button></div>';return}app.innerHTML=`<div class="panel"><button class="chip" onclick="go('messages')">← Conversations</button><h2 style="margin-top:12px">Chat</h2><div id="chatLog" style="min-height:180px">Chargement des messages…</div><form onsubmit="sendChat(event)" class="row"><input id="chatInput" maxlength="3000" placeholder="Écrire un message…" required><button class="btn">Envoyer</button></form></div>`}
async function loadChat(){if(!user||!activeChat)return;const el=$('#chatLog');if(!el)return;const {data,error}=await db.from('messages').select('*').eq('conversation_id',activeChat).order('created_at');if(error){el.textContent='Impossible de charger : '+error.message;return}el.innerHTML=(data||[]).map(m=>`<div class="msg ${m.sender_id===user.id?'mine':''}">${esc(m.body)}<div class="tiny">${new Date(m.created_at).toLocaleString('fr-FR')}</div></div>`).join('')||'<p class="muted">Démarrez la conversation.</p>';el.scrollTop=el.scrollHeight;if(chatChannel)db.removeChannel(chatChannel);chatChannel=db.channel('chat-'+activeChat).on('postgres_changes',{event:'INSERT',schema:'public',table:'messages',filter:'conversation_id=eq.'+activeChat},()=>loadChat()).subscribe()}
async function sendChat(e){e.preventDefault();if(!user||!activeChat)return;const input=$('#chatInput'),body=input.value.trim();if(!body)return;const {error}=await db.from('messages').insert({conversation_id:activeChat,sender_id:user.id,body});if(error)return toast('Envoi impossible : '+error.message);input.value='';await loadChat()}
function notificationsPage(app){if(!user){app.innerHTML='<div class="panel"><h2>Notifications</h2><button class="btn" onclick="go(\'auth\')">Se connecter</button></div>';return}app.innerHTML='<div class="panel"><h2>Notifications</h2><div id="notificationList">Chargement…</div></div>';loadNotifications()}
async function loadNotifications(){if(!user)return;const el=$('#notificationList');const {data,error}=await db.from('notifications').select('*').eq('user_id',user.id).order('created_at',{ascending:false}).limit(100);if(error){if(el)el.textContent='Notifications à configurer : '+error.message;return}notifs=data||[];const unread=notifs.filter(n=>!n.read_at).length;$('#notifCount').textContent=unread;$('#notifCount').classList.toggle('hidden',!unread);if(el)el.innerHTML=notifs.length?notifs.map(n=>`<div class="item"><b>${esc(n.title)}</b><p>${esc(n.body||'')}</p><small>${new Date(n.created_at).toLocaleString('fr-FR')}</small>${!n.read_at?`<button class="btn light" onclick="readNotif('${esc(n.id)}')">Marquer comme lue</button>`:''}</div>`).join(''):'<p class="muted">Aucune notification.</p>'}
async function readNotif(id){const {error}=await db.from('notifications').update({read_at:new Date().toISOString()}).eq('id',id);if(error)return toast(error.message);loadNotifications()}
async function createOrder(adId){if(!user)return go('auth');const a=ads.find(x=>x.id===adId);if(!a)return;const {data,error}=await db.from('orders').insert({ad_id:a.id,buyer_id:user.id,seller_id:a.seller_id,amount:a.price,status:'awaiting_payment',payment_method:'moov_money'}).select().single();if(error)return toast('Commande impossible : '+error.message);toast('Commande créée. Paiement non confirmé.');go('orders')}
function ordersPage(app){if(!user){app.innerHTML='<div class="panel"><h2>Commandes</h2><button class="btn" onclick="go(\'auth\')">Se connecter</button></div>';return}app.innerHTML='<div class="panel"><h2>Mes commandes et livraisons</h2><div id="orderList">Chargement…</div></div>';loadOrders()}
async function loadOrders(){if(!user)return;const el=$('#orderList');const {data,error}=await db.from('orders').select('*,ads(title,city,zone)').or(`buyer_id.eq.${user.id},seller_id.eq.${user.id}`).order('created_at',{ascending:false});if(error){if(el)el.textContent=error.message;return}myOrders=data||[];if(el)el.innerHTML=myOrders.length?myOrders.map(o=>`<div class="item"><b>${esc(o.ads?.title||'Commande')}</b><p>${money(o.amount)} · <span class="badge">${esc(o.status)}</span></p><small>${esc(o.ads?.city||'')} ${esc(o.ads?.zone||'')}</small><div class="row"><button class="btn light" onclick="payMoov('${esc(o.id)}')">Payer par Moov Money</button><button class="btn light" onclick="requestDelivery('${esc(o.id)}')">Demander livraison</button></div><button class="btn light" onclick="trackOrder('${esc(o.id)}')">Suivre la livraison</button></div>`).join(''):'<p class="muted">Aucune commande.</p>'}
async function payMoov(orderId){if(!user)return go('auth');const phone=prompt('Numéro Moov Money du payeur au Bénin (format 229…)');if(!phone)return;const {data,error}=await db.functions.invoke('moov-initiate',{body:{order_id:orderId,msisdn:phone.replace(/\D/g,'')}});if(error)return toast('Paiement non lancé : '+error.message);toast(data?.message||'Demande envoyée au prestataire. Le paiement reste en attente de confirmation.');loadOrders()}
async function requestDelivery(orderId){if(!user)return go('auth');const {data,error}=await db.from('deliveries').insert({order_id:orderId,customer_id:user.id,status:'searching'}).select().single();if(error)return toast('Demande de livraison impossible : '+error.message);toast('Demande créée. Recherche de coursiers…');go('couriers')}
async function trackOrder(orderId){const {data,error}=await db.from('deliveries').select('*,courier_profiles(name,phone)').eq('order_id',orderId).order('created_at',{ascending:false}).limit(1).maybeSingle();if(error)return toast(error.message);alert(data?`Statut : ${data.status}\nCoursier : ${data.courier_profiles?.name||'Pas encore attribué'}\nRéférence : ${data.id}`:'Aucune livraison associée à cette commande.')}
function couriersPage(app){app.innerHTML=`<div class="panel"><h2>🚚 Trouver un coursier</h2><p class="muted">Les coursiers indépendants peuvent créer un profil et recevoir des demandes. Vérifiez l’identité et le prix avant la remise du colis.</p>${user?`<button class="btn full" onclick="registerCourier()">Je suis coursier — m’inscrire</button>`:`<button class="btn full" onclick="go('auth')">Connectez-vous</button>`}<div id="courierList">Chargement…</div></div>`;loadCouriers()}
async function loadCouriers(){const el=$('#courierList');const {data,error}=await db.from('courier_profiles').select('user_id,name,city,zone,phone,available,verified').eq('available',true).order('created_at',{ascending:false});if(error){if(el)el.textContent='Rubrique coursiers à configurer : '+error.message;return}courierRows=data||[];if(el)el.innerHTML=courierRows.length?'<h3 style="margin-top:18px">Coursiers disponibles</h3>'+courierRows.map(c=>`<div class="item"><b>${esc(c.name)}</b> ${c.verified?'<span class="badge">Vérifié</span>':''}<p class="muted">${esc(c.city)} ${c.zone?'· '+esc(c.zone):''}</p><small>Le numéro n’est partagé qu’avec les utilisateurs autorisés.</small><button class="btn light" onclick="requestCourier('${esc(c.user_id)}')">Demander ce coursier</button></div>`).join(''):'<p class="muted">Aucun coursier disponible pour le moment.</p>'}
async function registerCourier(){if(!user)return go('auth');const name=prompt('Nom affiché du coursier');if(!name)return;const city=prompt('Ville de service (ex. Cotonou)');if(!city)return;const zone=prompt('Quartiers desservis (facultatif)')||'';const phone=prompt('Téléphone professionnel (facultatif)')||'';const {error}=await db.from('courier_profiles').upsert({user_id:user.id,name,city,zone,phone,available:true},{onConflict:'user_id'});if(error)return toast(error.message);toast('Profil coursier enregistré. Le badge vérifié est attribué uniquement après contrôle.');loadCouriers()}
async function requestCourier(courierId){if(!user)return go('auth');const deliveryId=prompt('Collez la référence de livraison (créez d’abord une demande dans Mes commandes)');if(!deliveryId)return;const {error}=await db.rpc('request_courier',{p_delivery:deliveryId.trim(),p_courier:courierId});if(error)return toast('Attribution impossible : '+error.message);toast('Coursier attribué à la livraison.');go('orders')}
function locationPage(app){if(!user){app.innerHTML='<div class="panel"><h2>Localisation</h2><button class="btn" onclick="go(\'auth\')">Se connecter</button></div>';return}app.innerHTML=`<div class="panel"><h2>📍 Localisation du compte</h2><p>La position précise est privée. Elle n’est enregistrée que si tu l’autorises et ne doit être partagée qu’avec les personnes nécessaires à une livraison.</p><label><input id="locAgree" type="checkbox" style="width:auto;margin-right:8px">J’autorise Bénin Market à enregistrer ma position pour faciliter une livraison.</label><button class="btn full" onclick="saveLocation()">Partager ma position une fois</button><button class="btn full light" onclick="deleteLocation()">Supprimer ma position enregistrée</button><p class="tiny muted">Le navigateur demandera également ton autorisation. Ne publie jamais ton adresse personnelle exacte dans une annonce publique.</p></div>`}
async function saveLocation(){if(!$('#locAgree').checked)return toast('Coche la case de consentement avant de continuer.');if(!navigator.geolocation)return toast('La géolocalisation n’est pas prise en charge.');navigator.geolocation.getCurrentPosition(async pos=>{const {error}=await db.from('private_locations').upsert({user_id:user.id,latitude:pos.coords.latitude,longitude:pos.coords.longitude,consent_at:new Date().toISOString()},{onConflict:'user_id'});if(error)return toast('Enregistrement impossible : '+error.message);toast('Position enregistrée en privé.');},e=>toast('Position non obtenue : '+e.message),{enableHighAccuracy:true,timeout:12000,maximumAge:0})}
async function deleteLocation(){const {error}=await db.from('private_locations').delete().eq('user_id',user.id);if(error)return toast(error.message);toast('Position supprimée.')}
async function loadAds(){const {data,error}=await db.from('ads').select('id,seller_id,title,price,category,city,zone,description,image_url,images,created_at').order('created_at',{ascending:false}).limit(300);if(error){toast('Chargement des annonces : '+error.message);ads=[]}else ads=data||[];if(view==='home'||view==='ads')home($('#app'))}
async function updateBadges(){if(!user)return;const {count}=await db.from('notifications').select('id',{count:'exact',head:true}).eq('user_id',user.id).is('read_at',null);const n=$('#notifCount');if(n){n.textContent=count||0;n.classList.toggle('hidden',!count)}}
db.auth.onAuthStateChange((_event,session)=>{user=session?.user||null;if(user)setTimeout(async()=>{await ensureProfile();await updateBadges()},0);if(['profile','messages','notifications','publish','orders','couriers'].includes(view))render()});
(async()=>{const {data}=await db.auth.getSession();user=data.session?.user||null;await loadAds();render();if(user){await ensureProfile();await updateBadges()}})();
</script>
</body></html>
