:root{--bg:#fff;--surface:#fff;--text:#092e25;--green:#007b43;--deep:#00693b;--soft:#e9f8f1;--border:#e8f0ed;--muted:#607b89}

function profilePage(a){let name=user.user_metadata?.name||user.email?.split("@")[0]||"Mon profil",mine=ads.filter(x=>x.seller_id===user.id);a.innerHTML=`<div class="panel" style="padding:0;overflow:hidden"><div style="background:linear-gradient(130deg,#075b35,#0b8750);color:white;padding:22px"><div class="row"><div class="avatar">${user.user_metadata?.avatar_url?`<img class="avatar-photo" src="${esc(user.user_metadata.avatar_url)}" alt="Photo de profil">`:esc(name[0].toUpperCase())}</div><div><h2>${esc(name)}</h2><p>Membre de Bénin Market</p><span class="badge">${user.user_metadata?.account_type==="professional"?"Compte professionnel (vérification requise)":"Compte personnel"}</span>${user.user_metadata?.account_type==="professional"?'<div style="margin-top:8px"><span class="badge" style="background:#f4c542;color:#17251c">Dossier professionnel à vérifier</span></div>':""}</div></div><button class="btn ghost" style="color:white" onclick="editProfile()">Modifier le profil</button></div><div class="row" style="text-align:center;padding:16px"><div><h2>${mine.length}</h2><small>Annonces</small></div><div><h2>${mine.filter(x=>x.sold).length}</h2><small>Vendues</small></div><div><h2>${fav.size}</h2><small>Favoris</small></div></div></div><div class="panel"><button class="menuitem" onclick="go('myads')"><span>▤</span>Mes annonces <span class="arrow">›</span></button><button class="menuitem" onclick="go('purchases')"><span>🛍</span>Mes achats <span class="arrow">›</span></button>

 if(!user){authPage(a,"Connectez-vous pour accéder aux messages");return}

let bmPeer=null,bmLocalStream=null,bmCallId=null,bmCallTimer=null,bmRemoteIceCount=0;
async function bmStartCall(kind){if(!user||!activeChat)return;try{await bmEndCall(false);bmLocalStream=await navigator.mediaDevices.getUserMedia({audio:true,video:kind==='video'});const {data,error}=await sb.from('bm_calls').insert({caller_id:user.id,callee_id:activeChat,kind,status:'ringing'}).select('id').single();if(error)throw error;bmCallId=data.id;bmRenderCall('Appel en cours…');await bmCreatePeer(true);const offer=await bmPeer.createOffer();await bmPeer.setLocalDescription(offer);const r=await sb.from('bm_calls').update({offer:JSON.stringify(offer)}).eq('id',bmCallId);if(r.error)throw r.error;bmCallTimer=setInterval(bmPollCall,1500)}catch(e){toast('Appel impossible : '+e.message);await bmEndCall()}}
function bmRenderCall(t){const box=$('#bmcallbox');if(!box)return;box.innerHTML=`<div class="panel"><b>${esc(t)}</b><p id="bmcallstatus" class="muted">Connexion en cours…</p><button id="bmplayremote" hidden class="btn ghost" onclick="document.getElementById('bmremote').play()">🔊 Activer le son / la vidéo</button><div class="row"><video id="bmlocal" autoplay muted playsinline style="width:40%;max-height:170px;background:#142b20"></video><video id="bmremote" autoplay playsinline style="width:60%;max-height:170px;background:#142b20"></video></div><button class="btn danger" onclick="bmEndCall()">Raccrocher</button></div>`;if(bmLocalStream){$('#bmlocal').srcObject=bmLocalStream;$('#bmlocal').play().catch(()=>{})}}
async function bmCreatePeer(initiator){bmPeer=new RTCPeerConnection({iceServers:[{urls:'stun:stun.l.google.com:19302'}]});bmLocalStream.getTracks().forEach(t=>bmPeer.addTrack(t,bmLocalStream));bmPeer.ontrack=e=>{const v=$('#bmremote');if(v){v.srcObject=e.streams[0]||new MediaStream([e.track]);v.play().catch(()=>{const b=$('#bmplayremote');if(b)b.hidden=false})}};bmPeer.onconnectionstatechange=()=>{const el=$('#bmcallstatus');if(el)el.textContent='Connexion : '+bmPeer.connectionState};bmPeer.onicecandidate=async e=>{if(e.candidate&&bmCallId)await sb.from('bm_call_ice').insert({call_id:bmCallId,user_id:user.id,candidate:JSON.stringify(e.candidate)})}}
async function bmCheckIncomingCall(){if(!user||!activeChat||bmCallId)return;const {data}=await sb.from('bm_calls').select('id,kind').eq('callee_id',user.id).eq('caller_id',activeChat).eq('status','ringing').order('created_at',{ascending:false}).limit(1);if(data?.length){const c=data[0];const box=$('#bmcallbox');if(box)box.innerHTML=`<div class="panel">📞 Appel ${c.kind==='video'?'vidéo':'audio'} entrant <button class="btn" onclick="bmAcceptCall('${esc(c.id)}','${esc(c.kind)}')">Répondre</button><button class="btn danger" onclick="bmRejectCall('${esc(c.id)}')">Refuser</button></div>`}}
async function bmAcceptCall(id,kind){try{bmCallId=id;bmRemoteIceCount=0;bmLocalStream=await navigator.mediaDevices.getUserMedia({audio:true,video:kind==='video'});bmRenderCall('Appel connecté…');await bmCreatePeer(false);const {data,error}=await sb.from('bm_calls').select('offer').eq('id',id).single();if(error||!data.offer)throw Error('Offre non disponible');await bmPeer.setRemoteDescription(JSON.parse(data.offer));const answer=await bmPeer.createAnswer();await bmPeer.setLocalDescription(answer);const r=await sb.from('bm_calls').update({answer:JSON.stringify(answer),status:'accepted'}).eq('id',id);if(r.error)throw r.error;bmCallTimer=setInterval(bmPollCall,1500)}catch(e){toast(e.message);await bmEndCall()}}
async function bmPollCall(){if(!bmCallId||!bmPeer)return;const {data}=await sb.from('bm_calls').select('status,answer').eq('id',bmCallId).single();if(!data||['ended','rejected'].includes(data.status)){await bmEndCall(false);return}if(data.answer&&!bmPeer.currentRemoteDescription){try{await bmPeer.setRemoteDescription(JSON.parse(data.answer))}catch(e){console.warn(e)}}const {data:ice}=await sb.from('bm_call_ice').select('id,user_id,candidate').eq('call_id',bmCallId).neq('user_id',user.id).order('created_at',{ascending:true});for(const row of (ice||[]).slice(bmRemoteIceCount)){try{await bmPeer.addIceCandidate(JSON.parse(row.candidate))}catch(e){console.warn(e)}}bmRemoteIceCount=(ice||[]).length}
async function bmRejectCall(id){await sb.from('bm_calls').update({status:'rejected'}).eq('id',id);if($('#bmcallbox'))$('#bmcallbox').innerHTML=''}
async function bmEndCall(update=true){if(bmCallTimer)clearInterval(bmCallTimer);bmCallTimer=null;const id=bmCallId;bmCallId=null;bmRemoteIceCount=0;if(bmPeer){bmPeer.close();bmPeer=null}if(bmLocalStream){bmLocalStream.getTracks().forEach(t=>t.stop());bmLocalStream=null}if(update&&id)await sb.from('bm_calls').update({status:'ended'}).eq('id',id);if($('#bmcallbox'))$('#bmcallbox').innerHTML=''}

async function loadAds(){

 ads=data||[];
 // Enrichissement optionnel sans bloquer les annonces si profiles ou ses colonnes n’existent pas.

}

 if(error){el.textContent='Erreur : '+error.message;return}
 el.innerHTML=(data||[]).map(x=>`<div class="notice" style="display:block"><b>${esc(x.title)}</b><p>${esc(x.details)}</p><p class="muted">${esc(x.user_id)} · ${esc(new Date(x.created_at).toLocaleString('fr-FR'))}</p><span class="badge">${esc(x.status)}</span>${x.status==='pending'&&kind!=='wallet'?`<div class="row"><button class="btn" onclick="bmDecideRequest('${esc(x.id)}','approved','${kind}')">Approuver</button><button class="btn danger" onclick="bmDecideRequest('${esc(x.id)}','rejected','${kind}')">Refuser</button></div>`:''}</div>`).join('')||'<p>Aucune demande.</p>';

async function bmDecideRequest(id,status,kind){

// Un seul formulaire de modification du profil, y compris la photo.
editProfile=async function(){
 if(!user)return;const m=user.user_metadata||{};
 $('#modal').innerHTML=`<div class="overlay" onclick="closeModal()"><section class="sheet" onclick="event.stopPropagation()"><button class="close" onclick="closeModal()">×</button><h2>Modifier mon profil</h2><form id="bmprofileform"><label>Nom complet<input id="bmname" required value="${esc(m.name||'')}"></label><label>Numéro de téléphone<input id="bmphone" type="tel" value="${esc(m.phone||'')}"></label><label>Adresse e-mail<input id="bmemail" type="email" required value="${esc(user.email||'')}"></label><label>Nouveau mot de passe (laisser vide pour conserver)<input id="bmpassword" type="password" minlength="8" autocomplete="new-password"></label><label>Photo de profil<input id="bmavatar" type="file" accept="image/*"></label><label><input id="bmshowphone" type="checkbox" style="width:auto;display:inline" ${m.show_phone?'checked':''}> Afficher mon téléphone aux autres</label><button class="btn">Enregistrer les modifications</button></form><p class="muted">Un changement d’e-mail peut nécessiter une confirmation par e-mail.</p></section></div>`;
 $('#bmprofileform').onsubmit=async e=>{e.preventDefault();const btn=e.submitter;btn.disabled=true;try{
  const metadata={name:$('#bmname').value.trim(),phone:$('#bmphone').value.trim(),show_phone:$('#bmshowphone').checked};
  const result=await sb.auth.updateUser({data:metadata});if(result.error)throw result.error;user=result.data.user;
  const pass=$('#bmpassword').value;if(pass){const r=await sb.auth.updateUser({password:pass});if(r.error)throw r.error;user=r.data.user}
  const email=$('#bmemail').value.trim();if(email&&email!==user.email){const r=await sb.auth.updateUser({email});if(r.error)throw r.error}
  const file=$('#bmavatar').files?.[0];if(file){if(!file.type.startsWith('image/')||file.size>5*1024*1024)throw Error('Photo invalide (5 Mo maximum)');await uploadAvatar($('#bmavatar'))}
  await savePublicProfile();closeModal();render();toast('Profil enregistré. Confirmez le nouvel e-mail si demandé.');
 }catch(err){toast('Erreur : '+err.message)}finally{btn.disabled=false;btn.textContent='➤'}};
};

<script>
// V5 DEMONSTRATION : crédits virtuels uniquement, jamais de fonds réels.
function bmV5Error(e){toast('Erreur : '+(e?.message||e));console.error(e)}
async function bmV5Rpc(name,args={}){const {data,error}=await sb.rpc(name,args);if(error)throw error;return data}
function bmV5Money(n){return Number(n||0).toLocaleString('fr-FR')+' FCFA (démo)'}
function bmV5Form(title,fields,handler){const a=$('#app');a.innerHTML=`<div class="panel"><button class="textbtn" onclick="go('wallet')">← Retour</button><h2>${title}</h2><p class="muted">Mode démonstration : aucun argent réel n'est encaissé ni transféré.</p><form id="v5form">${fields}<button class="btn" type="submit">Confirmer</button></form></div>`;$('#v5form').onsubmit=async e=>{e.preventDefault();const btn=e.submitter;btn.disabled=true;try{await handler(new FormData(e.target));toast('Opération enregistrée (démo)');go('wallet')}catch(err){bmV5Error(err)}finally{btn.disabled=false}}}
walletPage=async function(a){if(!user){authPage(a,'Connectez-vous');return}a.innerHTML='<div class="panel"><h2>💰 Mon portefeuille (démo)</h2><div id="v5balance">Chargement…</div><div class="bm-v5-grid"><button class="btn ghost" onclick="bmV5WalletAction(\'topup\')">➕ Ajouter</button><button class="btn ghost" onclick="bmV5WalletAction(\'withdraw\')">↗ Retirer</button><button class="btn ghost" onclick="bmV5WalletAction(\'send\')">↗ Envoyer</button><button class="btn ghost" onclick="bmV5WalletAction(\'save\')">🔒 Épargner</button><button class="btn ghost" onclick="bmV5WalletAction(\'unsave\')">↩ Désépargner</button><button class="btn ghost" onclick="go(\'virtualcard\')">💳 Mes cartes</button></div><h3>Dernières opérations</h3><div id="v5ledger">Chargement…</div></div>';try{const r=await bmV5Rpc('bm_v5_my_wallet');$('#v5balance').innerHTML=`<h2>${bmV5Money(r.available_xof)}</h2><p>Épargne : ${bmV5Money(r.savings_xof)}</p>`;$('#v5ledger').innerHTML=(r.entries||[]).map(x=>`<div class="bm-v5-card">${esc(x.kind)} · ${bmV5Money(x.amount_xof)}<br><small>${esc(x.created_at||'')}</small></div>`).join('Aucune opération')}catch(e){$('#v5balance').textContent='Base V5 non activée : '+e.message}}
function bmV5WalletAction(kind){if(kind==='topup'){bmV6Topup();return;}if(kind==='withdraw'){bmV6Withdraw();return;}const labels={topup:'Demander une recharge',withdraw:'Retirer (démo)',send:'Envoyer (démo)',save:'Épargner (démo)',unsave:'Récupérer mon épargne'};bmV5Form(labels[kind],`<label>Montant FCFA<input name="amount" type="number" min="100" max="1000000" required></label>${kind==='send'?'<label>ID utilisateur destinataire (UUID)<input name="recipient" required></label>':''}`,async f=>{await bmV5Rpc('bm_v5_wallet_action',{p_kind:kind,p_amount:Number(f.get('amount')),p_recipient:f.get('recipient')||null})})}
virtualCardPage=async function(a){if(!user){authPage(a,'Connectez-vous');return}a.innerHTML='<div class="panel"><h2>💳 Mes cartes Bénin Market</h2><p class="muted">Cartes entièrement fictives : aucun réseau bancaire, achat réel ou paiement externe.</p><label>Style de carte<select id="bmCardTheme"><option value="black">Noire</option><option value="orange">Orange</option><option value="yellow">Jaune</option></select></label><button class="btn" onclick="bmV9RequestCard()">＋ Demander une carte</button><p class="muted">Maximum 5 cartes par utilisateur. Le transfert vers une carte se fait uniquement depuis le solde Bénin Market.</p><div id="v5cards">Chargement…</div></div>';try{const cards=(await bmV5Rpc('bm_v9_my_cards')).filter(c=>c.status!=='rejected'&&!c.is_hidden);$('#v5cards').innerHTML=(cards||[]).map((c,i)=>bmV9CardMarkup(c,i)).join('')||'<p>Aucune carte. Demandez votre première carte.</p>'}catch(e){$('#v5cards').textContent='Erreur : '+e.message}}
function bmV9CardMarkup(c,i){const theme=['black','orange','yellow'].includes(c.card_theme)?c.card_theme:'black';const num=c.demo_number||('5399  BM  '+String(c.display_code||c.id||'0000').replace(/[^0-9]/g,'').slice(-4).padStart(4,'0')+'  0000');return `<article class="bm9-card-wrap"><div class="bm9-card ${theme}"><div class="bm9-brand"><b>BENIN MARKET</b><span>DEMO CARD</span></div><div class="bm9-chip"></div><div class="bm9-number" id="bm9num${i}">•••• •••• •••• ${esc(String(num).replace(/\s/g,'').slice(-4))}</div><div class="bm9-bottom"><div><small>TITULAIRE</small><b>${esc(user?.email||'MEMBRE BENIN MARKET')}</b></div><div><small>EXPIRE</small><b>${esc(c.demo_expiry||'12/29')}</b></div><div><small>CVV</small><b id="bm9cvv${i}">•••</b></div></div><div class="bm9-watermark">BM</div></div><div class="bm9-card-meta"><b>${esc(c.display_code||'Carte virtuelle')} · ${esc(theme.toUpperCase())}</b><span class="bm-v5-pill">${esc(c.status)}</span><h3>${bmV5Money(c.balance_xof)}</h3><div class="bm9-actions"><button class="btn ghost" onclick="bmV9ToggleCard('${c.id}',${i},'${esc(String(num).replace(/'/g,''))}','${esc(c.demo_cvv||'123')}')">👁 Voir / cacher</button>${c.status==='approved'?`<button class="btn ghost" onclick="bmV5FundCard('${c.id}')">＋ Depuis mon solde</button>`:''}</div></div></article>`}
function bmV9ToggleCard(id,i,num,cvv){const n=document.getElementById('bm9num'+i),v=document.getElementById('bm9cvv'+i);if(!n||!v)return;const hidden=n.textContent.includes('••••');n.textContent=hidden?(num.match(/.{1,4}/g)||[num]).join(' '):'•••• •••• •••• '+num.slice(-4);v.textContent=hidden?cvv:'•••'}
async function bmV9RequestCard(){const theme=document.getElementById('bmCardTheme')?.value||'black';try{await bmV5Rpc('bm_v9_request_card',{p_theme:theme});toast('Demande de carte enregistrée (démo)');go('virtualcard')}catch(e){bmV5Error(e)}}
async function bmV5RequestCard(){try{await bmV5Rpc('bm_v5_request_card');toast('Carte demandée');go('virtualcard')}catch(e){bmV5Error(e)}}
function bmV5FundCard(id){const amount=Number(prompt('Montant à transférer de mon solde vers ma carte (FCFA démo)'));if(!Number.isInteger(amount)||amount<100)return;bmV5Rpc('bm_v5_fund_card',{p_card:id,p_amount:amount}).then(()=>{toast('Carte créditée (démo)');go('virtualcard')}).catch(bmV5Error)}
function bmV5CardTopup(id){const amount=Number(prompt('Montant de la demande de recharge directe (FCFA démo)'));if(!Number.isInteger(amount)||amount<100)return;bmV5Rpc('bm_v5_card_topup_request',{p_card:id,p_amount:amount}).then(()=>toast('Demande transmise à l’administration (démo)')).catch(bmV5Error)}
datingPage=function(a){if(!user){authPage(a,'Connectez-vous');return}a.innerHTML=`<div class="panel"><h2>💞 Rencontres</h2><p class="muted">Réservé aux adultes de 18 ans et plus. Les profils sont privés jusqu'à vérification.</p><form id="v5dating"><label>Nom<input name="last_name" required maxlength="70"></label><label>Prénom<input name="first_name" required maxlength="70"></label><label>Âge<input name="age" type="number" min="18" max="100" required></label><label>Sexe<select name="gender"><option value="woman">Femme</option><option value="man">Homme</option><option value="other">Autre</option></select></label><label>Je recherche<select name="looking_for"><option value="woman">Une femme</option><option value="man">Un homme</option><option value="any">Sans préférence</option></select></label><label>Présentation<textarea name="bio" maxlength="1000"></textarea></label><button class="btn">Demander la vérification du profil</button></form><p class="muted">La discussion entre membres vérifiés nécessite un module de mise en relation et de consentement supplémentaire.</p></div>`;$('#v5dating').onsubmit=async e=>{e.preventDefault();const f=new FormData(e.target);try{await sb.from('bm_v5_dating_profiles').upsert({user_id:user.id,last_name:f.get('last_name'),first_name:f.get('first_name'),age:Number(f.get('age')),gender:f.get('gender'),looking_for:f.get('looking_for'),bio:f.get('bio'),status:'pending'},{onConflict:'user_id'}).then(({error})=>{if(error)throw error});toast('Profil envoyé pour vérification')}catch(err){bmV5Error(err)}}}
jobsPage=async function(a){a.innerHTML=`<div class="panel"><h2>💼 Offres d'emploi</h2><div id="v5jobs">Chargement…</div>${user?`<h3>Publier une offre</h3><form id="v5jobform"><label>Poste<input name="title" required maxlength="140"></label><label>Commune<input name="city" required maxlength="100"></label><label>Description<textarea name="description" required maxlength="5000"></textarea></label><button class="btn">Soumettre à la modération</button></form>`:'<p>Connectez-vous pour postuler ou publier.</p>'}</div>`;if(user){$('#v5jobform').onsubmit=async e=>{e.preventDefault();const f=new FormData(e.target);const {error}=await sb.from('bm_v5_jobs').insert({employer_id:user.id,title:f.get('title'),city:f.get('city'),description:f.get('description')});if(error)return bmV5Error(error);toast('Offre soumise à validation');go('jobs')}}const {data,error}=await sb.from('bm_v5_jobs').select('id,title,city,description,created_at').eq('status','approved').order('created_at',{ascending:false}).limit(60);$('#v5jobs').innerHTML=error?'Offres indisponibles : '+esc(error.message):(data||[]).map(j=>`<div class="bm-v5-card"><h3>${esc(j.title)}</h3><p>${esc(j.city)} · ${esc(j.description)}</p>${user?`<button class="btn ghost" onclick="bmV5ApplyJob('${j.id}')">Postuler</button>`:''}</div>`).join('Aucune offre validée pour le moment')}
async function bmV5ApplyJob(id){const note=prompt('Votre présentation pour cette candidature :');if(!note)return;const {error}=await sb.from('bm_v5_job_applications').insert({job_id:id,applicant_id:user.id,note});toast(error?'Erreur : '+error.message:'Candidature envoyée')}
const bmV5OldOpenConversation=openConversation;
openConversation=async function(id,refreshList=true){await bmV5OldOpenConversation(id,refreshList);const f=$('#sendmessageform');if(!f)return;f.querySelectorAll('.bm-filters,button.textbtn').forEach(el=>el.remove());const extra=f.querySelectorAll('input[type=file]');extra.forEach(el=>{if(el.id!=='bmchatfile')el.closest('label')?.remove()});const btn=$('#sendmessagebtn');if(btn){btn.textContent='➤';btn.setAttribute('aria-label','Envoyer')}const label=$('#bmfilelabel');if(label)label.textContent='';};
const bmV5OldOpenAd=openAd;
openAd=function(id){bmV5OldOpenAd(id);const a=ads.find(x=>String(x.id)===String(id));if(!a||!user||String(a.seller_id)!==String(user.id))return;const sheet=$('#modal .sheet');if(sheet){const b=document.createElement('button');b.className='textbtn';b.textContent='🚀 Booster';b.style.fontSize='12px';b.onclick=()=>{closeModal();go('boost')};sheet.appendChild(b)}};
async function bmV5Admin(){if(!user)return;const host=$('#app');const panel=document.createElement('div');panel.className='panel';panel.innerHTML='<h2>🛡️ Gestion V5 — démo</h2><p class="muted">Validation des cartes, crédits fictifs, emplois, rencontres et suivi de livraison. Aucune opération bancaire réelle.</p><div id="v5admin">Chargement…</div>';host.prepend(panel);try{const data=await bmV5Rpc('bm_v5_admin_overview');$('#v5admin').innerHTML=`<h3>Cartes en attente</h3>${(data.cards||[]).map(c=>`<div class="bm-v5-card">${esc(c.user_id)} · ${esc(c.display_code)} <button class="btn ghost" onclick="bmV5AdminAction('card','${c.id}','approved')">Valider</button><button class="textbtn" onclick="bmV5AdminAction('card','${c.id}','rejected')">Refuser</button></div>`).join('Aucune demande')}<h3>Offres d'emploi</h3>${(data.jobs||[]).map(j=>`<div class="bm-v5-card">${esc(j.title)} <button class="btn ghost" onclick="bmV5AdminAction('job','${j.id}','approved')">Valider</button><button class="textbtn" onclick="bmV5AdminAction('job','${j.id}','rejected')">Refuser</button></div>`).join('Aucune offre')}<h3>Rencontres à vérifier</h3>${(data.dating||[]).map(d=>`<div class="bm-v5-card">${esc(d.first_name)} ${esc(d.last_name)} · ${d.age} ans <button class="btn ghost" onclick="bmV5AdminAction('dating','${d.user_id}','approved')">Valider</button><button class="textbtn" onclick="bmV5AdminAction('dating','${d.user_id}','rejected')">Refuser</button></div>`).join('Aucun profil')}<h3>Recharges de carte</h3>${(data.topups||[]).map(t=>`<div class="bm-v5-card">${esc(t.user_id)} · ${bmV5Money(t.amount_xof)} <button class="btn ghost" onclick="bmV5AdminAction('topup','${t.id}','approved')">Valider (démo)</button><button class="textbtn" onclick="bmV5AdminAction('topup','${t.id}','rejected')">Refuser</button></div>`).join('Aucune demande')}<h3>Créditer un compte ou une carte (démo)</h3><button class="btn ghost" onclick="bmV5AdminCredit()">Ajouter un crédit fictif</button>`}catch(e){$('#v5admin').textContent='Module V5 indisponible : '+e.message}}
async function bmV5AdminAction(kind,id,status){try{await bmV5Rpc('bm_v5_admin_decide',{p_kind:kind,p_id:id,p_status:status});toast('Décision enregistrée');bmV5Admin()}catch(e){bmV5Error(e)}}
async function bmV5AdminCredit(){const uid=prompt('UUID du compte utilisateur à créditer :');if(!uid)return;const card=prompt('UUID de carte (laisser vide pour le solde principal) :')||null;const amount=Number(prompt('Montant fictif FCFA :'));if(!Number.isInteger(amount)||amount<100||amount>1000000)return toast('Montant invalide');const reason=prompt('Motif administratif obligatoire :');if(!reason||reason.trim().length<5)return;try{await bmV5Rpc('bm_v5_admin_credit',{p_user:uid,p_card:card,p_amount:amount,p_reason:reason});toast('Crédit fictif enregistré')}catch(e){bmV5Error(e)}}
// Insérer l'espace V5 dans le tableau admin existant, après son rendu.
const bmV5AdminObserver=new MutationObserver(()=>{if(page==='admin'&&$('#app')&&$('#app').textContent.includes('Gestion de la plateforme')&&!$('#v5admin')){bmV5Admin()}});
bmV5AdminObserver.observe(document.getElementById('app'),{childList:true,subtree:false});
</script>

<script>
/* Bénin Market V6 : fonctions supplémentaires, fonds fictifs uniquement. */
CATS.push(['Emploi','💼']);
const bmV6OldHome=home;
home=function(a){bmV6OldHome(a);const cats=a.querySelector('.catgrid');if(cats){const e=cats.querySelector('button:last-child');if(e)e.onclick=()=>go('delivery');const j=[...cats.querySelectorAll('button')].find(x=>x.textContent.includes('Emploi'));if(j)j.onclick=()=>go('jobs')}};
const bmV6OldOpenConversation=openConversation;
openConversation=async function(id,refreshList=true){await bmV6OldOpenConversation(id,refreshList);bmV6Composer()};
function bmV6Composer(){const f=$('#sendmessageform'),bar=f?.querySelector('.bm-composer');if(!bar||bar.dataset.v6)return;bar.dataset.v6='1';const attach=bar.querySelector('.bm-attach');if(attach){attach.style.display='none';}const tools=document.createElement('div');tools.className='bm-v6-tools';tools.innerHTML='<button type="button" class="bm-v6-icon" title="Ajouter" onclick="document.getElementById(\'bmchatfile\').click()">＋</button><button type="button" class="bm-v6-icon" title="Photo / vidéo" onclick="document.getElementById(\'bmchatfile\').click()">▣</button><button type="button" class="bm-v6-icon" id="bmV6Voice" title="Enregistrer un message vocal" onclick="bmV6Record()">🎙</button><button type="button" class="bm-v6-icon" title="Stickers" onclick="bmV6Stickers()">☺</button>';bar.insertBefore(tools,bar.firstChild);const old=bar.querySelector('#sendmessagebtn');if(old)old.textContent='➤';const holder=document.createElement('div');holder.id='bmV6Stickers';holder.hidden=true;holder.className='bm-v6-stickers';holder.innerHTML=['❤️','👍','😂','😍','🎉','🙏','😎','👋','💚','🥰','👏','🔥'].map(x=>`<button type="button" onclick="bmV6SendSticker('${x}')">${x}</button>`).join('');f.after(holder)}
function bmV6Stickers(){const h=$('#bmV6Stickers');if(h)h.hidden=!h.hidden}
async function bmV6SendSticker(emoji){const input=$('#messagecontent'),form=$('#sendmessageform');if(!input||!form)return;input.value=emoji;$('#bmV6Stickers').hidden=true;form.requestSubmit()}
let bmV6Recorder=null,bmV6Chunks=[];
async function bmV6Record(){const btn=$('#bmV6Voice');if(bmV6Recorder?.state==='recording'){bmV6Recorder.stop();btn.textContent='🎙';return}try{if(!navigator.mediaDevices?.getUserMedia||!window.MediaRecorder)throw Error('Enregistrement indisponible sur cet appareil');const stream=await navigator.mediaDevices.getUserMedia({audio:true});const preferred=['audio/webm;codecs=opus','audio/mp4','audio/webm'].find(x=>MediaRecorder.isTypeSupported(x));bmV6Chunks=[];bmV6Recorder=new MediaRecorder(stream,preferred?{mimeType:preferred}:undefined);bmV6Recorder.ondataavailable=e=>{if(e.data.size)bmV6Chunks.push(e.data)};bmV6Recorder.onstop=async()=>{stream.getTracks().forEach(t=>t.stop());const type=bmV6Recorder.mimeType.split(';')[0];const blob=new Blob(bmV6Chunks,{type});if(blob.size>8*1024*1024)return toast('Message vocal trop long (8 Mo max)');try{const {data:msg,error}=await sb.from('messages').insert({sender_id:user.id,recipient_id:activeChat,content:'🎙 Message vocal'}).select('id').single();if(error)throw error;const path=`${user.id}/${msg.id}/${crypto.randomUUID()}-audio`;const up=await sb.storage.from('bm-chat-private').upload(path,blob,{contentType:type});if(up.error)throw up.error;const ins=await sb.from('bm_chat_attachments').insert({message_id:String(msg.id),sender_id:user.id,recipient_id:activeChat,storage_path:path,mime_type:type,size_bytes:blob.size});if(ins.error)throw ins.error;await refreshChat()}catch(e){toast('Audio non envoyé : '+e.message)}};bmV6Recorder.start();btn.textContent='⏹';toast('Enregistrement en cours. Appuie à nouveau pour envoyer.')}catch(e){toast(e.message)}}
const bmV6OldRefresh=refreshChat;
refreshChat=async function(){await bmV6OldRefresh();const log=$('#chatmessages');if(!log)return;const audios=log.querySelectorAll('a[href],video,source');/* Les pièces jointes audio sont rendues par le complément ci-dessous. */try{const {data,error}=await sb.from('messages').select('id,sender_id,recipient_id,created_at').or(`and(sender_id.eq.${user.id},recipient_id.eq.${activeChat}),and(sender_id.eq.${activeChat},recipient_id.eq.${user.id})`).order('created_at',{ascending:false}).limit(80);if(error||!data?.length)return;const ids=data.map(x=>String(x.id));const r=await sb.from('bm_chat_attachments').select('message_id,storage_path,mime_type').in('message_id',ids).in('mime_type',['audio/webm','audio/mp4']);if(r.error||!r.data?.length)return;let holder=log.querySelector('#bmV6AudioMessages');if(!holder){holder=document.createElement('div');holder.id='bmV6AudioMessages';log.appendChild(holder)}holder.innerHTML='';for(const x of r.data){const signed=await sb.storage.from('bm-chat-private').createSignedUrl(x.storage_path,600);if(signed.error)continue;const box=document.createElement('div');box.className='bm-v6-item';box.textContent='🎙 Message vocal ';const player=document.createElement('audio');player.controls=true;player.preload='none';player.src=signed.data.signedUrl;box.appendChild(player);holder.appendChild(box)}}catch(e){console.warn('audio',e)}};
const bmV6OldWallet=walletPage;

async function bmV6ReviewTopup(id,status){try{const {error}=await sb.rpc('bm_v6_admin_review_topup',{p_id:id,p_status:status});if(error)throw error;toast('Décision enregistrée (démo)');bmV5Admin()}catch(e){toast(e.message)}}

const bmV6OldJobs=jobsPage;
jobsPage=async function(a){a.innerHTML='<div class="panel"><h2>💼 Emploi</h2><div class="row"><button class="btn ghost" onclick="bmV6JobsTab(\'offers\')">Offres d’emploi</button><button class="btn ghost" onclick="bmV6JobsTab(\'seeking\')">Demandes d’emploi</button></div><div id="bmV6JobsBody"></div></div>';await bmV6JobsTab('offers')};
async function bmV6JobsTab(tab){const host=$('#bmV6JobsBody');if(!host)return;if(tab==='offers'){const temp=document.createElement('div');host.innerHTML='';host.appendChild(temp);await bmV6OldJobs(temp);return}host.innerHTML=`<h3>Personnes qui recherchent un emploi</h3><div id="bmV6SeekList">Chargement…</div>${user?'<h3>Demander un emploi</h3><form id="bmV6SeekForm"><label>Poste recherché<input name="title" required maxlength="140"></label><label>Commune<input name="city" required maxlength="100"></label><label>Présentation<textarea name="description" maxlength="3000" required></textarea></label><button class="btn">Envoyer pour validation</button></form>':'<p>Connectez-vous pour publier.</p>'}`;if(user)$('#bmV6SeekForm').onsubmit=async e=>{e.preventDefault();const f=new FormData(e.target);const {error}=await sb.from('bm_v6_job_seeking').insert({user_id:user.id,title:f.get('title'),city:f.get('city'),description:f.get('description')});if(error)return toast(error.message);toast('Demande envoyée à la modération');bmV6JobsTab('seeking')};const {data,error}=await sb.from('bm_v6_job_seeking').select('id,user_id,title,city,description').eq('status','approved').order('created_at',{ascending:false}).limit(80);$('#bmV6SeekList').innerHTML=error?esc(error.message):(data||[]).map(x=>`<div class="bm-v6-item"><b>${esc(x.title)}</b> · ${esc(x.city)}<p>${esc(x.description)}</p>${user?`<button class="btn ghost" onclick="go('messages');setTimeout(()=>openConversation('${x.user_id}'),500)">Contacter</button>`:''}</div>`).join('Aucune demande approuvée')}
const bmV6OldDating=datingPage;

if(bmV6OldOther)otherPage=function(a){bmV6OldOther(a);const btn=document.createElement('button');btn.className='menuitem';btn.innerHTML='<span>🚚</span> Coursier / Livraison <span class="arrow">›</span>';btn.onclick=()=>go('delivery');a.prepend(btn)};

// V6.2: les demandes administratives V6 restent visibles si la vue V5 est indisponible.
(function(){
 const previous=window.bmV5Admin;
 window.bmV5Admin=async function(){
   try { await previous(); } catch(e) { console.error('Administration V5',e); }
   const app=document.getElementById('app');
   if(!app || typeof user==='undefined' || !user) return;
   let container=document.getElementById('bmV62Independent');
   if(!container){container=document.createElement('section');container.id='bmV62Independent';container.className='panel';app.prepend(container);}
   container.innerHTML='<h3>📥 Demandes financières (démo)</h3><div id="bmV62Requests">Chargement…</div>';
   const target=document.getElementById('bmV62Requests');
   const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
   for(const [title,fn,action] of [['Recharges Mobile Money','bm_v6_admin_topups','bmV6ReviewTopup'],['Retraits Mobile Money','bm_v6_admin_withdrawals','bmV6ReviewWithdrawal']]){
     const h=document.createElement('div');h.innerHTML='<h4>'+title+'</h4>';
     target.appendChild(h);
     try{
       const {data,error}=await sb.rpc(fn);if(error)throw error;
       const items=Array.isArray(data)?data:[];
       if(!items.length){h.insertAdjacentHTML('beforeend','<p class="muted">Aucune demande enregistrée.</p>');continue;}
       items.forEach(x=>{
         const card=document.createElement('div');card.className='bm-v5-card';
         card.innerHTML='<strong>'+esc(x.amount_xof)+' FCFA (démo)</strong><p>Compte : '+esc(x.user_id)+'</p><p>État : '+esc(x.status)+'</p>';
         if(x.status==='pending'){
           for(const [label,status] of [['Approuver','approved'],['Refuser','rejected']]){
             const b=document.createElement('button');b.className='btn ghost';b.textContent=label;
             b.onclick=async()=>{if(!confirm(label+' cette demande fictive ?'))return; b.disabled=true;try{const r=await sb.rpc(fn==='bm_v6_admin_topups'?'bm_v6_admin_review_topup':'bm_v6_admin_review_withdrawal',{p_id:x.id,p_status:status});if(r.error)throw r.error;await window.bmV5Admin();}catch(e){alert(e.message)}finally{b.disabled=false}};
             card.appendChild(b);
           }
         }
         h.appendChild(card);
       });
     }catch(e){const msg=document.createElement('p');msg.textContent='Module indisponible : '+e.message;h.appendChild(msg);}
   }
 };
})();
</script>

<script>
(function(){
 const cats=[['wallet','💰 Recharges portefeuille'],['card','💳 Cartes et recharges'],['jobs','💼 Demandes d’emploi'],['general','📋 Demandes générales'],['history','🗂️ Historique']];
 let tab='wallet', busy=false;
 const $=id=>document.getElementById(id);
 const esc=v=>String(v??'—').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
 const dt=v=>v?new Date(v).toLocaleString('fr-FR'):'—';
 function ensure(){let el=$('bmV8Admin');if(!el){el=document.createElement('section');el.id='bmV8Admin';const app=$('app');if(!app)return null;app.prepend(el)}return el}
 function shell(){const el=ensure();if(!el)return;el.innerHTML='<div style="display:flex;justify-content:space-between;gap:10px;align-items:center;flex-wrap:wrap"><div><h2 style="margin:0">🛡️ Administration — V9</h2><p class="v8-muted">Demandes récentes, décisions et historique. Les crédits restent des opérations fictives.</p></div><button class="btn ghost" id="v8refresh">↻ Actualiser</button></div><div class="v8-tabs" id="v8tabs"></div><div id="v8body">Chargement…</div>';el.querySelector('#v8refresh').onclick=load;drawTabs();}
 function drawTabs(){const t=$('v8tabs');if(!t)return;t.innerHTML=cats.map(([id,label])=>`<button data-tab="${id}" class="${id===tab?'active':''}">${label}</button>`).join('');t.querySelectorAll('button').forEach(b=>b.onclick=()=>{tab=b.dataset.tab;drawTabs();load()})}
 async function rpc(name,args){const r=await sb.rpc(name,args||{});if(r.error)throw r.error;return r.data}
 async function load(){if(busy)return;busy=true;const body=$('v8body');if(!body){busy=false;return}body.textContent='Chargement…';try{
  let rows=[];
  if(tab==='wallet'){
   const a=await rpc('bm_v6_admin_topups'); rows=(Array.isArray(a)?a:[]).map(x=>({...x,_type:'wallet',_label:'Recharge portefeuille'}));
   const b=await rpc('bm_admin_requests',{p_kind:'wallet'});rows=rows.concat((Array.isArray(b)?b:[]).map(x=>({...x,_type:'service_wallet',_label:'Demande financière générale'})));
  }else if(tab==='card'){
   const a=await rpc('bm_v5_admin_overview');rows=(a?.cards||[]).map(x=>({...x,_type:'card',_label:'Carte virtuelle'})).concat((a?.topups||[]).map(x=>({...x,_type:'card_topup',_label:'Recharge de carte'})));
   const b=await rpc('bm_admin_requests',{p_kind:'card'});rows=rows.concat((Array.isArray(b)?b:[]).map(x=>({...x,_type:'service',_label:'Demande de carte'})));
  }else if(tab==='jobs'){
   const r=await sb.from('bm_v6_job_seeking').select('id,user_id,title,city,description,status,created_at').order('created_at',{ascending:false}).limit(100);if(r.error)throw r.error;rows=(r.data||[]).map(x=>({...x,_type:'job_v6',_label:'Recherche d’emploi'}));
   const b=await rpc('bm_admin_requests',{p_kind:'job'});rows=rows.concat((Array.isArray(b)?b:[]).map(x=>({...x,_type:'service',_label:'Demande emploi générale'})));
  }else if(tab==='general'){
   for(const k of ['boost','dating']){const a=await rpc('bm_admin_requests',{p_kind:k});rows=rows.concat((Array.isArray(a)?a:[]).map(x=>({...x,_type:'service',_label:k==='boost'?'Boost':'Rencontre'})))}
   const m=await rpc('bm_admin_money_requests');rows=rows.concat((Array.isArray(m)?m:[]).map(x=>({...x,_type:'money',_label:'Demande financière'})));
  }else{
   const sources=[['wallet',async()=>await rpc('bm_v6_admin_topups')],['card',async()=>{const a=await rpc('bm_v5_admin_overview');return [...(a?.cards||[]),...(a?.topups||[])]}],['job',async()=>{const a=await sb.from('bm_v6_job_seeking').select('*').order('created_at',{ascending:false}).limit(100);if(a.error)throw a.error;return a.data||[]}]];
   for(const [kind,fn] of sources){const a=await fn();rows=rows.concat(a.map(x=>({...x,_type:kind==='wallet'?'wallet':kind==='job'?'job_v6':(x.card_id?'card_topup':'card'),_label:kind==='wallet'?'Recharge portefeuille':kind==='job'?'Recherche emploi':(x.card_id?'Recharge carte':'Carte virtuelle')})))}
   for(const k of ['job','dating','boost','card','wallet']){const a=await rpc('bm_admin_requests',{p_kind:k});rows=rows.concat((Array.isArray(a)?a:[]).map(x=>({...x,_type:'service',_label:'Demande '+k})))}
   const m=await rpc('bm_admin_money_requests');rows=rows.concat((Array.isArray(m)?m:[]).map(x=>({...x,_type:'money',_label:'Demande financière'})));
  }
  rows.sort((a,b)=>new Date(b.created_at||0)-new Date(a.created_at||0));
  if(tab!=='history')rows=rows.filter(x=>String(x.status||'').toLowerCase()==='pending');else rows=rows.filter(x=>String(x.status||'').toLowerCase()!=='pending');
  if(!rows.length){body.innerHTML='<p>Aucune demande dans cette rubrique pour ce filtre.</p><p class="v8-muted">Si tu sais qu’une demande existe, vérifie le message d’erreur ci-dessous après actualisation. Les demandes sont conservées dans Supabase.</p>';return}
  body.innerHTML=rows.map((x,i)=>`<article class="v8-card"><b>${esc(x._label)} — ${esc(x.title||x.kind||x.display_code||'Demande utilisateur')}</b><p>${esc(x.details||x.description||x.city||'')}</p><div class="v8-muted">Utilisateur : ${esc(x.user_id)}<br>Montant : ${x.amount_xof!=null?esc(x.amount_xof)+' FCFA':'—'}<br>Statut : ${esc(x.status)}<br>Créée le : ${esc(dt(x.created_at))}<br>Référence : ${esc(x.id)}</div><div class="v8-actions" data-row="${i}">${String(x.status).toLowerCase()==='pending'?'<button class="btn" data-action="approved">Approuver</button><button class="btn danger" data-action="rejected">Refuser</button>':''}</div></article>`).join('');
  body.querySelectorAll('[data-row]').forEach((box,i)=>box.querySelectorAll('button').forEach(btn=>btn.onclick=()=>decide(rows[i],btn.dataset.action,btn)));
 }catch(e){body.innerHTML='<div class="v8-card"><b>Erreur de chargement Supabase</b><p>'+esc(e.message||e)+'</p><p class="v8-muted">Le panneau n’affiche pas une liste vide en cas d’erreur : le message exact est visible ici.</p></div>'}finally{busy=false}}
 async function decide(x,status,btn){if(!confirm((status==='approved'?'Approuver':'Refuser')+' cette demande ?'))return;btn.disabled=true;try{
  if(x._type==='wallet')await rpc('bm_v6_admin_review_topup',{p_id:x.id,p_status:status});
  else if(x._type==='card_topup')await rpc('bm_admin_review_card_topup',{p_request_id:x.id,p_decision:status});
  else if(x._type==='card')await rpc('bm_admin_review_card',{p_card_id:x.id,p_decision:status});
  else if(x._type==='job_v6')await rpc('bm_v6_admin_review_job_seeking',{p_id:x.id,p_status:status});
  else if(x._type==='service')await rpc('bm_admin_decide_request',{p_id:x.id,p_status:status,p_reason:'Décision depuis administration V8'});
  else if(x._type==='money')await rpc('bm_admin_review_money_request',{p_id:x.id,p_decision:status});
  else if(x._type==='service_wallet')throw new Error('Cette demande générale est en lecture seule : elle ne doit pas déclencher un crédit financier.');
  if(typeof toast==='function')toast('Décision enregistrée');await load();
 }catch(e){alert('Décision non enregistrée : '+(e.message||e));btn.disabled=false}}
 async function show(){try{const {data,error}=await sb.rpc('bm_is_admin');if(error)throw error;if(data!==true)return;shell();await load()}catch(e){const el=ensure();if(el)el.innerHTML='<h3>Administration inaccessible</h3><p>'+esc(e.message||e)+'</p>'}}
 const app=$('app');if(app){new MutationObserver(()=>{if(typeof page!=='undefined'&&page==='admin'&&!$('bmV8Admin'))show()}).observe(app,{childList:true,subtree:true})}
 const prev=window.bmAdminPage;window.bmAdminPage=async function(){if(typeof prev==='function')await prev();await show()};
 window.bmV8RefreshRequests=load;
})();
</script>

<script>
(function(){
"use strict";
const bm10Esc=v=>String(v??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const bm10Money=v=>Number(v||0).toLocaleString("fr-FR")+" FCFA";
const bm10Rpc=async(name,args={})=>{const r=await sb.rpc(name,args);if(r.error)throw r.error;return r.data};
const bm10Toast=m=>typeof toast==="function"?toast(m):alert(m);
const bm10NeedUser=()=>{if(!user){bm10Toast("Connectez-vous pour continuer.");go("profile");return false}return true};

/* Profil : garder les options principales en premier, regrouper les rubriques complémentaires ensuite. */
const bm10OldProfile=profilePage;
profilePage=function(a){
 bm10OldProfile(a);
 const panels=[...a.querySelectorAll(".panel")];
 const menuPanel=panels.find(p=>p.querySelector(".menuitem"));
 if(!menuPanel)return;
 const items=[...menuPanel.querySelectorAll(":scope > .menuitem")];
 if(!items.length)return;
 const primary=["Mes annonces","Mes achats","Portefeuille","Rencontres","Carte virtuelle","Paiement sécurisé","Mes messages","Messages","Notifications"];
 const isPrimary=el=>primary.some(t=>el.textContent.toLowerCase().includes(t.toLowerCase()));
 const main=document.createElement("div");main.className="bm10-profile-group";
 const other=document.createElement("details");other.className="panel bm10-profile-group";other.open=false;
 other.innerHTML="<summary style='font-weight:900;cursor:pointer'>Autres options et rubriques complémentaires</summary><div id='bm10other'></div>";
 const otherBody=other.querySelector("#bm10other");
 items.forEach(el=>(isPrimary(el)?main:otherBody).appendChild(el));
 if(main.children.length)menuPanel.insertBefore(main,menuPanel.firstChild);
 if(otherBody.children.length)menuPanel.appendChild(other);
};

/* Notifications persistantes Supabase, avec lecture et suivi. */
notificationsPage=async function(a){
 if(!bm10NeedUser())return;
 a.innerHTML=`<div class="section-head"><h2>Notifications</h2><button class="textbtn" onclick="bm10ReadAll()">Tout marquer comme lu</button></div><div class="panel" id="bm10notifications">Chargement…</div>`;
 try{
  const {data,error}=await sb.from("bm_v10_notifications").select("*").eq("user_id",user.id).order("created_at",{ascending:false}).limit(100);
  if(error)throw error;
  const rows=data||[];
  $("#bm10notifications").innerHTML=rows.map(n=>`<div class="notice" style="opacity:${n.read_at?'.65':'1'}"><div class="noticeicon">${bm10Esc(n.icon||"♧")}</div><div style="flex:1"><b>${bm10Esc(n.title)}</b><p class="muted">${bm10Esc(n.body||"")}</p><small class="muted">${new Date(n.created_at).toLocaleString("fr-FR")}</small></div>${n.read_at?'<span class="badge">Lu</span>':`<button class="textbtn" onclick="bm10Read('${bm10Esc(n.id)}')">Marquer lu</button>`}</div>`).join("")||'<div class="empty">Aucune notification pour le moment.</div>';
 }catch(e){$("#bm10notifications").innerHTML=`<div class="empty">Notifications indisponibles : ${bm10Esc(e.message)}. Exécutez le SQL V10.</div>`}
};
window.bm10Read=async id=>{try{await sb.from("bm_v10_notifications").update({read_at:new Date().toISOString()}).eq("id",id).eq("user_id",user.id);notificationsPage($("#app"))}catch(e){bm10Toast(e.message)}};
window.bm10ReadAll=async()=>{try{const {error}=await sb.from("bm_v10_notifications").update({read_at:new Date().toISOString()}).eq("user_id",user.id).is("read_at",null);if(error)throw error;notificationsPage($("#app"))}catch(e){bm10Toast(e.message)}};

/* Portefeuille : les crédits proviennent d'une recharge validée côté serveur. */
walletPage=async function(a){
 if(!bm10NeedUser())return;
 a.innerHTML=`<div class="section-head"><h2>💰 Mon portefeuille</h2><button class="textbtn" onclick="walletPage($('#app'))">Actualiser ↻</button></div><div class="panel"><div class="muted">Solde disponible</div><div class="bm10-balance" id="bm10walletbalance">Chargement…</div><p class="muted">Les transferts et paiements sont exécutés atomiquement par Supabase. Une demande de recharge n'ajoute pas d'argent avant validation.</p></div><div class="panel"><h3>Demander une recharge</h3><form id="bm10deposit"><label>Montant (FCFA)<input id="bm10depositamount" type="number" min="500" max="10000000" step="1" required></label><label>Canal<select id="bm10depositmethod"><option>MTN Mobile Money</option><option>Moov Money</option><option>Celtiis Cash</option><option>Virement bancaire</option></select></label><label>Référence ou numéro de paiement<input id="bm10depositref" maxlength="100" required></label><button class="btn">Envoyer la demande</button></form></div><div class="panel"><h3>Historique récent</h3><div id="bm10walletledger">Chargement…</div></div>`;
 try{
  const b=await bm10Rpc("bm_v10_wallet_balance");$("#bm10walletbalance").textContent=bm10Money(b);
  const {data,error}=await sb.from("bm_v10_wallet_transactions").select("id,kind,amount_xof,status,description,created_at").eq("user_id",user.id).order("created_at",{ascending:false}).limit(30);if(error)throw error;
  $("#bm10walletledger").innerHTML=(data||[]).map(x=>`<div class="notice"><div class="noticeicon">${x.kind==="credit"?"＋":"−"}</div><div><b>${bm10Money(x.amount_xof)}</b><p class="muted">${bm10Esc(x.description||x.kind)} · ${bm10Esc(x.status)}</p><small>${new Date(x.created_at).toLocaleString("fr-FR")}</small></div></div>`).join("")||'<p class="muted">Aucune opération.</p>';
 }catch(e){$("#bm10walletbalance").textContent="Indisponible";$("#bm10walletledger").textContent="Erreur : "+e.message}
 $("#bm10deposit").onsubmit=async e=>{e.preventDefault();const amount=Number($("#bm10depositamount").value);try{const {error}=await sb.from("bm_v10_deposit_requests").insert({user_id:user.id,amount_xof:amount,method:$("#bm10depositmethod").value,payment_reference:$("#bm10depositref").value.trim()});if(error)throw error;bm10Toast("Demande envoyée. Le solde sera crédité après vérification.");walletPage($("#app"))}catch(err){bm10Toast("Recharge impossible : "+err.message)}};
};

/* Carte : crédit par transfert interne portefeuille -> carte, sans prestataire inventé. */
virtualCardPage=async function(a){
 if(!bm10NeedUser())return;
 a.innerHTML=`<div class="section-head"><h2>💳 Ma carte virtuelle</h2></div><div class="panel"><div class="muted">Solde de la carte</div><div class="bm10-balance" id="bm10cardbalance">Chargement…</div><p class="muted">Carte de paiement interne à Bénin Market. Elle ne constitue pas une carte Visa/Mastercard émise par un établissement financier.</p><form id="bm10cardcreate"><label>Nom sur la carte<input id="bm10cardname" maxlength="70" required></label><button class="btn ghost">Créer / activer ma carte interne</button></form></div><div class="panel"><h3>Créditer sa carte</h3><p class="muted">Le montant est transféré de votre portefeuille vers votre carte.</p><form id="bm10cardtransfer"><label>Montant (FCFA)<input id="bm10cardamount" type="number" min="100" step="1" required></label><button class="btn">Transférer depuis mon portefeuille</button></form><p id="bm10cardstatus" class="muted"></p></div>`;
 try{const b=await bm10Rpc("bm_v10_card_balance");$("#bm10cardbalance").textContent=bm10Money(b)}catch(e){$("#bm10cardbalance").textContent="Indisponible : "+e.message}
 $("#bm10cardcreate").onsubmit=async e=>{e.preventDefault();try{await bm10Rpc("bm_v10_ensure_card",{p_name:$("#bm10cardname").value.trim()});bm10Toast("Carte interne activée.");virtualCardPage($("#app"))}catch(err){bm10Toast(err.message)}};
 $("#bm10cardtransfer").onsubmit=async e=>{e.preventDefault();try{const amount=Number($("#bm10cardamount").value);await bm10Rpc("bm_v10_wallet_to_card",{p_amount_xof:amount});bm10Toast("Transfert effectué.");virtualCardPage($("#app"))}catch(err){bm10Toast("Transfert refusé : "+err.message)}};
};

/* Paiement sécurisé : fonds bloqués en séquestre jusqu'à confirmation de réception. */
paymentPage=async function(a){
 if(!bm10NeedUser())return;
 let ad=currentAd;
 a.innerHTML=`<div class="section-head"><h2>🔒 Paiement sécurisé</h2></div><div class="panel"><div class="statusline">Paiement par solde portefeuille ou solde carte. Les fonds sont bloqués jusqu'à confirmation de réception.</div>${ad?`<b>${bm10Esc(ad.title)}</b><div class="price">${bm10Money(ad.price)}</div>`:""}<form id="bm10payform"><label>ID de l'annonce<input id="bm10payad" value="${bm10Esc(ad?.id||"")}" required></label><label>Adresse / point de remise<input id="bm10payaddress" required maxlength="300" placeholder="Quartier, ville, point de rencontre"></label><label>Moyen de paiement<select id="bm10paymethod"><option value="wallet">Solde portefeuille</option><option value="card">Solde carte</option></select></label><button class="btn" id="bm10paybtn">Payer et bloquer les fonds</button></form><p class="muted">Le paiement est réalisé uniquement si le solde est suffisant et l'annonce disponible. Ne constitue pas un paiement Mobile Money externe.</p></div>`;
 $("#bm10payform").onsubmit=async e=>{e.preventDefault();const btn=$("#bm10paybtn");btn.disabled=true;try{const adid=$("#bm10payad").value.trim(),method=$("#bm10paymethod").value,address=$("#bm10payaddress").value.trim();const {data:orderId,error}=await sb.rpc("bm_v10_checkout",{p_ad_id:adid,p_method:method,p_delivery_address:address});if(error)throw error;bm10Toast("Paiement effectué. Fonds bloqués jusqu'à réception.");currentAd=null;go("purchases")}catch(err){bm10Toast("Paiement refusé : "+err.message)}finally{btn.disabled=false}};
};

/* Achats : confirmation de réception libère les fonds au vendeur. */
const bm10OldPurchases=purchasesPage;
purchasesPage=async function(a){
 if(!bm10NeedUser())return;
 a.innerHTML=`<div class="section-head"><h2>Mes achats & commandes</h2></div><div class="panel" id="bm10orders">Chargement…</div>`;
 try{const {data,error}=await sb.from("orders").select("id,ad_id,amount,status,payment_method,created_at,buyer_id,seller_id").eq("buyer_id",user.id).order("created_at",{ascending:false}).limit(50);if(error)throw error;
 $("#bm10orders").innerHTML=(data||[]).map(o=>`<div class="notice"><div class="noticeicon">🔒</div><div style="flex:1"><b>Commande ${bm10Esc(String(o.id).slice(0,8))}</b><p class="muted">${bm10Money(o.amount)} · ${bm10Esc(o.status)} · ${bm10Esc(o.payment_method)}</p><small>${new Date(o.created_at).toLocaleString("fr-FR")}</small>${o.status==="escrow"?`<button class="btn" onclick="bm10ConfirmOrder('${bm10Esc(o.id)}')">Confirmer la réception</button>`:""}</div></div>`).join("")||'<div class="empty">Aucune commande.</div>';
 }catch(e){$("#bm10orders").textContent="Erreur : "+e.message}
};
window.bm10ConfirmOrder=async id=>{if(!confirm("Confirmer que vous avez bien reçu l'article ? Les fonds seront libérés au vendeur."))return;try{await bm10Rpc("bm_v10_release_escrow",{p_order_id:id});bm10Toast("Réception confirmée, vendeur payé.");purchasesPage($("#app"))}catch(e){bm10Toast("Confirmation impossible : "+e.message)}};

/* Rencontres : photo obligatoire, profil 18+, annuaire et messagerie existante. */
datingPage=async function(a){
 if(!bm10NeedUser())return;
 a.innerHTML=`<div class="section-head"><h2>💞 Rencontres</h2></div><div class="panel"><h3>Mon profil de rencontre</h3><p class="muted">Réservé aux personnes majeures. Une photo est obligatoire pour publier le profil.</p><form id="bm10datingform"><label>Photo de profil obligatoire<input id="bm10datingphoto" type="file" accept="image/jpeg,image/png,image/webp" ${"required"}></label><img id="bm10datingpreview" class="bm10-dating-photo" hidden><label>Prénom / nom affiché<input id="bm10datingname" maxlength="70" required></label><label>Âge<input id="bm10datingage" type="number" min="18" max="100" required></label><label>Commune<select id="bm10datingcity">${CITIES.map(c=>`<option>${bm10Esc(c)}</option>`).join("")}</select></label><label>Présentation<textarea id="bm10datingbio" rows="4" maxlength="700" required></textarea></label><button class="btn">Enregistrer mon profil</button></form></div><div class="panel"><h3>Découvrir les profils</h3><div id="bm10datinglist">Chargement…</div></div>`;
 $("#bm10datingphoto").onchange=()=>{const f=$("#bm10datingphoto").files[0];if(!f)return;const im=$("#bm10datingpreview");im.src=URL.createObjectURL(f);im.hidden=false};
 $("#bm10datingform").onsubmit=async e=>{e.preventDefault();const f=$("#bm10datingphoto").files[0];if(!f)return bm10Toast("La photo est obligatoire.");if(!["image/jpeg","image/png","image/webp"].includes(f.type)||f.size>5*1024*1024)return bm10Toast("Photo JPG/PNG/WebP de 5 Mo maximum.");const age=Number($("#bm10datingage").value);if(age<18)return bm10Toast("Les rencontres sont réservées aux majeurs.");try{const path=`${user.id}/dating-${Date.now()}-${crypto.randomUUID()}.${f.type.split("/")[1]}`;const up=await sb.storage.from("photos").upload(path,f,{contentType:f.type,upsert:true});if(up.error)throw up.error;const url=sb.storage.from("photos").getPublicUrl(path).data.publicUrl;const {error}=await sb.from("bm_v10_dating_profiles").upsert({user_id:user.id,display_name:$("#bm10datingname").value.trim(),age,city:$("#bm10datingcity").value,bio:$("#bm10datingbio").value.trim(),photo_url:url,is_active:true},{onConflict:"user_id"});if(error)throw error;bm10Toast("Profil de rencontre publié.");datingPage($("#app"))}catch(err){bm10Toast("Enregistrement impossible : "+err.message)}};
 try{
  const {data:mine,error:mineErr}=await sb.from("bm_v10_dating_profiles").select("*").eq("user_id",user.id).maybeSingle();if(mineErr)throw mineErr;
  if(mine){$("#bm10datingname").value=mine.display_name||"";$("#bm10datingage").value=mine.age||"";$("#bm10datingcity").value=mine.city||CITIES[0];$("#bm10datingbio").value=mine.bio||"";$("#bm10datingpreview").src=mine.photo_url;$("#bm10datingpreview").hidden=false;$("#bm10datingphoto").required=false}
  const {data,error}=await sb.from("bm_v10_dating_profiles").select("user_id,display_name,age,city,bio,photo_url,created_at").eq("is_active",true).neq("user_id",user.id).order("created_at",{ascending:false}).limit(60);if(error)throw error;
  $("#bm10datinglist").innerHTML=(data||[]).map(p=>`<div class="bm10-profile-card"><img src="${bm10Esc(p.photo_url)}" alt="Photo de ${bm10Esc(p.display_name)}"><div><b>${bm10Esc(p.display_name)}</b><p class="muted">${bm10Esc(p.age)} ans · ${bm10Esc(p.city)}</p><p>${bm10Esc(p.bio||"")}</p><button class="btn ghost" onclick="bm10DatingMessage('${bm10Esc(p.user_id)}')">Envoyer un message</button></div></div>`).join("")||'<div class="empty">Aucun profil disponible pour le moment.</div>';
 }catch(err){$("#bm10datinglist").textContent="Annuaire indisponible : "+err.message+" — exécutez le SQL V10."}
};
window.bm10DatingMessage=id=>{activeChat=String(id);go("messages");setTimeout(()=>openConversation(String(id)),250)};

/* Mise à jour de l'en-tête avec le compteur de notifications non lues. */
const bm10OldRender=render;
render=function(){bm10OldRender();if(user){sb.from("bm_v10_notifications").select("id",{count:"exact",head:true}).eq("user_id",user.id).is("read_at",null).then(({count,error})=>{const b=document.querySelector('header button[aria-label="Notifications"]');if(b&&!error)b.textContent=count?`♧ ${count>9?"9+":count}`:"♧"}).catch(()=>{})}};
})();
</script>


<script>
/* Correctifs V10.1 : restauration des modules V9 et raccordement aux tables existantes. */
(function(){
 const bm101Esc=v=>typeof esc==='function'?esc(v??''):String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
 const bm101Money=v=>typeof bmV5Money==='function'?bmV5Money(Number(v||0)):new Intl.NumberFormat('fr-FR').format(Number(v||0))+' FCFA';

 /* Portefeuille : reprend l'écran V9 et son flux de demande V6, sans table bm_v10_* */
 walletPage=async function(a){
  if(!user){authPage(a,'Connectez-vous');return}
  if(typeof bmV6OldWallet==='function') await bmV6OldWallet(a);
  else profileExtraPage(a,'💰 Mon solde','Solde de démonstration : aucun argent réel n’est conservé dans cette interface.','<label>Montant à ajouter (FCFA)<input id="walletamount" type="number" min="500" required placeholder="5000"></label><label>Moyen de paiement<select id="walletmethod"><option>Mobile Money</option><option>Carte bancaire</option></select></label><label>Numéro de téléphone de paiement<input id="walletphone" type="tel" required placeholder="+229…"></label>','Préparer le rechargement');
  const panel=a.querySelector('.panel');
  if(panel){
   const extra=document.createElement('div');extra.innerHTML='<h3>💳 Mes cartes</h3><button class="btn ghost" onclick="go(\'virtualcard\')">Afficher mes cartes et recharger depuis mon solde</button><h3>📲 Recharger par Mobile Money (simulation)</h3><p class="muted">Aucun prélèvement réel : demande soumise à l’administration pour un crédit fictif.</p><button class="btn ghost" onclick="bmV6Topup()">Demander une recharge démo</button><p class="muted">Les anciennes cartes et les soldes V9 restent gérés par les fonctions V5/V9 existantes.</p>';
   panel.appendChild(extra);
  }
 };

 /* Carte virtuelle : rétablit la liste V9, les thèmes, les 5 cartes max, le masquage et le transfert depuis le solde. */
 virtualCardPage=async function(a){
  if(!user){authPage(a,'Connectez-vous');return}
  a.innerHTML='<div class="panel"><h2>💳 Mes cartes Bénin Market</h2><p class="muted">Cartes de démonstration Bénin Market. Aucun réseau bancaire ou paiement externe n’est activé.</p><label>Style de carte<select id="bmCardTheme"><option value="black">Noire</option><option value="orange">Orange</option><option value="yellow">Jaune</option></select></label><button class="btn" onclick="bmV9RequestCard()">＋ Demander une carte</button><p class="muted">Maximum 5 cartes par utilisateur. Le transfert vers une carte se fait uniquement depuis le solde Bénin Market.</p><div id="v5cards">Chargement…</div></div>';
  try{const cards=(await bmV5Rpc('bm_v9_my_cards')).filter(c=>c.status!=='rejected'&&!c.is_hidden);$('#v5cards').innerHTML=(cards||[]).map((c,i)=>bmV9CardMarkup(c,i)).join('')||'<p>Aucune carte. Demandez votre première carte.</p>'}
  catch(e){$('#v5cards').textContent='Erreur : '+e.message}
 };

 /* Achats : lit bm_v9_orders (et non la table inexistante orders). */
 purchasesPage=async function(a){
  if(!user){authPage(a,'Connectez-vous');return}
  a.innerHTML='<div class="section-head"><h2>Mes achats & commandes</h2></div><div class="panel" id="bm101orders">Chargement…</div><button class="btn ghost" onclick="go(\'payment\')">Nouvelle demande de commande</button>';
  try{
   const {data,error}=await sb.from('bm_v9_orders').select('id,tracking_code,ad_id,amount_xof,payment_method,payment_status,status,created_at,buyer_id,seller_id').eq('buyer_id',user.id).order('created_at',{ascending:false}).limit(50);
   if(error)throw error;
   $('#bm101orders').innerHTML=(data||[]).map(o=>`<div class="notice"><div class="noticeicon">🛍</div><div style="flex:1"><b>Commande ${bm101Esc(o.tracking_code||String(o.id).slice(0,8))}</b><p class="muted">${bm101Money(o.amount_xof)} · ${bm101Esc(o.status||'En attente')} · ${bm101Esc(o.payment_status||'Paiement en attente')}</p><small>${o.created_at?new Date(o.created_at).toLocaleString('fr-FR'):''}</small>${o.status==='escrow'||o.status==='shipped'?`<button class="btn" onclick="bm10ConfirmOrder('${bm101Esc(o.id)}')">Confirmer la réception</button>`:''}</div></div>`).join('')||'<div class="empty">Aucun achat ou commande pour le moment.</div>';
  }catch(e){$('#bm101orders').innerHTML='<p>Impossible de charger vos achats : '+bm101Esc(e.message)+'</p><p class="muted">La page utilise maintenant la table V9 bm_v9_orders. Vérifiez les autorisations RLS avec le SQL fourni.</p>'}
 };

 /* Annuaire de rencontres : raccordement à bm_v9_dating_profiles et conservation des colonnes V9. */
 datingPage=async function(a){
  if(!user){authPage(a,'Connectez-vous');return}
  a.innerHTML=`<div class="section-head"><h2>💞 Rencontres</h2></div><div class="panel"><h3>Mon profil de rencontre</h3><p class="muted">Réservé aux personnes majeures. La photo est facultative pour conserver la compatibilité avec les profils V9 déjà enregistrés.</p><form id="bm101dating"><label>Nom<input id="bm101last" maxlength="70" required></label><label>Prénom<input id="bm101first" maxlength="70" required></label><label>Âge<input id="bm101age" type="number" min="18" max="100" required></label><label>Commune<select id="bm101city">${CITIES.map(c=>`<option>${bm101Esc(c)}</option>`).join('')}</select></label><label>Sexe<select id="bm101gender"><option value="woman">Femme</option><option value="man">Homme</option><option value="other">Autre</option></select></label><label>Je recherche<select id="bm101looking"><option value="woman">Une femme</option><option value="man">Un homme</option><option value="any">Sans préférence</option></select></label><label>Présentation<textarea id="bm101bio" maxlength="1000" rows="3"></textarea></label><label>Photo (facultatif)<input id="bm101photo" type="file" accept="image/jpeg,image/png,image/webp"></label><button class="btn">Enregistrer mon profil</button></form></div><div class="panel"><h3>Découvrir les profils</h3><div id="bm101datinglist">Chargement…</div></div>`;
  try{
   const {data:mine,error:mineErr}=await sb.from('bm_v9_dating_profiles').select('*').eq('user_id',user.id).maybeSingle();if(mineErr)throw mineErr;
   if(mine){$('#bm101last').value=mine.last_name||'';$('#bm101first').value=mine.first_name||'';$('#bm101age').value=mine.age||'';$('#bm101city').value=mine.city||CITIES[0];$('#bm101gender').value=mine.gender||'other';$('#bm101looking').value=mine.looking_for||'any';$('#bm101bio').value=mine.bio||''} $('#bm101photo').required=!mine?.photo_url;
   $('#bm101dating').onsubmit=async e=>{e.preventDefault();const age=Number($('#bm101age').value);if(age<18)return bm10Toast('Les rencontres sont réservées aux majeurs.');let photo_url=mine?.photo_url||null;const file=$('#bm101photo').files[0];try{if(!file&&!photo_url)throw Error('Une photo est obligatoire pour publier le profil.');if(file){if(!['image/jpeg','image/png','image/webp'].includes(file.type)||file.size>5*1024*1024)throw Error('Photo JPG/PNG/WebP de 5 Mo maximum.');const path=`${user.id}/dating-${Date.now()}-${crypto.randomUUID()}.${file.type.split('/')[1]}`;const up=await sb.storage.from('photos').upload(path,file,{contentType:file.type,upsert:true});if(up.error)throw up.error;photo_url=sb.storage.from('photos').getPublicUrl(path).data.publicUrl}
    const row={user_id:user.id,last_name:$('#bm101last').value.trim(),first_name:$('#bm101first').value.trim(),age,city:$('#bm101city').value,gender:$('#bm101gender').value,looking_for:$('#bm101looking').value,bio:$('#bm101bio').value.trim(),photo_url,status:mine?.status||'pending'};
    const {error}=await sb.from('bm_v9_dating_profiles').upsert(row,{onConflict:'user_id'});if(error)throw error;bm10Toast('Profil enregistré. Il sera visible après validation.');datingPage($('#app'))
   }catch(err){bm10Toast('Enregistrement impossible : '+err.message)}};
   const {data,error}=await sb.from('bm_v9_dating_profiles').select('user_id,first_name,last_name,age,city,bio,photo_url,created_at').eq('status','approved').neq('user_id',user.id).order('created_at',{ascending:false}).limit(60);if(error)throw error;
   $('#bm101datinglist').innerHTML=(data||[]).map(p=>`<div class="bm10-profile-card">${p.photo_url?`<img src="${bm101Esc(p.photo_url)}" alt="Photo de profil">`:''}<div><b>${bm101Esc((p.first_name||'')+' '+(p.last_name||''))}</b><p class="muted">${bm101Esc(p.age)} ans · ${bm101Esc(p.city)}</p><p>${bm101Esc(p.bio||'')}</p><button class="btn ghost" onclick="bm10DatingMessage('${bm101Esc(p.user_id)}')">Envoyer un message</button></div></div>`).join('')||'<div class="empty">Aucun profil validé disponible pour le moment.</div>';
  }catch(err){$('#bm101datinglist').textContent='Annuaire indisponible : '+err.message+' — vérifiez le SQL de compatibilité V9.'}
 };

 /* Mes demandes : consultation des demandes de service et demandes financières du compte connecté. */
 window.bm101RequestsPage=async function(a){
  if(!user){authPage(a,'Connectez-vous');return}
  a.innerHTML='<div class="section-head"><h2>Mes demandes</h2></div><div class="panel" id="bm101requests">Chargement…</div>';
  const host=$('#bm101requests');let parts=[];
  try{const {data,error}=await sb.from('bm_service_requests').select('id,kind,title,details,status,created_at').eq('user_id',user.id).order('created_at',{ascending:false}).limit(50);if(error)throw error;parts.push(...(data||[]).map(x=>({label:x.title||x.kind,detail:x.details,status:x.status,date:x.created_at,id:x.id})));}catch(e){parts.push({label:'Demandes de service',detail:'Lecture indisponible : '+e.message,status:'À vérifier'});}
  try{const {data,error}=await sb.from('bm_money_requests').select('id,kind,amount_xof,status,created_at').eq('user_id',user.id).order('created_at',{ascending:false}).limit(50);if(error)throw error;parts.push(...(data||[]).map(x=>({label:'Demande financière · '+x.kind,detail:bm101Money(x.amount_xof),status:x.status,date:x.created_at,id:x.id})));}catch(e){parts.push({label:'Demandes financières',detail:'Lecture indisponible : '+e.message,status:'À vérifier'});}
  host.innerHTML=parts.map(x=>`<div class="notice"><div class="noticeicon">📄</div><div><b>${bm101Esc(x.label)}</b><p class="muted">${bm101Esc(x.detail||'')}</p><small>${bm101Esc(x.status||'En attente')} · ${x.date?new Date(x.date).toLocaleString('fr-FR'):''}</small></div></div>`).join('')||'<div class="empty">Vous n’avez aucune demande enregistrée.</div>';
 };

 /* Les 30 rubriques sont ajoutées tout en bas de Profil, après les fonctions habituelles. */
 const bm101Categories=[
  ['restaurants','Restaurants et services de restauration','🍽️'],['pret-a-porter','Mode et prêt-à-porter','👗'],['artistes','Artistes et professionnels du spectacle','🎤'],['auto-ecoles','Auto-écoles et formation à la conduite','🚘'],['location-vehicules','Location de véhicules','🚗'],['billets-avion','Réservation de billets d’avion','✈️'],['grossistes-agro','Grossistes en produits agroalimentaires','🌾'],['grossistes-multi-produits','Fournisseurs et grossistes mult produits','📦'],['pharmacies','Pharmacies et services pharmaceutiques','💊'],['vehicules-occasion','Véhicules, motos et vélos d’occasion','🏍️'],['mode-enfant','Mode enfant : vêtements et chaussures','🧒'],['documents-benin','Démarches et documents administratifs du Bénin','🏛️'],['evenements','Événements, spectacles et concerts','🎟️'],['police-proche','Contacter le commissariat de police le plus proche','🚨'],['depannage','Techniciens et services de dépannage','🧰'],['btp','BTP et entreprises de construction','🏗️'],['entretien-domicile','Entretien et services à domicile','🧹'],['agriculture','Agriculteurs et fournisseurs de produits agricoles','🚜'],['assurances','Assurances et courtiers','🛡️'],['banques','Banques et services financiers au Bénin','🏦'],['artisans-batiment','Artisans du bâtiment et de la décoration','🛠️'],['immobilier-cuisine','Immobilier et location d’équipements de cuisine','🏠'],['gaz-condiments','Gaz domestique, condiments et livraison','🛵'],['coiffure','Coiffure et soins capillaires','💇'],['couture','Couture, retouches et confection','🧵'],['vulcanisation','Vulcanisation et services pneumatiques','🛞'],['electromenager','Électroménager : vente et équipements','🔌'],['createurs','Influenceurs et créateurs de contenu','📱'],['mode-premium','Mode premium : bazin, pagnes, vêtements et chaussures','✨'],['juridique','Avocats, huissiers et services juridiques','⚖️']
 ];
 window.bm101Categories=bm101Categories;
 window.bm101OpenCategory=async function(key){
  const a=$('#app');const cat=bm101Categories.find(x=>x[0]===key);if(!cat)return;
  if(key==='documents-benin'){a.innerHTML=`<div class="section-head"><h2>${cat[2]} ${cat[1]}</h2></div><div class="panel"><p>Accédez directement aux portails officiels du Bénin. Bénin Market ne collecte pas vos documents et ne représente pas l’administration.</p><p><a class="btn" target="_blank" rel="noopener" href="https://www.service-public.bj/">Portail national des services publics</a></p><p><a class="btn ghost" target="_blank" rel="noopener" href="https://demarchesmtfp.gouv.bj/">Portail officiel des démarches administratives</a></p><p><a class="btn ghost" target="_blank" rel="noopener" href="https://www.gouv.bj/">Site du Gouvernement du Bénin</a></p></div>`;return}
  if(key==='police-proche'){a.innerHTML=`<div class="section-head"><h2>${cat[2]} ${cat[1]}</h2></div><div class="panel"><p>Autorisez la géolocalisation de votre appareil pour rechercher les commissariats autour de vous sur la carte.</p><button class="btn" id="bm101police">📍 Trouver un commissariat proche</button><p id="bm101policestatus" class="muted"></p></div>`;$('#bm101police').onclick=()=>{const out=$('#bm101policestatus');if(!navigator.geolocation){out.textContent='La géolocalisation n’est pas disponible sur cet appareil.';return}out.textContent='En attente de votre autorisation…';navigator.geolocation.getCurrentPosition(pos=>{const q=encodeURIComponent('commissariat de police near '+pos.coords.latitude+','+pos.coords.longitude);window.location.href='https://www.google.com/maps/search/?api=1&query='+q;out.textContent='Résultats cartographiques ouverts. En cas de danger immédiat, contactez directement les services d’urgence locaux.'},err=>{out.textContent='Position non obtenue : '+err.message},{enableHighAccuracy:true,timeout:12000,maximumAge:60000})};return}
  a.innerHTML=`<div class="section-head"><h2>${cat[2]} ${bm101Esc(cat[1])}</h2></div><div class="panel"><p class="muted">Consultez les professionnels validés ou proposez votre propre profil dans cette rubrique.</p><div id="bm101catlist">Chargement…</div></div>${user?`<div class="panel"><h3>Présenter mon activité</h3><form id="bm101catform"><label>Nom professionnel / entreprise<input id="bm101catname" maxlength="120" required></label><label>Ville ou commune<input id="bm101catcity" maxlength="100" required></label><label>Téléphone de contact<input id="bm101catphone" type="tel" maxlength="30" required></label><label>Description et services proposés<textarea id="bm101catdesc" maxlength="1500" required rows="4"></textarea></label><button class="btn">Soumettre mon profil</button></form></div>`:''}`;
  try{const {data,error}=await sb.from('bm_v10_service_profiles').select('id,user_id,display_name,city,phone,description,created_at').eq('category_key',key).eq('status','approved').order('created_at',{ascending:false}).limit(100);if(error)throw error;$('#bm101catlist').innerHTML=(data||[]).map(x=>`<div class="notice"><div class="noticeicon">${cat[2]}</div><div><b>${bm101Esc(x.display_name)}</b><p class="muted">${bm101Esc(x.city)} · ${bm101Esc(x.description)}</p><a href="tel:${bm101Esc(x.phone)}">Contacter : ${bm101Esc(x.phone)}</a></div></div>`).join('')||'<div class="empty">Aucun profil validé dans cette rubrique pour le moment.</div>'}
  catch(e){$('#bm101catlist').textContent='Annuaire indisponible : '+e.message+'. Exécutez le SQL V10.1.'}
  if(user)$('#bm101catform').onsubmit=async e=>{e.preventDefault();try{const row={user_id:user.id,category_key:key,display_name:$('#bm101catname').value.trim(),city:$('#bm101catcity').value.trim(),phone:$('#bm101catphone').value.trim(),description:$('#bm101catdesc').value.trim(),status:'approved'};const {error}=await sb.from('bm_v10_service_profiles').upsert(row,{onConflict:'user_id,category_key'});if(error)throw error;bm10Toast('Profil publié dans l’annuaire.');bm101OpenCategory(key)}catch(err){bm10Toast('Envoi impossible : '+err.message)}};
 };
 window.bm101Categories=bm101Categories;
 const bm101OldProfile=profilePage;
 profilePage=function(a){bm101OldProfile(a);const host=a.querySelector('.panel:last-child');if(!host)return;const sec=document.createElement('div');sec.className='panel bm101-category-panel';sec.innerHTML='<h3>🌐 Annuaire des services et professionnels</h3><p class="muted">30 rubriques pour trouver un professionnel ou présenter votre activité.</p><div class="bm101-category-grid">'+bm101Categories.map(c=>`<button class="menuitem" type="button" onclick="bm101OpenCategory('${c[0]}')"><span>${c[2]}</span>${bm101Esc(c[1])}<span class="arrow">›</span></button>`).join('')+'</div><button class="menuitem" type="button" onclick="bm101RequestsPage($(\'#app\'))"><span>📄</span>Mes demandes<span class="arrow">›</span></button>';
  a.appendChild(sec);
 };
})();
</script>
