<script>
/* BÉNIN MARKET V11 — modules sécurisés : commandes V9, modération, annuaire, suivi et notifications. */
(function(){
 const esc11=v=>typeof esc==='function'?esc(v??''):String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
 const money11=v=>typeof bmV5Money==='function'?bmV5Money(Number(v||0)):new Intl.NumberFormat('fr-FR').format(Number(v||0))+' FCFA';
 const toast11=m=>typeof bm10Toast==='function'?bm10Toast(m):toast(m);
 const rpc11=async(name,args={})=>{const {data,error}=await sb.rpc(name,args);if(error)throw error;return data};

 /* Paiement : bascule sur la vraie table bm_v9_orders et le portefeuille/carte V5. */
 paymentPage=async function(host){
  if(!user){authPage(host,'Connectez-vous');return}
  const ad=currentAd;
  host.innerHTML=`<div class="section-head"><h2>🔒 Paiement sécurisé</h2></div><div class="panel"><p class="muted">Le paiement utilise votre solde Bénin Market ou votre carte interne. Les fonds sont bloqués jusqu’à la confirmation de réception. Aucun paiement Mobile Money externe n’est simulé.</p>${ad?`<b>${esc11(ad.title)}</b><div class="price">${money11(ad.price)}</div>`:''}<form id="bm11payform"><label>ID de l’annonce<input id="bm11adid" value="${esc11(ad?.id||'')}" required></label><label>Adresse / point de remise<input id="bm11address" maxlength="300" required placeholder="Quartier, ville, point de rencontre"></label><label>Moyen de paiement<select id="bm11method"><option value="wallet">Mon solde</option><option value="card">Carte virtuelle Bénin Market</option></select></label><button class="btn" id="bm11paybtn">Payer et sécuriser la commande</button></form><p class="muted">Les fonds ne sont versés au vendeur qu’après confirmation de réception.</p></div>`;
  $('#bm11payform').onsubmit=async e=>{e.preventDefault();const btn=$('#bm11paybtn');btn.disabled=true;try{const id=await rpc11('bm_v11_checkout',{p_ad_id:$('#bm11adid').value.trim(),p_method:$('#bm11method').value,p_delivery_address:$('#bm11address').value.trim()});toast11('Commande créée et paiement sécurisé.');currentAd=null;go('purchases')}catch(err){toast11('Paiement impossible : '+err.message)}finally{btn.disabled=false}};
 };

 /* Achats ET ventes : même table réelle V9. Aucune fausse confirmation via l’ancienne table orders. */
 purchasesPage=async function(host){
  if(!user){authPage(host,'Connectez-vous');return}
  host.innerHTML='<div class="section-head"><h2>🛍️ Mes achats et ventes</h2></div><div class="panel"><h3>Mes achats</h3><div id="bm11buyerorders">Chargement…</div></div><div class="panel"><h3>Mes ventes</h3><div id="bm11sellerorders">Chargement…</div></div>';
  try{
   const [b,s]=await Promise.all([
    sb.from('bm_v9_orders').select('id,tracking_code,ad_id,amount_xof,payment_method,payment_status,status,created_at,buyer_id,seller_id').eq('buyer_id',user.id).order('created_at',{ascending:false}).limit(60),
    sb.from('bm_v9_orders').select('id,tracking_code,ad_id,amount_xof,payment_method,payment_status,status,created_at,buyer_id,seller_id').eq('seller_id',user.id).order('created_at',{ascending:false}).limit(60)
   ]);
   if(b.error)throw b.error;if(s.error)throw s.error;
   const card=(o,side)=>`<div class="notice"><div class="noticeicon">${side==='buyer'?'📦':'💼'}</div><div style="flex:1;min-width:0"><b>Commande ${esc11(o.tracking_code||String(o.id).slice(0,8))}</b><p class="muted">${money11(o.amount_xof)} · ${esc11(o.payment_method||'')} · ${esc11(o.status||'En cours')}</p><small class="muted">Paiement : ${esc11(o.payment_status||'En attente')} · ${o.created_at?new Date(o.created_at).toLocaleString('fr-FR'):''}</small>${side==='seller'&&o.status==='escrow'?`<button class="btn ghost" onclick="bm11Ship('${esc11(o.id)}')">Marquer comme expédiée</button>`:''}${side==='buyer'&&['escrow','shipped'].includes(o.status)?`<button class="btn" onclick="bm11Receive('${esc11(o.id)}')">Confirmer la réception</button>`:''}</div></div>`;
   $('#bm11buyerorders').innerHTML=(b.data||[]).map(o=>card(o,'buyer')).join('')||'<div class="empty">Aucun achat pour le moment.</div>';
   $('#bm11sellerorders').innerHTML=(s.data||[]).map(o=>card(o,'seller')).join('')||'<div class="empty">Aucune vente pour le moment.</div>';
  }catch(e){$('#bm11buyerorders').textContent='Chargement impossible : '+e.message;$('#bm11sellerorders').textContent='Vérifiez les autorisations de la table bm_v9_orders.'}
 };
 window.bm11Ship=async id=>{if(!confirm('Confirmer que la commande a été expédiée ?'))return;try{await rpc11('bm_v11_mark_shipped',{p_order_id:id});toast11('Commande marquée comme expédiée.');purchasesPage($('#app'))}catch(e){toast11('Action impossible : '+e.message)}};
 window.bm11Receive=async id=>{if(!confirm('Confirmer la bonne réception ? Cette action libère les fonds au vendeur.'))return;try{await rpc11('bm_v11_release_escrow',{p_order_id:id});toast11('Réception confirmée et paiement libéré.');purchasesPage($('#app'))}catch(e){toast11('Confirmation impossible : '+e.message)}};

 /* Annuaire : les nouveaux profils attendent une validation administrative. */
 const oldOpenCategory=window.bm101OpenCategory;
 if(typeof oldOpenCategory==='function'){
  window.bm101OpenCategory=async function(key){await oldOpenCategory(key);const form=$('#bm101catform');if(form){form.onsubmit=async e=>{e.preventDefault();try{const row={user_id:user.id,category_key:key,display_name:$('#bm101catname').value.trim(),city:$('#bm101catcity').value.trim(),phone:$('#bm101catphone').value.trim(),description:$('#bm101catdesc').value.trim(),status:'pending'};const {error}=await sb.from('bm_v10_service_profiles').upsert(row,{onConflict:'user_id,category_key'});if(error)throw error;toast11('Profil envoyé. Il sera visible après validation.');window.bm101OpenCategory(key)}catch(err){toast11('Envoi impossible : '+err.message)}}}}
 }

 /* Modération des profils professionnels et rencontres dans l’espace administrateur. */
 const oldAdmin=window.bmV5Admin;
 if(typeof oldAdmin==='function'){
  window.bmV5Admin=async function(){await oldAdmin();const host=$('#v5admin');if(!host||host.querySelector('#bm11moderation'))return;const box=document.createElement('div');box.id='bm11moderation';box.className='panel';box.innerHTML='<h3>🛡️ Modération V11 — annuaire professionnel</h3><div id="bm11pendingprofiles">Chargement…</div><h3 style="margin-top:18px">Profils de rencontres en attente</h3><div id="bm11pendingdating">Chargement…</div><button class="btn ghost" onclick="bm11Audit()">Vérifier les modules et les tables</button><div id="bm11auditresult" class="muted"></div>';host.appendChild(box);
   try{const {data,error}=await sb.from('bm_v10_service_profiles').select('id,display_name,category_key,city,phone,description,created_at').eq('status','pending').order('created_at',{ascending:true}).limit(100);if(error)throw error;$('#bm11pendingprofiles').innerHTML=(data||[]).map(x=>`<div class="bm-v6-item"><b>${esc11(x.display_name)}</b><p class="muted">${esc11(x.category_key)} · ${esc11(x.city)} · ${esc11(x.phone)}</p><p>${esc11(x.description)}</p><button class="btn" onclick="bm11ReviewProfile('${esc11(x.id)}','approved')">Approuver</button><button class="btn danger" onclick="bm11ReviewProfile('${esc11(x.id)}','rejected')">Refuser</button></div>`).join('')||'<p class="muted">Aucun profil professionnel en attente.</p>'}catch(e){$('#bm11pendingprofiles').textContent='Indisponible : '+e.message}
   try{const {data,error}=await sb.from('bm_v9_dating_profiles').select('user_id,first_name,last_name,age,city,status').eq('status','pending').order('created_at',{ascending:true}).limit(100);if(error)throw error;$('#bm11pendingdating').innerHTML=(data||[]).map(x=>`<div class="bm-v6-item"><b>${esc11((x.first_name||'')+' '+(x.last_name||''))}</b><p class="muted">${esc11(x.age)} ans · ${esc11(x.city)}</p><button class="btn" onclick="bm11ReviewDating('${esc11(x.user_id)}','approved')">Approuver</button><button class="btn danger" onclick="bm11ReviewDating('${esc11(x.user_id)}','rejected')">Refuser</button></div>`).join('')||'<p class="muted">Aucun profil de rencontre en attente.</p>'}catch(e){$('#bm11pendingdating').textContent='Indisponible : '+e.message}
  }
 }
 window.bm11ReviewProfile=async(id,decision)=>{try{await rpc11('bm_v11_review_service_profile',{p_profile_id:id,p_decision:decision});toast11('Décision enregistrée.');bmV5Admin()}catch(e){toast11('Action refusée : '+e.message)}};
 window.bm11ReviewDating=async(id,decision)=>{try{await rpc11('bm_v11_review_dating_profile',{p_user_id:id,p_decision:decision});toast11('Décision enregistrée.');bmV5Admin()}catch(e){toast11('Action refusée : '+e.message)}};
 window.bm11Audit=async()=>{const out=$('#bm11auditresult');if(!out)return;out.textContent='Vérification en cours…';const checks=[['Annonces','ads'],['Commandes V9','bm_v9_orders'],['Portefeuilles V5','bm_v5_wallets'],['Cartes V5','bm_v5_cards'],['Messagerie','messages'],['Notifications V10','bm_v10_notifications'],['Annuaire professionnel','bm_v10_service_profiles']];const results=await Promise.all(checks.map(async ([label,table])=>{try{const {error}=await sb.from(table).select('*',{head:true,count:'exact'}).limit(1);return label+': '+(error?'à vérifier ('+error.message+')':'accessible')}catch(e){return label+': à vérifier'}}));out.innerHTML=results.map(x=>'• '+esc11(x)).join('<br>')+'<br><small>Ce contrôle vérifie l’accès aux tables, pas les paiements réels ni toutes les règles RLS.</small>'};

 /* Géolocalisation : bouton de proximité réutilisable, sans suivre ni enregistrer la position. */
 window.bm11Nearby=()=>{if(!navigator.geolocation)return toast11('Géolocalisation indisponible.');navigator.geolocation.getCurrentPosition(pos=>{const q=encodeURIComponent(pos.coords.latitude+','+pos.coords.longitude);window.open('https://www.google.com/maps/search/?api=1&query='+q,'_blank','noopener')},e=>toast11('Position non obtenue : '+e.message),{enableHighAccuracy:true,timeout:12000,maximumAge:60000})};

 /* Recherche et navigation restent sur les composants V10/V9 ; les notifications gardent le canal persistant existant. */
 document.documentElement.dataset.beninMarketVersion='11';
})();
</script>

<script>
/* BENIN MARKET V12 — interface portefeuille professionnelle, cartes, annonces regroupées. */
(function(){
 const v12Esc=v=>typeof esc==='function'?esc(v??''):String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
 const v12Fmt=n=>new Intl.NumberFormat('fr-FR').format(Number(n||0))+' XOF';
 const v12Date=d=>d?new Date(d).toLocaleString('fr-FR',{dateStyle:'medium',timeStyle:'short'}):'Date inconnue';
 const v12OldProfile=profilePage;
 profilePage=function(a){v12OldProfile(a);const panels=a.querySelectorAll('.panel');panels.forEach(p=>{const b=[...p.querySelectorAll('button.menuitem')].find(x=>x.textContent.includes('Mon solde'));if(b)b.innerHTML='<span>👛</span>Portefeuille <span class="arrow">›</span>';});const signout=[...a.querySelectorAll('button')].find(x=>x.textContent.includes('Se déconnecter'));if(signout){signout.classList.add('bm12-signout');signout.textContent='⇥  Se déconnecter';signout.style.display='block';signout.style.width='100%';signout.style.marginTop='18px';signout.style.order='999';}}
 /* Portefeuille : conserve les RPC V5/V6, change uniquement la présentation. */
 walletPage=async function(a){
  if(!user){authPage(a,'Connectez-vous');return}
  a.innerHTML=`<div class="bm12-wallet">
   <div class="bm12-wallet-head"><div><span class="bm12-eyebrow">ESPACE FINANCIER BÉNIN MARKET</span><h2>Mon portefeuille</h2><p>Gérez votre solde, votre épargne et vos opérations.</p></div><button class="bm12-iconbtn" onclick="go('profile')" aria-label="Retour au profil">←</button></div>
   <section class="bm12-balance"><div class="bm12-balance-top"><span>▣</span><span>Mon solde principal</span><button onclick="bm12Toggle('principal')" aria-label="Masquer ou afficher le solde">◉</button></div><div class="bm12-balance-value" id="bm12principal">Chargement…</div><div class="bm12-currency">Devise du compte · XOF (FCFA)</div></section>
   <div class="bm12-actions"><button onclick="bmV5WalletAction('topup')"><b>＋</b>Ajouter de l’argent</button><button onclick="bmV5WalletAction('withdraw')"><b>↗</b>Retirer</button><button onclick="bmV5WalletAction('send')"><b>⇄</b>Transférer</button></div>
   <section class="bm12-savings"><div><span class="bm12-saving-icon">🐷</span><div><b>Épargne</b><small>Votre réserve personnelle</small><strong id="bm12savings">Chargement…</strong></div></div><button id="bm12savingtoggle" onclick="bm12Toggle('savings')">Masquer</button><button class="bm12-text-action" onclick="bmV5WalletAction('save')">Épargner</button><button class="bm12-text-action" onclick="bmV5WalletAction('unsave')">Récupérer</button></section>
   <div class="bm12-section-title"><h3>Mes opérations</h3><span>Historique du portefeuille</span></div>
   <div class="bm12-filters"><button class="active" onclick="bm12Filter('all',this)">Tout</button><button onclick="bm12Filter('credit',this)">Dépôts</button><button onclick="bm12Filter('debit',this)">Retraits</button><button onclick="bm12Filter('transfer',this)">Transferts</button></div><div id="bm12ledger" class="bm12-operations">Chargement…</div>
   <section class="bm12-card-shortcut"><div class="bm12-section-title"><h3>Mes cartes</h3><button onclick="go('virtualcard')">Voir tout →</button></div><p>Consultez vos cartes et leurs opérations.</p><button class="bm12-secondary" onclick="go('virtualcard')">💳 Gérer mes cartes</button></section>
   <p class="bm12-disclaimer">Les soldes affichés sont des soldes internes Bénin Market. Ils ne constituent pas un compte bancaire ni un moyen de paiement externe.</p>
  </div>`;
  try{const r=await bmV5Rpc('bm_v5_my_wallet');window.bm12WalletEntries=Array.isArray(r.entries)?r.entries:[];window.bm12WalletBalance=Number(r.available_xof||0);window.bm12SavingsBalance=Number(r.savings_xof||0);bm12RenderBalances();bm12RenderLedger('all')}catch(e){$('#bm12principal').textContent='Solde indisponible';$('#bm12savings').textContent='Épargne indisponible';$('#bm12ledger').textContent='Impossible de charger les opérations : '+e.message}
 };
 window.bm12Toggle=function(which){const key='bm12-hide-'+which,hidden=localStorage.getItem(key)==='1';localStorage.setItem(key,hidden?'0':'1');bm12RenderBalances()};
 window.bm12RenderBalances=function(){const p=$('#bm12principal'),s=$('#bm12savings');if(p)p.textContent=localStorage.getItem('bm12-hide-principal')==='1'?'••••••••':v12Fmt(window.bm12WalletBalance);if(s)s.textContent=localStorage.getItem('bm12-hide-savings')==='1'?'••••••••':v12Fmt(window.bm12SavingsBalance);const t=$('#bm12savingtoggle');if(t)t.textContent=localStorage.getItem('bm12-hide-savings')==='1'?'Afficher':'Masquer'};
 window.bm12Filter=function(k,btn){document.querySelectorAll('.bm12-filters button').forEach(x=>x.classList.remove('active'));btn.classList.add('active');bm12RenderLedger(k)};
 window.bm12RenderLedger=function(filter){const host=$('#bm12ledger');if(!host)return;let rows=window.bm12WalletEntries||[];const kind=x=>String(x.kind||'').toLowerCase();rows=rows.filter(x=>filter==='all'||(filter==='credit'?/(credit|deposit|topup|recharge|received)/.test(kind(x)):filter==='debit'?/(debit|withdraw|payment|purchase)/.test(kind(x)):/(transfer|send|receive)/.test(kind(x))));host.innerHTML=rows.map(x=>{const k=kind(x),positive=/(credit|deposit|topup|recharge|received)/.test(k),label=({credit:'Dépôt / crédit',debit:'Retrait / débit',transfer:'Transfert',save:'Mise en épargne',unsave:'Retrait d’épargne'})[k]||String(x.kind||'Opération').replace(/_/g,' ');return `<article class="bm12-operation"><span class="bm12-op-icon ${positive?'positive':'neutral'}">${positive?'↓':/(transfer|send)/.test(k)?'⇄':'↑'}</span><div class="bm12-op-info"><b>${v12Esc(label)}</b><small>${v12Esc(x.reference||'Opération portefeuille')}</small><small>${v12Esc(v12Date(x.created_at))}</small></div><strong class="${positive?'positive-text':'negative-text'}">${positive?'+':'−'}${v12Fmt(x.amount_xof)}</strong></article>`}).join('')||'<div class="bm12-empty">Aucune opération dans cette catégorie.</div>'};
 /* Carte : solde sur le visuel, retrait vers portefeuille et journal des transactions. */
 virtualCardPage=async function(a){if(!user){authPage(a,'Connectez-vous');return}a.innerHTML=`<div class="section-head"><h2>Mes cartes</h2><button class="textbtn" onclick="go('wallet')">← Portefeuille</button></div><div class="panel"><label>Style de carte<select id="bmCardTheme"><option value="black">Noire</option><option value="orange">Orange</option><option value="yellow">Jaune</option></select></label><button class="btn" onclick="bmV9RequestCard()">＋ Demander une carte</button><p class="muted">Cartes internes de démonstration Bénin Market. Maximum 5 cartes.</p><div id="bm12cards">Chargement…</div></div>`;
  try{const cards=(await bmV5Rpc('bm_v9_my_cards')).filter(c=>c.status!=='rejected'&&!c.is_hidden);if(!Array.isArray(cards)||!cards.length){$('#bm12cards').innerHTML='<div class="empty">Aucune carte. Demandez votre première carte.</div>';return}$('#bm12cards').innerHTML=cards.map((c,i)=>{const theme=['black','orange','yellow'].includes(c.card_theme)?c.card_theme:'black',num=c.demo_number||('5399 BM '+String(c.display_code||c.id||'0000').replace(/[^0-9]/g,'').slice(-4).padStart(4,'0')+' 0000');return `<article class="bm12-card-unit"><div class="bm12-bankcard ${theme}"><div class="bm12-bankcard-head"><b>◉ BM</b><small>BENIN MARKET</small></div><div class="bm12-chip"></div><div class="bm12-cardnum" id="bm12num${i}">•••• •••• •••• ${v12Esc(String(num).replace(/\s/g,'').slice(-4))}</div><div class="bm12-cardbottom"><span>${v12Esc(user.email||'MEMBRE')}</span><span>${v12Esc(c.status||'pending')}</span></div><div class="bm12-cardbalance-label">SOLDE DE LA CARTE</div><div class="bm12-cardbalance">${v12Fmt(c.balance_xof)}</div></div><div class="bm12-card-tools"><b>${v12Esc(c.display_code||'Carte virtuelle')}</b><span class="bm-v5-pill">${v12Esc(c.status)}</span><div class="bm12-card-buttons"><button onclick="bmV9ToggleCard('${v12Esc(c.id)}',${i},'${v12Esc(String(num).replace(/'/g,''))}','${v12Esc(c.demo_cvv||'123')}')">👁 Voir / cacher</button>${c.status==='approved'?`<button onclick="bmV5FundCard('${v12Esc(c.id)}')">＋ Ajouter depuis portefeuille</button><button onclick="bm12WithdrawCard('${v12Esc(c.id)}')">− Retirer vers portefeuille</button>`:''}<button onclick="bm12CardHistory('${v12Esc(c.id)}',${i})">☷ Opérations de la carte</button><button class="danger" onclick="bm13DeleteCard('${v12Esc(c.id)}')">Supprimer ma carte</button></div><div id="bm12hist${i}" class="bm12-card-history"></div></div></article>`}).join('')}
  catch(e){$('#bm12cards').textContent='Erreur de chargement des cartes : '+e.message}
 };
 window.bm12WithdrawCard=async function(id){const raw=prompt('Montant à retirer de la carte vers le solde principal (FCFA)');if(raw===null)return;const amount=Number(raw);if(!Number.isSafeInteger(amount)||amount<100)return toast('Montant invalide (minimum 100 FCFA).');try{await bmV5Rpc('bm_v12_card_to_wallet',{p_card_id:id,p_amount:amount});toast('Transfert vers le solde principal effectué.');virtualCardPage($('#app'))}catch(e){toast('Retrait impossible : '+e.message)}};
 window.bm12CardHistory=async function(id,i){const host=$('#bm12hist'+i);if(!host)return;host.textContent='Chargement des opérations…';try{const {data,error}=await sb.from('bm_v10_card_transactions').select('id,operation,amount_xof,created_at').eq('card_id',id).eq('user_id',user.id).order('created_at',{ascending:false}).limit(30);if(error)throw error;host.innerHTML=(data||[]).map(x=>`<div><span>${x.operation==='credit'?'Crédit carte':'Retrait vers portefeuille'}</span><b>${x.operation==='credit'?'+':'−'}${v12Fmt(x.amount_xof)}</b><small>${v12Esc(v12Date(x.created_at))}</small></div>`).join('')||'Aucune opération enregistrée.'}catch(e){host.textContent='Historique indisponible : '+e.message}};
 /* Annonces : cartes d'administration regroupées sur une seule page, sans changer le reste de l'application. */
 myAdsPage=function(a){const mine=ads.filter(x=>x.seller_id===user.id);a.innerHTML=`<div class="section-head"><h2>Mes annonces</h2><button class="textbtn" onclick="go('publish')">＋ Publier</button></div><div class="bm12-myads">${mine.map(x=>{const img=x.image_url||(x.images&&x.images[0]);return `<article class="bm12-admanage"><div class="bm12-adtop">${img?`<img src="${v12Esc(img)}" alt="">`:'<div class="bm12-adplaceholder">▣</div>'}<div class="bm12-adinfo"><span class="badge">${x.sold?'Vendue':'En ligne'}</span><b>${v12Esc(x.title)}</b><strong>${v12Fmt(x.price)}</strong><small>Référence : ${v12Esc(x.public_code||('BM-'+String(x.id).slice(0,8).toUpperCase()))}</small><small>${v12Esc(x.city||'')} · ${v12Esc(x.category||'')}</small></div></div><div class="bm12-adbuttons"><button onclick="bm12EditAd('${v12Esc(x.id)}')">✎ Modifier</button><button class="danger" onclick="deleteAd('${v12Esc(x.id)}')">▤ Supprimer</button><button onclick="markSold('${v12Esc(x.id)}')">${x.sold?'↻ Remettre en vente':'✓ Marquer vendue'}</button></div></article>`}).join('')||'<div class="empty">Vous n’avez pas encore publié d’annonce.</div>'}</div>`};

<script>
(function(){
 const cats=window.bm101Categories||[];
 const esc13=v=>typeof esc==='function'?esc(v??''):String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
 const oldRender13=render;
 render=function(){if(page==='services'){nav();servicesDirectory($('#app'));return;}oldRender13();if(page==='home'){const root=$('#app');if(root)root.dataset.bm13='';decorateHome();}if(page==='messages'){const root=$('#app');if(root)root.dataset.bm13chat='';decorateMessages();}if(page==='admin')decorateAdmin();};
 function serviceButton(c){return `<button class="bm13-service" onclick="bm101OpenCategory('${esc13(c[0])}')"><span>${c[2]}</span><span>${esc13(c[1])}<small>Voir les professionnels →</small></span></button>`}
 window.servicesDirectory=function(a){if(!a)return;a.innerHTML=`<div class="section-head"><h2>Annuaire des services</h2><button class="textbtn" onclick="go('home')">Accueil</button></div><p class="muted">Trouvez des professionnels et services vérifiés au Bénin, classés par activité.</p><div class="bm13-servicegrid">${cats.map(serviceButton).join('')}</div>`;};
 function decorateHome(){const a=$('#app');if(!a||a.dataset.bm13==='1')return;a.dataset.bm13='1';
  // Accueil épuré : recherche conservée, commune intégrée à la recherche.
  const oldSearch=a.querySelector('.top-search');
  if(oldSearch){oldSearch.outerHTML=`<div class="bm13-search bm13-search-clean"><div class="bm13-search-main"><span aria-hidden="true">⌕</span><input aria-label="Rechercher" placeholder="Rechercher un produit, une catégorie…" value="${esc13(query)}" oninput="query=this.value;drawHome()"><button type="button" class="bm13-location-trigger" onclick="document.getElementById('bm13-commune-select').focus()" aria-label="Choisir une commune">⌖</button></div><select id="bm13-commune-select" aria-label="Toutes les communes" onchange="selectedCommune=this.value;drawHome()">${COMMUNES.map(c=>`<option ${c===selectedCommune?'selected':''}>${esc13(c)}</option>`).join('')}</select></div>`;}
  // Enlever les anciens blocs filtres/communes de l'accueil uniquement.
  a.querySelectorAll('button,select,label,div,p,h2').forEach(el=>{if(el.closest('.bm13-search'))return;const t=(el.innerText||el.textContent||'').trim().toLowerCase();if((t==='filtres'||t==='commune'||t==='toutes les communes'||t==='toutes les communes ⌄') && el.children.length<3)el.remove();});
  // Le bandeau prend de la place : les catégories viennent immédiatement sous la recherche.
  const hero=a.querySelector('.hero');if(hero)hero.remove();
  const grid=a.querySelector('.catgrid');
  if(grid){const nine=[['Pour vous','✦','Toutes'],['Immobilier','⌂','Immobilier'],['Maison & jardin','⌂','Maison & Déco'],['Auto & moto','🚘','Véhicules'],['Mode & beauté','♧','Mode & Beauté'],['Électronique','▣','Électronique'],['Emploi','💼','Autres'],['Services','🧰','SERVICES'],['Autres','＋','Autres']];
   grid.outerHTML=`<section class="bm13-category-wrap"><div class="bm13-cats" id="bm13-cats" aria-label="Catégories">${nine.map((c,i)=>`<button class="bm13-cat" onclick="${c[2]==='SERVICES'?"go('services')":"category='"+c[2]+"';go('ads')"}"><span>${c[1]}</span>${c[0]}</button>`).join('')}</div><button type="button" class="bm13-cat-expand" aria-label="Afficher toutes les catégories" aria-expanded="false" onclick="const w=this.closest('.bm13-category-wrap');w.classList.toggle('expanded');this.setAttribute('aria-expanded',w.classList.contains('expanded'));this.textContent=w.classList.contains('expanded')?'⌃':'⌄'">⌄</button></section>`;
  }
  const section=[...a.querySelectorAll('.section-head')].find(x=>x.textContent.includes('Annonces récentes'));if(section){section.innerHTML='<h2>Annonces récentes</h2><button class="textbtn" onclick="go(\'ads\')">Voir les annonces →</button>';}
 }
 // Icône de notification vectorielle cohérente sur tout le site.
 const bell=document.querySelector('header .iconbtn');if(bell){bell.classList.add('bm13-bell');bell.innerHTML='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M18 8a6 6 0 0 0-12 0c0 7-3 7-3 9h18c0-2-3-2-3-9"/><path d="M10 21h4"/></svg>';bell.setAttribute('aria-label','Notifications');}
 // Le lien Annuaire est déplacé du profil vers un accès dédié, sans supprimer Mes demandes.
 const oldProfile13=profilePage;profilePage=function(a){oldProfile13(a);const panels=[...a.querySelectorAll('.panel')];const directory=panels.find(p=>p.textContent.includes('Annuaire des services et professionnels'));if(directory){directory.innerHTML='<h3>🌐 Services professionnels</h3><p class="muted">Les 30 annuaires sont regroupés dans un espace unique.</p><button class="btn" onclick="go(\'services\')">Voir les services professionnels →</button><button class="menuitem" onclick="bm101RequestsPage($(\'#app\'))">📄 Mes demandes <span class="arrow">›</span></button>';}}
 // Publication : détails vendeur/produit utiles, état et prix négociable.
 const oldPublish13=publishPage;publishPage=function(a){oldPublish13(a);const form=$('#pubform');if(!form||$('#bm13condition'))return;const price=$('#price')?.parentElement;if(price)price.insertAdjacentHTML('afterend',`<label>État du produit<select id="bm13condition"><option value="Neuf">Neuf</option><option value="Très bon état">Très bon état</option><option value="Bon état">Bon état</option><option value="État satisfaisant">État satisfaisant</option><option value="À réparer">À réparer</option></select></label><label>Prix négociable ?<select id="bm13negotiable"><option value="true">Oui, offres raisonnables acceptées</option><option value="false">Non, prix ferme</option></select></label><label>Marque / modèle (facultatif)<input id="bm13brand" maxlength="100" placeholder="Marque, modèle, référence"></label><label>Informations complémentaires<textarea id="bm13details" rows="3" maxlength="1200" placeholder="Dimensions, accessoires, garantie, défauts, disponibilité…"></textarea></label><p class="bm13-formhint">Décrivez précisément l’article, son état et les éventuels défauts pour rassurer les acheteurs.</p>`);const f=$('#pubform');const oldSubmit=publish;publish=async function(e){const formData={condition:$('#bm13condition')?.value,negotiable:$('#bm13negotiable')?.value==='true',brand:$('#bm13brand')?.value.trim(),extra:$('#bm13details')?.value.trim()};const d=$('#description');if(d){d.value=[d.value,formData.condition?'État : '+formData.condition:'',formData.brand?'Marque / modèle : '+formData.brand:'',formData.extra?'Détails : '+formData.extra:'',formData.negotiable?'Prix négociable':'Prix ferme'].filter(Boolean).join('\n');}return oldSubmit(e);};};
 // Paiement : recherche par identifiant court et affichage automatique du prix exact.
 paymentPage=function(a){a.innerHTML=`<div class="section-head"><h2>🔒 Paiement sécurisé</h2></div><div class="panel"><div class="statusline">Vérifiez l’annonce et son prix avant de poursuivre. Aucun débit réel n’est effectué ici.</div><form id="bm13payform"><label>Identifiant de l’annonce<input id="bm13adid" required maxlength="8" placeholder="Ex. A1B2C3D4"></label><div id="bm13adinfo" class="bm13-pricebox">Saisissez l’identifiant pour retrouver le montant.</div><label>Adresse ou point de remise<input id="bm13address" required placeholder="Quartier, ville, point de rencontre"></label><label>Méthode souhaitée<select id="bm13method"><option>Mobile Money</option><option>Carte bancaire</option><option>Portefeuille</option><option>Paiement à la remise</option></select></label><button class="btn" id="bm13paybtn" disabled>Continuer</button></form><p class="bm13-formhint">Le paiement réel nécessite une intégration serveur et la vérification du prestataire.</p></div>`;let found=null;const lookup=()=>{const key=$('#bm13adid').value.trim().toUpperCase();found=ads.find(x=>String(x.public_code||'').toUpperCase()===key||String(x.id).replace(/-/g,'').slice(0,8).toUpperCase()===key);$('#bm13adinfo').innerHTML=found?`<b>${esc13(found.title)}</b><small>Annonce : ${esc13(found.public_code||key)}</small><strong>${money(found.price)}</strong>`:'<span class="muted">Annonce introuvable ou identifiant incorrect.</span>';$('#bm13paybtn').disabled=!found||found.sold;};$('#bm13adid').addEventListener('input',lookup);if(currentAd){$('#bm13adid').value=currentAd.public_code||String(currentAd.id).replace(/-/g,'').slice(0,8).toUpperCase();lookup();}$('#bm13payform').onsubmit=async e=>{e.preventDefault();if(!found||!user)return toast('Connectez-vous et vérifiez l’annonce.');const method=$('#bm13method').value;if(method==='Mobile Money')return toast('Le paiement Mobile Money sera disponible après activation du prestataire serveur.');if(method==='Portefeuille')return toast('Choisissez la carte ou le portefeuille interne dans le parcours de paiement existant.');try{await rpc11('bm_v11_checkout',{p_ad_id:found.id,p_method:method==='Carte bancaire'?'card':'wallet',p_delivery_address:$('#bm13address').value.trim()});toast('Commande enregistrée.');go('purchases')}catch(err){toast('Commande non finalisée : '+(err.message||'vérifiez votre solde et la configuration SQL V12.'))}};};
 // Bouton d’offre de prix sur les annonces négociables.
 const oldOpen13=openAd;openAd=function(id){oldOpen13(id);const ad=ads.find(x=>String(x.id)===String(id));const sheet=$('#modal .sheet');if(!ad||!sheet)return;const negotiable=/prix négociable/i.test(ad.description||'');if(negotiable){const b=document.createElement('button');b.className='btn ghost';b.textContent='Proposer un autre prix';b.onclick=()=>{if(!user)return toast('Connectez-vous pour négocier.');const amount=Number(prompt('Votre proposition en FCFA',String(ad.price)));if(!Number.isInteger(amount)||amount<1||amount>=Number(ad.price))return toast('Proposition invalide : indiquez un prix inférieur.');sb.from('bm_price_offers').insert({ad_id:ad.id,buyer_id:user.id,seller_id:ad.seller_id,offered_price:amount,status:'pending'}).then(({error})=>toast(error?'Impossible d’envoyer l’offre : '+error.message:'Votre proposition a été envoyée au vendeur.'));};const contact=[...sheet.querySelectorAll('button')].find(x=>x.textContent.includes('Contacter le vendeur'));if(contact)contact.insertAdjacentElement('afterend',b);}}
 // Boost : toutes les annonces du compte sont proposées, avec un bouton dédié.
 const oldBoost13=boostPage;boostPage=function(a){oldBoost13(a);const mine=ads.filter(x=>x.seller_id===user?.id&&!x.sold);const section=document.createElement('section');section.className='panel';section.innerHTML='<h3>Mes annonces éligibles au boost</h3>'+ (mine.map(x=>`<div class="notice"><div><b>${esc13(x.title)}</b><p class="muted">${money(x.price)} · ${esc13(x.city||'')}</p><button class="btn" onclick="bm13PrepareBoost('${esc13(x.id)}')">🚀 Booster cette annonce</button></div></div>`).join('')||'<p class="muted">Aucune annonce active à booster.</p>');a.appendChild(section);};window.bm13PrepareBoost=id=>{const s=$('#app select');if(s){s.value=id;s.dispatchEvent(new Event('change',{bubbles:true}));}toast('Annonce sélectionnée. Choisissez la durée et le budget dans le formulaire de boost.');};
 // Admin : tableau de bord structuré avec raccourcis vers tous les modules de validation existants.
 function decorateAdmin(){const host=$('#bmadmincontent');if(!host||$('#bm13admin'))return;const panel=document.createElement('section');panel.id='bm13admin';panel.className='panel';panel.innerHTML='<h3>Centre de validation — V13</h3><p class="muted">Accès organisé aux demandes déjà gérées par les modules administrateur.</p><div class="bm13-adminnav"><button onclick="bmAdminPage()">🏢 Comptes professionnels & annuaire</button><button onclick="bmRequests(\'job\')">💼 Offres d’emploi</button><button onclick="bmRequests(\'dating\')">💞 Rencontres</button><button onclick="bmRequests(\'boost\')">🚀 Boosts</button><button onclick="bmRequests(\'card\')">💳 Cartes virtuelles</button><button onclick="bmRequests(\'wallet\')">💰 Recharges & retraits</button><button onclick="bmManageAds()">🛍️ Annonces</button><button onclick="bmManageUsers()">👥 Utilisateurs</button><button onclick="bmAdminPage()">🚚 Livreurs & signalements</button></div><p class="bm13-formhint">Les validations sont réalisées par les fonctions administrateur déjà installées. Les rubriques de services sont visibles dans le module des comptes professionnels.</p>';host.prepend(panel);}
 const adminObs13=new MutationObserver(()=>{if(page==='admin')decorateAdmin()});adminObs13.observe(document.getElementById('app'),{childList:true,subtree:true});
 function decorateMessages(){const h=$('#app');if(!h||h.dataset.bm13chat)return;h.dataset.bm13chat='1';const title=h.querySelector('.section-head');if(title){const p=document.createElement('p');p.className='muted';p.textContent='Vos conversations, messages non lus et échanges avec les vendeurs sont regroupés ici.';title.insertAdjacentElement('afterend',p);}}
 window.bm13DeleteCard=async id=>{if(!confirm('Supprimer cette carte ? Seules les cartes rejetées ou en attente peuvent être supprimées.'))return;try{await rpc11('bm_v13_delete_my_card',{p_card_id:id});toast('Carte supprimée.');virtualCardPage($('#app'))}catch(e){toast('Suppression impossible : '+(e.message||'vérifiez le SQL V13.'))}};
 // Les notifications de navigation restent reliées au centre existant.
